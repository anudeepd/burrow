name: Burrow CI and Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Run all checks, apply the selected version bump, and publish to GitHub Releases and PyPI
        required: true
        type: boolean
        default: false
      build_wheels:
        description: Build and smoke-test all platform wheels without publishing a release
        required: false
        type: boolean
        default: false
      bump:
        description: Version increment to apply when publishing
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      refresh_linux_snapshots:
        description: Regenerate Linux Playwright screenshots for review (release runs do this automatically)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: burrow-ci-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # ---------------------------------------------------------------- web build
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Validate release branch before refreshing baselines
        if: ${{ inputs.publish }}
        run: |
          if [[ "$GITHUB_REF_TYPE" != "branch" || "$GITHUB_REF_NAME" != "master" ]]; then
            echo "Dispatch this workflow from master to publish and refresh Linux screenshots." >&2
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - name: install
        working-directory: web
        run: bun install --frozen-lockfile
      - name: lint
        working-directory: web
        run: bun run lint
      - name: typecheck
        working-directory: web
        run: bun run typecheck
      - name: unit tests
        working-directory: web
        run: bun run test
      - name: install Chromium and Firefox for browser regressions
        working-directory: web
        run: bunx playwright install --with-deps chromium firefox
      - name: Refresh Linux screenshots for a release or review
        if: ${{ inputs.publish || inputs.refresh_linux_snapshots }}
        working-directory: web
        env:
          PW_SNAPSHOT_DIR: e2e/__screenshots__/linux
        run: bun run e2e --project=chromium --no-deps --grep '@snapshot' --update-snapshots
      - name: Verify browser regressions against refreshed Linux baselines
        working-directory: web
        env:
          PW_SNAPSHOT_DIR: e2e/__screenshots__/linux
          PW_WEB_DIR: dist
        run: bun run e2e --project=firefox
      - name: Upload refreshed Linux screenshots
        if: ${{ always() && (inputs.refresh_linux_snapshots || inputs.publish) }}
        uses: actions/upload-artifact@v7
        with:
          name: linux-snapshots
          path: web/e2e/__screenshots__/linux
          if-no-files-found: error
          retention-days: 7
      - name: bundle budget
        working-directory: web
        run: bun run scripts/check-bundle-budget.ts

  # Build the SPA artifact separately so Rust checks can run while the longer
  # browser regression suite is still executing in the web job.
  web-assets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - name: install
        working-directory: web
        run: bun install --frozen-lockfile
      - name: build (SPA)
        working-directory: web
        run: bun run build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist/client

  # Release runs commit the Ubuntu-generated baselines before platform builds and release tags are produced.
  # GITHUB_TOKEN pushes do not start another push workflow, so downstream jobs check this source SHA directly.
  linux-snapshot-baselines:
    if: ${{ inputs.publish }}
    needs: web
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    outputs:
      source_sha: ${{ steps.commit.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Download refreshed Linux screenshot baselines
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name linux-snapshots --dir web/e2e/__screenshots__/linux
      - name: Commit refreshed Linux screenshot baselines
        id: commit
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" != "branch" || "$GITHUB_REF_NAME" != "master" ]]; then
            echo "Refusing to commit Linux screenshots outside master." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/e2e/__screenshots__/linux
          if git diff --cached --quiet; then
            source_sha="$GITHUB_SHA"
            echo "Linux screenshots already match the current baseline."
          else
            git commit -m "test: refresh Linux Playwright baselines"
            git push origin "HEAD:refs/heads/master"
            source_sha="$(git rev-parse HEAD)"
          fi
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

  # -------------------------------------------------------------- rust checks
  rust:
    needs: [web-assets]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Download web assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name web-dist --dir crates/burrow/assets
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # offline tests only: live-cluster tests are gated on BURROW_LIVE=1
      - run: cargo test --workspace

  # ------------------------------------------------------------- build version
  release-version:
    name: Calculate build version
    needs: [web, rust, parity-replay, linux-snapshot-baselines]
    if: ${{ (inputs.publish || inputs.build_wheels) && always() && needs.web.result == 'success' && needs.rust.result == 'success' && needs.parity-replay.result == 'success' && (needs.linux-snapshot-baselines.result == 'success' || needs.linux-snapshot-baselines.result == 'skipped') }}
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.linux-snapshot-baselines.outputs.source_sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Calculate wheel version
        id: version
        env:
          PUBLISH: ${{ inputs.publish }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH" == "true" ]]; then
            version="$(python scripts/release_version.py next --bump "$BUMP")"
            tag="v$version"
            set +e
            git ls-remote --exit-code --refs origin "refs/tags/$tag" >/dev/null
            status=$?
            set -e
            if [[ "$status" -eq 0 ]]; then
              echo "::error::Release tag $tag already exists."
              exit 1
            elif [[ "$status" -ne 2 ]]; then
              exit "$status"
            fi
          else
            version="$(python scripts/release_version.py current)"
            tag=""
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------- wheels
  wheel:
    needs: [web, rust, linux-snapshot-baselines, parity-replay, release-version]
    if: ${{ (inputs.publish || inputs.build_wheels) && always() && needs.web.result == 'success' && needs.rust.result == 'success' && needs.parity-replay.result == 'success' && needs.release-version.result == 'success' && (needs.linux-snapshot-baselines.result == 'success' || needs.linux-snapshot-baselines.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu # manylinux
            runner: ubuntu-24.04
            docker_options: --env=PIP_ROOT_USER_ACTION=ignore
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            docker_options: --env=PIP_ROOT_USER_ACTION=ignore
          - target: x86_64-unknown-linux-musl # musllinux (alpine images)
            runner: ubuntu-24.04
            docker_options: --env=PIP_ROOT_USER_ACTION=ignore
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.linux-snapshot-baselines.outputs.source_sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: wheel-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Download web assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name web-dist --dir crates/burrow/assets
      - name: Set release version in wheel build
        env:
          RELEASE_VERSION: ${{ needs.release-version.outputs.version }}
        shell: bash
        run: python scripts/release_version.py set "$RELEASE_VERSION"
      - uses: PyO3/maturin-action@v1
        env:
          # This is a Cargo workspace, so its target directory is at the repo root.
          # Supplying it avoids maturin-action's extra cargo metadata probe.
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          docker-options: ${{ matrix.docker_options || '' }}
          sccache: true
          command: build
          args: --release --manifest-path crates/burrow/Cargo.toml --out dist --compatibility ${{ startsWith(matrix.target, 'x86_64-unknown-linux-musl') && 'musllinux_1_2' || '' }}
      - name: Install and smoke-test wheel on its native runner
        if: matrix.target != 'x86_64-unknown-linux-musl'
        env:
          RELEASE_VERSION: ${{ needs.release-version.outputs.version }}
        run: python scripts/smoke_release_wheel.py dist
      - name: Install and smoke-test musllinux wheel
        if: matrix.target == 'x86_64-unknown-linux-musl'
        env:
          RELEASE_VERSION: ${{ needs.release-version.outputs.version }}
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE/dist:/dist:ro" \
            --volume "$GITHUB_WORKSPACE/scripts/smoke_release_wheel.py:/smoke_release_wheel.py:ro" \
            --env RELEASE_VERSION \
            --env PIP_ROOT_USER_ACTION=ignore \
            python:3.12-alpine \
            python /smoke_release_wheel.py /dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl

  # ------------------------------------------------------------ parity replay
  # The differential parity proof (PLAN §8) runs from recorded fixtures, so CI
  # needs no Hadoop cluster: P1 REST-key coverage, P2 legacy-vs-ours, P3 wire.
  parity-replay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.linux-snapshot-baselines.outputs.source_sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - name: install harness
        working-directory: parity/harness
        run: bun install --frozen-lockfile
      - name: install chromium for playwright
        working-directory: parity/harness
        run: bunx playwright install --with-deps chromium
      - name: replay recorded fixtures and assert parity
        working-directory: parity/harness
        run: bun run run.mjs --fixtures fixtures/parity/live --assert-no-network --report parity/report
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: parity-report
          path: parity/report

  # ------------------------------------------------------------ release files
  prepare-release:
    if: ${{ inputs.publish }}
    name: Commit version and prepare release files
    needs: [wheel, parity-replay, linux-snapshot-baselines, release-version]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    outputs:
      version: ${{ needs.release-version.outputs.version }}
      tag: ${{ needs.release-version.outputs.tag }}
      source_sha: ${{ steps.commit.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.linux-snapshot-baselines.outputs.source_sha || github.sha }}
      - name: Download wheels built by this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for target in \
            x86_64-unknown-linux-gnu \
            aarch64-unknown-linux-gnu \
            x86_64-unknown-linux-musl \
            aarch64-apple-darwin \
            x86_64-apple-darwin \
            x86_64-pc-windows-msvc
          do
            gh run download "$GITHUB_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name "wheel-$target" \
              --dir dist
          done
      - name: Verify exact wheel target set
        env:
          VERSION: ${{ needs.release-version.outputs.version }}
        run: python3 scripts/verify_release_wheels.py dist "$VERSION"
      - name: Save validated release files
        uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 30
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Commit synchronized version bump to master
        id: commit
        env:
          RELEASE_VERSION: ${{ needs.release-version.outputs.version }}
          RELEASE_TAG: ${{ needs.release-version.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" != "branch" || "$GITHUB_REF_NAME" != "master" ]]; then
            echo "Refusing to commit a release version outside master." >&2
            exit 1
          fi
          python scripts/release_version.py set "$RELEASE_VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml Cargo.toml Cargo.lock crates/burrow/Cargo.toml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "::error::The release version did not change any manifests."
            exit 1
          fi
          git commit -m "chore(release): $RELEASE_TAG"
          git push origin HEAD:refs/heads/master
          source_sha="$(git rev-parse HEAD)"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

  github-release:
    if: ${{ inputs.publish }}
    name: Attach wheels to GitHub Release
    needs: prepare-release
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download validated wheels
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name release-dist --dir dist
      - name: Create GitHub Release and attach wheels
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          gh release create "$TAG" dist/*.whl \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ needs.prepare-release.outputs.source_sha }}" \
            --title "Burrow $TAG" \
            --generate-notes

  pypi-publish:
    if: ${{ inputs.publish }}
    name: Publish wheels to PyPI
    needs: prepare-release
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/yarn-burrow/
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Download validated wheels
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name release-dist --dir dist
      - name: Publish yarn-burrow to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

