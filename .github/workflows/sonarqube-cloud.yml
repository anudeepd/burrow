name: SonarQube Cloud

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Run web tests with LCOV coverage
        working-directory: web
        run: bun run test:coverage

      - name: Normalize web coverage paths for SonarQube Cloud
        run: node scripts/normalize-sonar-lcov.mjs

      - name: Build web assets for Rust tests
        working-directory: web
        run: bun run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Run Rust tests with LCOV coverage
        run: |
          mkdir -p coverage
          cargo llvm-cov --workspace --lcov --output-path coverage/rust.lcov

      - name: Authenticate to SonarQube Cloud
        id: sonar-auth
        uses: SonarSource/sonarqube-auth-action@v1

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@v7
        with:
          skipSignatureVerification: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for SonarQube Cloud quality gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        with:
          pollingTimeoutSec: 600

      - name: Require 100% coverage and zero duplication
        run: node web/scripts/check-sonar-quality.mjs
        env:
          SONAR_PROJECT_KEY: ${{ steps.sonar-auth.outputs.project-key }}
