name: SonarQube Cloud

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  check-token:
    runs-on: ubuntu-24.04
    outputs:
      configured: ${{ steps.token.outputs.configured }}
    steps:
      - name: Check for the SonarQube Cloud token
        id: token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [[ -n "$SONAR_TOKEN" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=SonarQube Cloud setup::Add the repository Actions secret SONAR_TOKEN to enable analysis."
          fi

  analyze:
    needs: check-token
    if: needs.check-token.outputs.configured == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Run web tests with LCOV coverage
        working-directory: web
        run: bun run test:coverage

      - name: Normalize web coverage paths for SonarQube Cloud
        run: node scripts/normalize-sonar-lcov.mjs

      - name: Build web assets for Rust tests
        working-directory: web
        run: bun run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Run Rust tests with LCOV coverage
        run: |
          mkdir -p coverage
          cargo llvm-cov --workspace --lcov --output-path coverage/rust.lcov

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@v7
        with:
          skipSignatureVerification: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
