      format: float-1dp
      normaliser: na-as-null
      nullDisplay: N/A
      source: RMAppsBlock.java:76
      note: no % sign in the cell
    - id: legacy.rm.apps.table.cluster-pct
      label: '% of Cluster'
      kind: column
