- id: legacy.rm.scheduler.fifo
  daemon: rm
  route: /cluster/scheduler
  title: FIFO Scheduler
  classes:
  - RmController#scheduler
  - DefaultSchedulerPage
  - QueueInfoBlock
  - QueuesBlock
  - MetricsOverviewTable
  - AppsBlock
  when:
  - scheduler=fifo
  includes:
  - legacy.rm.shared.chrome
  - legacy.rm.shared.metrics
  sections:
  - id: legacy.rm.scheduler.fifo.page
    title: null
    source: RmController.java:101
    items:
    - id: legacy.rm.scheduler.fifo.page.title
      label: FIFO Scheduler
      kind: title
      field: static.page.scheduler.title
      format: none
      source: RmController.java:101
      note: setTitle('FIFO Scheduler')
  - id: legacy.rm.scheduler.fifo.queues
    title: FifoScheduler Queue
    source: DefaultSchedulerPage.java:84
    items:
    - id: legacy.rm.scheduler.fifo.queues.heading
      label: FifoScheduler Queue
      kind: title
      field: static.section.fifoSchedulerQueue
      format: none
      source: DefaultSchedulerPage.java:84
      note: div.ui-widget-header of div#cs-wrapper
    - id: legacy.rm.scheduler.fifo.queues.fallback-bar
      label: '100% '
      kind: chart
      field: static.bar.defaultQueue
      format: none
      when:
      - other:fs == null
      scenario: scheduler not yet initialised
      source: DefaultSchedulerPage.java:92
      note: fallback bar labelled 'default'
    - id: legacy.rm.scheduler.fifo.queues.bar
      label: null
      dynamic: true
      kind: chart
      field: scheduler.usedCapacity
      fields:
      - scheduler.capacity
      rest:
        resource: rm.scheduler
        path: scheduler.schedulerInfo.usedCapacity
      derivation: used = sinfo.getUsedCapacity(); set = sinfo.getCapacity(); delta = Math.abs(set-used)+0.001; title = "used:" + formatPercent(used,1)
      format: percent-1dp
      normaliser: percent
      source: DefaultSchedulerPage.java:99-106
      tooltip: 'used:'
      note: fixed-width anchor 100%; inner span width delta, OVER when used>set else UNDER, left(set) or left(used)
    - id: legacy.rm.scheduler.fifo.queues.name
      label: null
      kind: text
      field: scheduler.queueName
      rest:
        resource: rm.scheduler
        path: scheduler.schedulerInfo.queueName
      format: none
      source: DefaultSchedulerPage.java:105
      note: qName from fs.getQueueInfo("",false,false).getQueueName() (default 'default')
  - id: legacy.rm.scheduler.fifo.queueinfo
    title: null
    source: DefaultSchedulerPage.java:55
    when:
    - scheduler=fifo
    scenario: scheduler != null (queue info block nested under the bar)
    items:
    - id: legacy.rm.scheduler.fifo.queueinfo.title
      label: ' Queue Status'
      dynamic: true
      kind: title
      field: scheduler.queueName
      rest:
        resource: rm.scheduler
        path: scheduler.schedulerInfo.queueName
      derivation: '"''" + sinfo.getQueueName() + "'' Queue Status"'
      format: none
      source: DefaultSchedulerPage.java:55
    - id: legacy.rm.scheduler.fifo.queueinfo.queue-state
      label: 'Queue State:'
      kind: kv
      field: scheduler.qstate
      rest:
        resource: rm.scheduler
        path: scheduler.schedulerInfo.qstate
      derivation: sinfo.getState() => qstate.toString()
      format: enum
      source: DefaultSchedulerPage.java:56
      note: QueueState RUNNING/STOPPED/DRAINING
    - id: legacy.rm.scheduler.fifo.queueinfo.min-memory
      label: 'Minimum Queue Memory Capacity:'
      kind: kv
      field: scheduler.minQueueMemoryCapacity
      rest:
        resource: rm.scheduler
        path: scheduler.schedulerInfo.minQueueMemoryCapacity
      derivation: Long.toString(sinfo.getMinQueueMemoryCapacity())
      format: int
      unit: MB
      normaliser: int
      source: DefaultSchedulerPage.java:57
      note: raw MB number, no unit suffix
    - id: legacy.rm.scheduler.fifo.queueinfo.max-memory
      label: 'Maximum Queue Memory Capacity:'
      kind: kv
      field: scheduler.maxQueueMemoryCapacity
      rest:
        resource: rm.scheduler
        path: scheduler.schedulerInfo.maxQueueMemoryCapacity
      derivation: Long.toString(sinfo.getMaxQueueMemoryCapacity())
      format: int
      unit: MB
      normaliser: int
      source: DefaultSchedulerPage.java:58
      note: raw MB number
    - id: legacy.rm.scheduler.fifo.queueinfo.num-nodes
      label: 'Number of Nodes:'
      kind: kv
      field: scheduler.numNodes
      rest:
        resource: rm.scheduler
        path: scheduler.schedulerInfo.numNodes
      derivation: Integer.toString(sinfo.getNumNodes())
      format: int
      normaliser: int
      source: DefaultSchedulerPage.java:59
    - id: legacy.rm.scheduler.fifo.queueinfo.used-node-capacity
      label: 'Used Node Capacity:'
      kind: kv
      field: scheduler.usedNodeCapacity
      rest:
        resource: rm.scheduler
        path: scheduler.schedulerInfo.usedNodeCapacity
      derivation: sum of getUsedResource().getMemorySize() over RM nodes; Integer.toString
      format: int
      normaliser: int
      source: DefaultSchedulerPage.java:60
      note: MB sum stored in an int
    - id: legacy.rm.scheduler.fifo.queueinfo.avail-node-capacity
      label: 'Available Node Capacity:'
      kind: kv
      field: scheduler.availNodeCapacity
      rest:
        resource: rm.scheduler
        path: scheduler.schedulerInfo.availNodeCapacity
      derivation: sum of getAvailableResource().getMemorySize() over RM nodes; Integer.toString
      format: int
      normaliser: int
      source: DefaultSchedulerPage.java:61
    - id: legacy.rm.scheduler.fifo.queueinfo.total-node-capacity
      label: 'Total Node Capacity:'
      kind: kv
      field: scheduler.totalNodeCapacity
      rest:
        resource: rm.scheduler
        path: scheduler.schedulerInfo.totalNodeCapacity
      derivation: sum of ni.getTotalCapability().getMemorySize() over RM nodes; Integer.toString
      format: int
      normaliser: int
      source: DefaultSchedulerPage.java:62
    - id: legacy.rm.scheduler.fifo.queueinfo.num-containers
      label: 'Number of Node Containers:'
      kind: kv
      field: scheduler.numContainers
      rest:
        resource: rm.scheduler
        path: scheduler.schedulerInfo.numContainers
      derivation: sum of getNodeReport(nodeID).getNumContainers(); Integer.toString
      format: int
      normaliser: int
      source: DefaultSchedulerPage.java:63
  - id: legacy.rm.scheduler.fifo.apps
    title: null
    source: DefaultSchedulerPage.java:112
    when:
    - scheduler=fifo
    items:
    - id: legacy.rm.scheduler.fifo.apps.block
      label: null
      kind: text
      field: static.block.appsTable
      format: none
      source: DefaultSchedulerPage.java:112
      note: 'renders the shared yarn-server-common AppsBlock #apps applications table (columns inventoried under legacy.rm.apps.table); filtered by APP_STATE = NEW,NEW_SAVING,SUBMITTED,ACCEPTED,RUNNING set in RmController#scheduler'
  sourceFiles:
  - parity/inventory/src/legacy-scheduler.yaml
