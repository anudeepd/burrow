  - id: legacy.rm.shared.metrics.user
    title: 'User Metrics for '
    source: 'MetricsOverviewTable.java:157-161 (renders only when request().getRemoteUser() != null and new UserMetricsInfo(rm, user).metricsAvailable(), i.e. root QueueMetrics holds a per-user entry); per-user metrics exist only when enableUserMetrics: Fair hardcodes true (FSQueue.java:95), Capacity needs yarn.scheduler.capacity.user-metrics.enable=true (CapacitySchedulerConfiguration.ENABLE_USER_METRICS default false, AbstractCSQueue.java:153, QueueMetrics.java:287-290)'
    when:
