      rest:
        resource: rm.apps
        path: apps.app[].progress
      derivation: percent = StringUtils.format("%.1f", app.getProgress()); bar width=percent%, title attr = percent + "%"
      format: progress-bar
      normaliser: percent
      source: RMAppsBlock.java:78
      note: progress = report.getProgress()*100 (AppInfo.java:138); REST progress = RMApp.getProgress()*100 - same source value; 1-dp rounding
    - id: legacy.rm.apps.table.tracking-ui
