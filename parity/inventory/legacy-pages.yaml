      fields:
      - scheduler.health.lastRunDetails.resources.memory
      - scheduler.health.lastRunDetails.resources.vCores
      rest:
        resource: rm.scheduler
        path: scheduler.schedulerInfo.health.lastRunDetails[].count
      derivation: 'lastRunDetails entry with operation == ''reservations'': count + " - " + resources.toString()'
      format: other:count + ' - ' + resource-string
      normaliser: none
      source: CapacitySchedulerPage.java:579
    - id: legacy.rm.scheduler.capacity.health.lastrun-releases
      label: Releases(count - resources)
      kind: column
      field: scheduler.health.lastRunDetails.count
      fields:
      - scheduler.health.lastRunDetails.resources.memory
      - scheduler.health.lastRunDetails.resources.vCores
      rest:
        resource: rm.scheduler
        path: scheduler.schedulerInfo.health.lastRunDetails[].count
      derivation: 'lastRunDetails entry with operation == ''releases'': count + " - " + resources.toString()'
      format: other:count + ' - ' + resource-string
      normaliser: none
      source: CapacitySchedulerPage.java:580
    - id: legacy.rm.scheduler.capacity.health.detail-heading
      label: 'Last '
      dynamic: true
      kind: title
      field: scheduler.health.operationsInfo.operation
      rest:
        resource: rm.scheduler
        path: scheduler.schedulerInfo.health.operationsInfo[].operation
      derivation: '"Last " + entry.getKey() for keys Allocation|Reservation|Release|Preemption'
      format: none
      source: CapacitySchedulerPage.java:607
      note: 'one table each for #Allocation, #Reservation, #Release, #Preemption; note DAO operation strings are ''last-allocation'',''last-reservation'',''last-release'',''last-preemption'''
    - id: legacy.rm.scheduler.capacity.health.detail-time
      label: Time
      kind: column
      field: scheduler.derived.lastOperationTimestamp
      rest: null
      derivation: Times.format(di.getTimestamp())
      format: epoch-datetime
      normaliser: epoch
      nullDisplay: N/A
      source: CapacitySchedulerPage.java:610
      restGap: true
    - id: legacy.rm.scheduler.capacity.health.detail-container-id
      label: Container Id
      kind: column
      field: scheduler.health.operationsInfo.containerId
      rest:
        resource: rm.scheduler
        path: scheduler.schedulerInfo.health.operationsInfo[].containerId
      derivation: containerId = "N/A" when di.getContainerId() == null, else di.getContainerId().toString()
      format: none
      nullDisplay: N/A
      source: CapacitySchedulerPage.java:611
    - id: legacy.rm.scheduler.capacity.health.detail-node-id
      label: Node Id
      kind: column
      field: scheduler.health.operationsInfo.nodeId
      rest:
        resource: rm.scheduler
        path: scheduler.schedulerInfo.health.operationsInfo[].nodeId
      derivation: nodeId = "N/A" when di.getNodeId() == null, else di.getNodeId().toString()
      format: none
      nullDisplay: N/A
      source: CapacitySchedulerPage.java:612
    - id: legacy.rm.scheduler.capacity.health.detail-queue
      label: Queue
      kind: column
      field: scheduler.health.operationsInfo.queue
      rest:
        resource: rm.scheduler
        path: scheduler.schedulerInfo.health.operationsInfo[].queue
      nullDisplay: N/A
      format: none
      source: CapacitySchedulerPage.java:613
