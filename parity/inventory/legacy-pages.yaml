      format: none
      source: ContainerPage.java:34-36
      note: 'ContainerBlock.render re-sets join("Container ", containerid) (ContainerBlock.java:101). Error branches: puts("Bad request: requires container ID") ContainerBlock.java:60, puts("Invalid container ID: " + containerid) ContainerBlock.java:68, puts("Container not found: " + containerid) ContainerBlock.java:96'
    - id: legacy.rm.container.page.read-failed
      label: 'Failed to read the container '
      dynamic: true
      kind: text
      field: static.error.containerReadFailed
      fields:
      - container.containerId
      format: none
      derivation: '"Failed to read the container " + containerid + "."'
      when:
      - other:getContainerReport() throws
      source: ContainerBlock.java:88-90
      note: p element
  - id: legacy.rm.container.summary
    title: Container Overview
    source: ContainerBlock.java:103
    items:
    - id: legacy.rm.container.summary.title
      label: Container Overview
      kind: title
      field: static.section.containerOverview
      format: none
      source: ContainerBlock.java:103
      note: InfoBlock th colspan=2 (ResponseInfo.about())
    - id: legacy.rm.container.summary.state
      label: 'Container State:'
      kind: kv
      field: container.containerState
      rest:
        resource: rm.app.attempt.container
        path: container.containerState
      derivation: 'container.getContainerState() == null ? UNAVAILABLE : container.getContainerState()'
      format: enum
      nullDisplay: N/A
      source: ContainerBlock.java:104-107
      note: ContainerState name (NEW/RUNNING/COMPLETE)
    - id: legacy.rm.container.summary.exit-status
      label: 'Exit Status:'
      kind: kv
      field: container.containerExitStatus
      rest:
        resource: rm.app.attempt.container
        path: container.containerExitStatus
      format: int
      source: ContainerBlock.java:108
    - id: legacy.rm.container.summary.node
      label: 'Node:'
      kind: link
      field: container.nodeHttpAddress
      rest:
        resource: rm.app.attempt.container
        path: container.nodeHttpAddress
      derivation: 'nodeHttpAddress == null ? "#" : nodeHttpAddress; text = nodeHttpAddress or N/A'
      format: url
      nullDisplay: N/A
      normaliser: strip-scheme
      source: ContainerBlock.java:109-113
    - id: legacy.rm.container.summary.priority
      label: 'Priority:'
      kind: kv
      field: container.priority
      rest:
        resource: rm.app.attempt.container
        path: container.priority
      format: int
      source: ContainerBlock.java:115
    - id: legacy.rm.container.summary.started
      label: 'Started:'
      kind: kv
      field: container.startedTime
      rest:
        resource: rm.app.attempt.container
        path: container.startedTime
      derivation: Times.format(container.getStartedTime())
      format: epoch-datetime
      normaliser: epoch
      source: ContainerBlock.java:116
    - id: legacy.rm.container.summary.elapsed
      label: 'Elapsed:'
      kind: kv
      field: container.elapsedTime
      rest:
        resource: rm.app.attempt.container
        path: container.elapsedTime
      derivation: StringUtils.formatTime(Times.elapsed(container.getStartedTime(), container.getFinishedTime()))
      format: duration
      normaliser: duration
      source: ContainerBlock.java:117-120
      note: REST container.elapsedTime holds the same elapsed ms
    - id: legacy.rm.container.summary.resource
      label: 'Resource:'
      kind: kv
      field: container.derived.resourceText
      fields:
      - container.allocatedResources
      - container.allocatedMB
      - container.allocatedVCores
      rest:
        resource: rm.app.attempt.container
        path: container.allocatedResources
      derivation: getResources(container) => "<memoryMB> Memory, <vcores> VCores[, <value> <name>]"
      format: other:<n> Memory, <n> VCores
      source: ContainerBlock.java:120-122
      note: label is singular 'Resource:' (verbatim); custom resources appended after Memory/VCores
    - id: legacy.rm.container.summary.logs
      label: 'Logs:'
      kind: link
      field: container.logUrl
      rest:
        resource: rm.app.attempt.container
        path: container.logUrl
      derivation: 'logUrl == null ? "#" : logUrl; text "Logs" or "N/A"'
      format: url
      nullDisplay: N/A
      normaliser: url
      source: ContainerBlock.java:123-124
    - id: legacy.rm.container.summary.diagnostics
      label: 'Diagnostics:'
      kind: kv
      field: container.diagnosticsInfo
      rest:
        resource: rm.app.attempt.container
        path: container.diagnosticsInfo
      format: html-escaped
      nullDisplay: ''
      source: ContainerBlock.java:125-126
