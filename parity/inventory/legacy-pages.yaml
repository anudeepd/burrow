- id: legacy.rm.shared.metrics
  daemon: rm
  route: (included in /cluster/cluster, /cluster/apps*, /cluster/nodes*, /cluster/scheduler)
  title: (none; blocks)
  classes:
  - MetricsOverviewTable
  sections:
  - id: legacy.rm.shared.metrics.cluster
    title: Cluster Metrics
    source: MetricsOverviewTable.java:96
    items:
    - id: legacy.rm.shared.metrics.cluster.apps-submitted
      label: Apps Submitted
      kind: metric
      field: cluster.metrics.appsSubmitted
      rest:
        resource: rm.metrics
        path: clusterMetrics.appsSubmitted
      format: int
      normaliser: int
      source: MetricsOverviewTable.java:100
    - id: legacy.rm.shared.metrics.cluster.apps-pending
      label: Apps Pending
      kind: metric
      field: cluster.metrics.appsPending
      rest:
        resource: rm.metrics
        path: clusterMetrics.appsPending
      format: int
      normaliser: int
      source: MetricsOverviewTable.java:101
    - id: legacy.rm.shared.metrics.cluster.apps-running
      label: Apps Running
      kind: metric
      field: cluster.metrics.appsRunning
      rest:
        resource: rm.metrics
        path: clusterMetrics.appsRunning
      format: int
      normaliser: int
      source: MetricsOverviewTable.java:102
    - id: legacy.rm.shared.metrics.cluster.apps-completed
      label: Apps Completed
      kind: metric
      field: cluster.metrics.derived.appsCompletedAll
      fields:
      - cluster.metrics.appsCompleted
      - cluster.metrics.appsFailed
      - cluster.metrics.appsKilled
      rest:
        resource: rm.metrics
        path: clusterMetrics.appsCompleted
      derivation: String.valueOf(clusterMetrics.getAppsCompleted() + clusterMetrics.getAppsFailed() + clusterMetrics.getAppsKilled())
      format: int
      normaliser: int
      source: MetricsOverviewTable.java:103
    - id: legacy.rm.shared.metrics.cluster.containers-running
      label: Containers Running
      kind: metric
      field: cluster.metrics.containersAllocated
      fields:
      - cluster.metrics.totalAllocatedContainersAcrossPartition
      - cluster.metrics.crossPartitionMetricsAvailable
      rest:
        resource: rm.metrics
        path: clusterMetrics.containersAllocated
      derivation: 'allocatedContainers = crossPartitionMetricsAvailable ? getTotalAllocatedContainersAcrossPartition() : getContainersAllocated()'
      format: int
      normaliser: int
      source: MetricsOverviewTable.java:104
      note: value source switches on crossPartitionMetricsAvailable (true only for CapacityScheduler with a root queue)
      when:
      - scheduler=capacity
    - id: legacy.rm.shared.metrics.cluster.used-resources
      label: Used Resources
      kind: metric
      field: cluster.metrics.derived.usedResourcesText
      rest: null
      derivation: usedResources.getFormattedString()  (see derived declaration)
      format: resource-string
      normaliser: resource-string
      source: MetricsOverviewTable.java:105
      note: 'memory part is StringUtils.byteDesc (e.g. ''3 GB'', ''1.50 GB''); in the cross-partition branch reserved is subtracted: Resources.subtractFrom(usedResources, reservedResources)'
    - id: legacy.rm.shared.metrics.cluster.total-resources
      label: Total Resources
      kind: metric
      field: cluster.metrics.derived.totalResourcesText
      rest: null
      derivation: totalResources.getFormattedString()
      format: resource-string
      normaliser: resource-string
      source: MetricsOverviewTable.java:106
    - id: legacy.rm.shared.metrics.cluster.reserved-resources
      label: Reserved Resources
      kind: metric
      field: cluster.metrics.derived.reservedResourcesText
      rest: null
      derivation: reservedResources.getFormattedString()
      format: resource-string
      normaliser: resource-string
      source: MetricsOverviewTable.java:107
    - id: legacy.rm.shared.metrics.cluster.phys-mem-used
