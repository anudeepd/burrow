      format: none
      normaliser: lowercase
      source: RMAppsBlock.java:79
      note: link text 'Unassigned' | 'History' | 'ApplicationMaster'; REST trackingUI is 'UNASSIGNED'|...
    - id: legacy.rm.apps.table.tracking-href
      label: null
      kind: link
      field: app.trackingUrl
