pages:
- id: legacy.rm.app
  daemon: rm
  route: /cluster/app/{app.id}
  title: Application {app.id}
  titleDynamic: true
  classes:
  - RmController#app
  - AppPage
  - RMAppBlock
  - AppBlock
  includes:
  - legacy.rm.shared.chrome
  sections:
  - id: legacy.rm.app.page
    title: null
    source: AppPage.java:36-41
    items:
    - id: legacy.rm.app.page.title
      label: 'Application '
      dynamic: true
      kind: title
      field: static.page.app.title
      fields:
      - app.id
      rest:
        resource: rm.app
        path: app.id
      derivation: 'appId.isEmpty() ? "Bad request: missing application ID" : join("Application ", appId)'
      format: none
      source: AppPage.java:36-42
      note: '<title>/h1 = ''Application <id>''; AppBlock.render later re-sets join("Application ", aid) (AppBlock.java:138). Error branches: puts("Bad request: requires Application ID") AppBlock.java:97, puts("Invalid Application ID: " + aid) AppBlock.java:104, puts("Application not found: " + aid) AppBlock.java:132'
    - id: legacy.rm.app.page.read-failed
      label: 'Failed to read the application '
      dynamic: true
      kind: text
      field: static.error.appReadFailed
      fields:
      - app.id
      format: none
      derivation: '"Failed to read the application " + appID + "."'
      when:
      - other:getApplicationReport() throws
      source: AppBlock.java:125-126
      note: p element; also LOG.error; shown instead of the page body
    - id: legacy.rm.app.page.attempts-read-failed
      label: 'Failed to read the attempts of the application '
      dynamic: true
      kind: text
      field: static.error.attemptsReadFailed
      fields:
      - app.id
      format: none
      derivation: '"Failed to read the attempts of the application " + appID + "."'
      when:
      - other:getApplicationAttemptsReport() throws
      source: AppBlock.java:162-163
      note: p element
  - id: legacy.rm.app.actions
    title: null
    source: AppBlock.java:174
    items:
    - id: legacy.rm.app.actions.kill
      label: Kill Application
      kind: button
      field: static.button.killApplication
      format: none
      when:
      - conf:yarn.resourcemanager.webapp.ui-actions.enabled=true
      - other:!Apps.isApplicationFinalState(app.state) && !(UserGroupInformation.isSecurityEnabled() && httpAuth is simple/pseudo)
      source: AppBlock.java:182-204
      note: PUT /ws/v1/cluster/apps/{id}/state with {"state":"KILLED"} after a confirm("Are you sure?") dialog; only for the RM web UI (WEB_UI_TYPE==rm)
  - id: legacy.rm.app.summary
    title: Application Overview
    source: AppBlock.java:232
    items:
    - id: legacy.rm.app.summary.title
      label: Application Overview
      kind: title
      field: static.section.applicationOverview
      format: none
      source: AppBlock.java:232
      note: InfoBlock th colspan=2 (ResponseInfo.about())
    - id: legacy.rm.app.summary.user
      label: 'User:'
      kind: link
      field: app.user
      rest:
        resource: rm.app
        path: app.user
      derivation: value is hyperlinked to schedulerPath = <rm-web-url>/cluster/scheduler?openQueues=<app.queue>
      format: html-escaped
      source: AppBlock.java:233
      note: href /cluster/scheduler?openQueues={queue}
    - id: legacy.rm.app.summary.name
      label: 'Name:'
      kind: kv
      field: app.name
      rest:
        resource: rm.app
        path: app.name
      format: html-escaped
      source: AppBlock.java:234
    - id: legacy.rm.app.summary.type
      label: 'Application Type:'
      kind: kv
      field: app.applicationType
      rest:
        resource: rm.app
        path: app.applicationType
      format: html-escaped
      source: AppBlock.java:235
    - id: legacy.rm.app.summary.tags
      label: 'Application Tags:'
      kind: kv
      field: app.applicationTags
      rest:
        resource: rm.app
        path: app.applicationTags
      format: html-escaped
      nullDisplay: ''
      source: AppBlock.java:236-237
      note: null => empty string
    - id: legacy.rm.app.summary.priority
      label: 'Application Priority:'
      kind: kv
      field: app.priority
      rest:
        resource: rm.app
        path: app.priority
      derivation: app.getPriority() + " (Higher Integer value indicates higher priority)"
      format: other:{n} (Higher Integer value indicates higher priority)
      normaliser: lead-int
      source: AppBlock.java:238
      note: clarifyAppPriority() appends the parenthetical
    - id: legacy.rm.app.summary.state
      label: 'YarnApplicationState:'
      kind: kv
      field: app.state
      rest:
        resource: rm.app
        path: app.state
      derivation: 'state==null ? "N/A" : clarifyAppState(state) => "<STATE>: <explanation>" (NEW/NEW_SAVING/SUBMITTED/ACCEPTED/RUNNING only)'
      format: enum
      nullDisplay: N/A
      normaliser: before-colon+enum-name
      source: AppBlock.java:239-242
      note: clarifyAppState() text; UNAVAILABLE == 'N/A'
    - id: legacy.rm.app.summary.queue
      label: 'Queue:'
      kind: link
      field: app.queue
      rest:
        resource: rm.app
        path: app.queue
      derivation: value hyperlinked to schedulerPath (/cluster/scheduler?openQueues={queue})
      format: html-escaped
      source: AppBlock.java:243
    - id: legacy.rm.app.summary.finalstatus
      label: 'FinalStatus Reported by AM:'
      kind: kv
      field: app.finalStatus
      rest:
        resource: rm.app
        path: app.finalStatus
      derivation: UNDEFINED => "Application has not completed yet." else status.toString()
      format: enum
      normaliser: final-status-text
      source: AppBlock.java:244-245
      note: clairfyAppFinalStatus()
    - id: legacy.rm.app.summary.started
      label: 'Started:'
      kind: kv
      field: app.startedTime
      rest:
        resource: rm.app
        path: app.startedTime
      derivation: Times.format(app.getStartedTime())
      format: epoch-datetime
      normaliser: epoch
      source: AppBlock.java:246
      note: Java DateTimeFormatter 'EEE MMM dd HH:mm:ss Z yyyy'
    - id: legacy.rm.app.summary.launched
      label: 'Launched:'
      kind: kv
      field: app.launchTime
      rest:
        resource: rm.app
        path: app.launchTime
      derivation: Times.format(app.getLaunchTime())
      format: epoch-datetime
      normaliser: epoch
      source: AppBlock.java:247
    - id: legacy.rm.app.summary.finished
      label: 'Finished:'
      kind: kv
      field: app.finishedTime
      rest:
        resource: rm.app
        path: app.finishedTime
      derivation: Times.format(app.getFinishedTime())
      format: epoch-datetime
      normaliser: epoch
      source: AppBlock.java:248
    - id: legacy.rm.app.summary.elapsed
      label: 'Elapsed:'
      kind: kv
      field: app.elapsedTime
      rest:
        resource: rm.app
        path: app.elapsedTime
      derivation: StringUtils.formatTime(app.getElapsedTime())
      format: duration
      normaliser: duration
      source: AppBlock.java:249
      note: app.elapsedTime is raw ms in REST; UI formats
    - id: legacy.rm.app.summary.tracking
      label: 'Tracking URL:'
      kind: link
      field: app.derived.trackingUiText
      fields:
      - app.trackingUrl
      - app.state
      rest:
        resource: rm.app
        path: app.trackingUrl
      derivation: 'trackingUrl null||"N/A" ? "Unassigned" : Apps.isApplicationFinalState(state) ? "History" : "ApplicationMaster"; href = app.getTrackingUrl() or null'
      format: none
      source: AppBlock.java:250-258
      note: reuses app.derived.trackingUiText / app.derived.hrefTracking declared in legacy-apps.yaml
    - id: legacy.rm.app.summary.logagg
      label: 'Log Aggregation Status:'
      kind: link
      field: app.logAggregationStatus
      rest:
        resource: rm.app
        path: app.logAggregationStatus
      derivation: 'status==null ? "N/A" : (DISABLED|NOT_START|SUCCEEDED ? status.name() : hyperlink root_url("logaggregationstatus", appId) with text status.name())'
      format: enum
      nullDisplay: N/A
      when:
      - other:webUiType == rm
      source: AppBlock.java:261-272
      note: href /cluster/logaggregationstatus/{appId}; only rendered for the RM web UI
    - id: legacy.rm.app.summary.timeout
      label: 'Application Timeout (Remaining Time):'
      kind: kv
      field: app.timeouts.timeout.remainingTimeInSeconds
      rest:
        resource: rm.app
        path: app.timeouts.timeout.remainingTimeInSeconds
      derivation: 'LIFETIME timeout remainingTime < 0 ? "Unlimited" : String.format("%d seconds", timeout)'
      format: other:%d seconds
      nullDisplay: Unlimited
      when:
      - value:-1
      - other:webUiType == rm
      normaliser: lead-int
      source: AppBlock.java:273-279
      note: appReport.getApplicationTimeouts().get(ApplicationTimeoutType.LIFETIME); field path timeouts.timeout[].remainingTimeInSeconds
    - id: legacy.rm.app.summary.diagnostics
      label: 'Diagnostics:'
      kind: kv
      field: app.diagnostics
      rest:
        resource: rm.app
        path: app.diagnostics
      format: html-escaped
      nullDisplay: ''
      source: AppBlock.java:281-282
    - id: legacy.rm.app.summary.unmanaged
      label: 'Unmanaged Application:'
      kind: kv
      field: app.unmanagedApplication
      rest:
        resource: rm.app
        path: app.unmanagedApplication
      format: boolean
      source: AppBlock.java:283
    - id: legacy.rm.app.summary.app-expression
      label: 'Application Node Label expression:'
      kind: kv
      field: app.appNodeLabelExpression
      rest:
        resource: rm.app
        path: app.appNodeLabelExpression
      format: html-escaped
      nullDisplay: <Not set>
      source: AppBlock.java:284-286
      note: lower-case 'expression' in the label (verbatim)
    - id: legacy.rm.app.summary.am-expression
      label: 'AM container Node Label expression:'
      kind: kv
      field: app.amNodeLabelExpression
      rest:
        resource: rm.app
        path: app.amNodeLabelExpression
      format: html-escaped
      nullDisplay: <Not set>
      normaliser: default-partition
      source: AppBlock.java:287-289
  - id: legacy.rm.app.metrics
    title: Application Metrics
    source: RMAppBlock.java:97
    items:
    - id: legacy.rm.app.metrics.title
      label: Application Metrics
      kind: title
