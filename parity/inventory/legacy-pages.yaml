      rest:
        resource: rm.apps
        path: apps.app[].clusterUsagePercentage
      derivation: String.format("%.1f", ...getClusterUsagePercentage())
      format: float-1dp
      normaliser: na-as-null
      nullDisplay: N/A
      source: RMAppsBlock.java:77
    - id: legacy.rm.apps.table.progress
      label: Progress
