- id: legacy.rm.logaggregationstatus
  daemon: rm
  route: /cluster/logaggregationstatus/{app.id}
  title: Application {app.id}
  titleDynamic: true
  classes:
  - RmController#logaggregationstatus
  - AppLogAggregationStatusPage
  - RMAppLogAggregationStatusBlock
  includes:
  - legacy.rm.shared.chrome
  query:
  - name: app.id
    doc: 'path param APPLICATION_ID (YarnWebParams.APPLICATION_ID = app.id). AppLogAggregationStatusPage: empty => title ''Bad request: missing application ID''; block: empty => puts ''Bad request: requires Application ID'' and returns; Apps.toAppID failure => puts ''Invalid Application ID: <aid>'' and returns'
  sections:
  - id: legacy.rm.logaggregationstatus.description
    title: null
    source: RMAppLogAggregationStatusBlock.java:83
    items:
    - id: legacy.rm.logaggregationstatus.description.col-status
      label: Log Aggregation Status
      kind: column
      field: static.logAggregationStatus.colStatus
      format: none
      source: RMAppLogAggregationStatusBlock.java:88
      note: table#LogAggregationStatusDecription (sic)
    - id: legacy.rm.logaggregationstatus.description.col-description
      label: Description
      kind: column
      field: static.logAggregationStatus.colDescription
      format: none
      source: RMAppLogAggregationStatusBlock.java:89
    - id: legacy.rm.logaggregationstatus.description.disabled
      label: DISABLED
      kind: legend
      field: static.logAggregationStatus.disabled
      format: none
      source: RMAppLogAggregationStatusBlock.java:91-92
      note: 'Description cell: "Log Aggregation is Disabled." (LogAggregationStatus.DISABLED)'
    - id: legacy.rm.logaggregationstatus.description.notstart
      label: NOT_START
      kind: legend
      field: static.logAggregationStatus.notStart
      format: none
      source: RMAppLogAggregationStatusBlock.java:93-94
      note: 'Description cell: "Log Aggregation does not Start." (LogAggregationStatus.NOT_START)'
    - id: legacy.rm.logaggregationstatus.description.running
      label: RUNNING
      kind: legend
      field: static.logAggregationStatus.running
      format: none
      source: RMAppLogAggregationStatusBlock.java:95-96
      note: 'Description cell: "Log Aggregation is Running." (LogAggregationStatus.RUNNING)'
    - id: legacy.rm.logaggregationstatus.description.runningwithfailure
      label: RUNNING_WITH_FAILURE
      kind: legend
      field: static.logAggregationStatus.runningWithFailure
      format: none
      source: RMAppLogAggregationStatusBlock.java:97-99
      note: 'Description cell: "Log Aggregation is Running, but has failures in previous cycles" (LogAggregationStatus.RUNNING_WITH_FAILURE)'
    - id: legacy.rm.logaggregationstatus.description.succeeded
      label: SUCCEEDED
      kind: legend
      field: static.logAggregationStatus.succeeded
      format: none
      source: RMAppLogAggregationStatusBlock.java:100-102
      note: 'Description cell: "Log Aggregation is Succeeded. All of the logs have been aggregated successfully." (LogAggregationStatus.SUCCEEDED)'
    - id: legacy.rm.logaggregationstatus.description.failed
      label: FAILED
      kind: legend
      field: static.logAggregationStatus.failed
      format: none
      source: RMAppLogAggregationStatusBlock.java:103-105
      note: 'Description cell: "Log Aggregation is Failed. At least one of the logs have not been aggregated." (LogAggregationStatus.FAILED)'
    - id: legacy.rm.logaggregationstatus.description.timeout
      label: TIME_OUT
      kind: legend
      field: static.logAggregationStatus.timeOut
      format: none
      source: RMAppLogAggregationStatusBlock.java:106-109
      note: 'Description cell: "The application is finished, but the log aggregation status is not updated for a long time. Not sure whether the log aggregation is finished or not." (LogAggregationStatus.TIME_OUT)'
  - id: legacy.rm.logaggregationstatus.summary
    title: 'Log Aggregation: '
    source: RMAppLogAggregationStatusBlock.java:116
    items:
    - id: legacy.rm.logaggregationstatus.summary.status
      label: 'Log Aggregation: '
      dynamic: true
      kind: title
      field: app.logAggregationStatus
      rest:
        resource: rm.app
        path: app.logAggregationStatus
      derivation: 'join("Log Aggregation: ", rmApp == null ? "N/A" : rmApp.getLogAggregationStatusForAppReport() == null ? "N/A" : rmApp.getLogAggregationStatusForAppReport().name())'
      format: enum
      normaliser: after-colon+enum-name
      nullDisplay: N/A
      source: RMAppLogAggregationStatusBlock.java:117-122
      note: h3; AppInfo.logAggregationStatus is populated from the same RMApp.getLogAggregationStatusForAppReport() (AppInfo.java:207)
  - id: legacy.rm.logaggregationstatus.table
    title: null
    source: RMAppLogAggregationStatusBlock.java:128-156 (one row per entry of rmApp.getLogAggregationReportsForApp(); empty until an NM reports, while the app-level status is NOT_START/DISABLED)
    when:
    - fact:logAggReportsPresent
    items:
    - id: legacy.rm.logaggregationstatus.table.node
      label: NodeId
      kind: column
      field: app.derived.logAggReportNodeId
      rest: null
      derivation: report.getKey().toString()
      format: none
      source: RMAppLogAggregationStatusBlock.java:129,152
      restGap: true
      note: one row per NodeManager in rmApp.getLogAggregationReportsForApp(); no REST resource exposes these per-NM reports
    - id: legacy.rm.logaggregationstatus.table.status
      label: Log Aggregation Status
      kind: column
      field: app.derived.logAggReportStatusText
      rest: null
      derivation: 'status == null ? "N/A" : status.toString()'
      format: enum
      normaliser: na-as-null+enum-name
      nullDisplay: N/A
      source: RMAppLogAggregationStatusBlock.java:130,153
      restGap: true
    - id: legacy.rm.logaggregationstatus.table.diagnostics
      label: Last {N} Diagnostic Messages
      dynamic: true
      kind: column
      field: app.derived.logAggReportDiagnostics
      rest: null
      derivation: '"Last " + maxLogAggregationDiagnosticsInMemory + " Diagnostic Messages"   where maxLogAggregationDiagnosticsInMemory = conf.getInt(YarnConfiguration.RM_MAX_LOG_AGGREGATION_DIAGNOSTICS_IN_MEMORY, DEFAULT_RM_MAX_LOG_AGGREGATION_DIAGNOSTICS_IN_MEMORY)  (key yarn.resourcemanager.max-log-aggregation-diagnostics-in-memory, default 10)'
      format: none
      nullDisplay: N/A
      source: RMAppLogAggregationStatusBlock.java:131-132,154
      restGap: true
    - id: legacy.rm.logaggregationstatus.table.failures
      label: Last {N} Failure Messages
      dynamic: true
      kind: column
      field: app.derived.logAggReportFailures
      rest: null
      derivation: '"Last " + maxLogAggregationDiagnosticsInMemory + " Failure Messages"'
      format: none
      nullDisplay: N/A
      source: RMAppLogAggregationStatusBlock.java:133-134,155
      restGap: true
  - id: legacy.rm.logaggregationstatus.badrequest
    title: null
    source: RMAppLogAggregationStatusBlock.java:67
    items:
    - id: legacy.rm.logaggregationstatus.badrequest.missing
      label: 'Bad request: requires Application ID'
      kind: text
      field: static.logAggregationStatus.badRequest
      format: none
      when:
      - other:$(APPLICATION_ID) is empty
      source: RMAppLogAggregationStatusBlock.java:67
      scenario: request reaches the block with an empty app.id (and is NOT the page title path)
      note: 'puts(...) then return; page title instead shows ''Bad request: missing application ID'' (AppLogAggregationStatusPage.java:32-34)'
    - id: legacy.rm.logaggregationstatus.badrequest.invalid
      label: 'Invalid Application ID: '
      dynamic: true
      kind: text
      field: static.logAggregationStatus.invalidAppId
      fields:
      - app.id
      derivation: '"Invalid Application ID: " + aid'
      format: none
      when:
      - other:Apps.toAppID(aid) throws
      source: RMAppLogAggregationStatusBlock.java:75
      scenario: app.id is not a valid ApplicationId (e.g. malformed application_ id)
