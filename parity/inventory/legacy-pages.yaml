- id: legacy.rm.scheduler.fair
  daemon: rm
  route: /cluster/scheduler
  title: Fair Scheduler
  classes:
  - RmController#scheduler
  - FairSchedulerPage
  - FSQInfo
  - LeafQueueBlock
  - ParentQueueBlock
  - QueueBlock
  - QueuesBlock
  - FairSchedulerAppsBlock
  - SchedulerPageUtil.QueueBlockUtil
  - MetricsOverviewTable
  when:
  - scheduler=fair
  includes:
  - legacy.rm.shared.chrome
  - legacy.rm.shared.metrics
  query:
  - name: openQueues
    doc: queue names separated by '#' auto-expanded in the queue tree; managed by SchedulerPageUtil (FairSchedulerPage.postHead includes QueueBlockUtil)
  sections:
  - id: legacy.rm.scheduler.fair.page
    title: null
    source: RmController.java:95
    items:
    - id: legacy.rm.scheduler.fair.page.title
      label: Fair Scheduler
      kind: title
      field: static.page.scheduler.title
      format: none
      source: RmController.java:95
      note: setTitle('Fair Scheduler')
  - id: legacy.rm.scheduler.fair.queues
    title: Application Queues
    source: FairSchedulerPage.java:190
    items:
    - id: legacy.rm.scheduler.fair.queues.heading
      label: Application Queues
      kind: title
      field: static.section.applicationQueues
      format: none
      source: FairSchedulerPage.java:190
    - id: legacy.rm.scheduler.fair.queues.legend-heading
      label: 'Legend:'
      kind: legend
      field: static.legend.heading
      format: none
      source: FairSchedulerPage.java:206
    - id: legacy.rm.scheduler.fair.queues.legend-steady
      label: Steady Fair Share
      kind: legend
      field: static.legend.steadyFairShare
      format: none
      tooltip: The steady fair shares consider all queues, both active (with running applications) and inactive.
      source: FairSchedulerPage.java:208-210
      note: swatch Q_GIVEN solid border
    - id: legacy.rm.scheduler.fair.queues.legend-instantaneous
      label: Instantaneous Fair Share
      kind: legend
      field: static.legend.instantaneousFairShare
      format: none
      tooltip: The instantaneous fair shares consider only active queues (with running applications).
      source: FairSchedulerPage.java:212-214
      note: swatch Q_INSTANTANEOUS_FS dashed border
    - id: legacy.rm.scheduler.fair.queues.legend-used
      label: Used
      kind: legend
      field: static.legend.used
      format: none
      source: FairSchedulerPage.java:216
      note: swatch Q_UNDER
    - id: legacy.rm.scheduler.fair.queues.legend-over
      label: Used (over fair share)
      kind: legend
      field: static.legend.usedOverFairShare
      format: none
      source: FairSchedulerPage.java:218
      note: swatch Q_OVER
    - id: legacy.rm.scheduler.fair.queues.legend-max
      label: Max Capacity
      kind: legend
      field: static.legend.maxCapacity
      format: none
      source: FairSchedulerPage.java:220
    - id: legacy.rm.scheduler.fair.queues.fallback-bar
      label: '100% '
      kind: chart
      field: static.bar.defaultQueue
      format: none
      when:
      - other:fs == null
      scenario: scheduler not yet initialised
      source: FairSchedulerPage.java:197
      note: fallback bar labelled 'default'
    - id: legacy.rm.scheduler.fair.queues.root-bar
      label: ' used'
      dynamic: true
      kind: chart
      field: queue.derived.usedMemoryFraction
      fields:
      - queue.usedResources.memory
      - queue.clusterResources.memory
      rest: null
      derivation: rootQueue.getUsedMemoryFraction() = usedResources.memory/clusterResources.memory; text = formatPercent(used,1)+" used"
      format: percent-1dp
      normaliser: percent
      source: FairSchedulerPage.java:199-228
      restGap: true
      note: 'root bar: span width=used (left:0%), Q_OVER when used>1 else Q_UNDER; fixed-width anchor'
    - id: legacy.rm.scheduler.fair.queues.root-name
      label: root
      kind: text
      field: queue.queueName
      rest:
        resource: rm.scheduler
        path: scheduler.schedulerInfo.rootQueue.queueName
      format: none
      source: FairSchedulerPage.java:226
  - id: legacy.rm.scheduler.fair.queue
    title: null
    source: FairSchedulerPage.java:143
    when:
    - scheduler=fair
    scenario: fair scheduler root has child queues
    items:
    - id: legacy.rm.scheduler.fair.queue.bar
      label: null
      dynamic: true
      kind: chart
      field: queue.derived.maxResourcesFraction
      fields:
      - queue.derived.steadyFairShareMemoryFraction
      - queue.derived.instantaneousFairShareMemoryFraction
      - queue.derived.usedMemoryFraction
      rest: null
      derivation: capacity=maxResourcesFraction; steadyFairShare=steadyFairResourcesFraction; instantaneousFairShare=fairResourcesFraction; used=usedMemoryFraction; width(capacity*0.8); given span width steadyFairShare/capacity; instantaneous span width instantaneousFairShare/capacity; used span width used/capacity (Q_OVER when used>instantaneousFairShare else Q_UNDER)
      format: percent-1dp
      normaliser: percent
      source: FairSchedulerPage.java:143-159
      tooltip: 'Steady Fair Share: <pct> Instantaneous Fair Share: <pct>'
      restGap: true
      note: one li per child queue; tooltip = 'Steady Fair Share:' + formatPercent(steady,1) + ' Instantaneous Fair Share:' + formatPercent(inst,1)
    - id: legacy.rm.scheduler.fair.queue.name
      label: null
      kind: text
      field: queue.queueName
      rest:
        resource: rm.scheduler
        path: scheduler.schedulerInfo.rootQueue.childQueues[].queueName
      format: none
      source: FairSchedulerPage.java:157
    - id: legacy.rm.scheduler.fair.queue.used-text
      label: ' used'
      dynamic: true
      kind: text
      field: queue.derived.usedMemoryFraction
      rest: null
      derivation: formatPercent(info.getUsedMemoryFraction(),1) + " used"
      format: percent-1dp
      normaliser: percent
      source: FairSchedulerPage.java:159
      restGap: true
