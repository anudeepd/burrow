  - parity/inventory/src/legacy-misc.yaml
- id: legacy.rm.nodes
  daemon: rm
  route: /cluster/nodes | /cluster/nodes/{node.state}
  title: Nodes of the cluster
  titleDynamic: true
  query:
  - name: node.state
    doc: route path param (RMWebApp.java:68 pajoin("/nodes", NODE_STATE); YarnWebParams.NODE_STATE = "node.state"); a NodeState enum name, matched case-insensitively (NodesPage.java:128-129 NodeState.valueOf(StringUtils.toUpperCase(type))); filters the table and appends " (<type>)" to the title (NodesPage.java:272-276); empty => all active RM nodes except UNHEALTHY (NodesPage.java:153-162); DECOMMISSIONED|LOST|REBOOTED|SHUTDOWN read getInactiveRMNodes (NodesPage.java:131-144)
  - name: node.label
    doc: request param (NodesPage.java:75 $(NODE_LABEL, CommonNodeLabelsManager.ANY).trim(); YarnWebParams.NODE_LABEL = "node.label"); CommonNodeLabelsManager.ANY = "*" disables label filtering; empty string shows only nodes with no label; otherwise only nodes whose nodeLabels contains that label (NodesPage.java:165-180). Targets of the Node Labels page active-NM links /cluster/nodes?node.label=<label>
  classes:
  - RmController#nodes
  - NodesPage
  - NodesBlock
  - MetricsOverviewTable
  - NavBlock
  - WebPageUtils
  includes:
  - legacy.rm.shared.chrome
  - legacy.rm.shared.metrics
  sections:
  - id: legacy.rm.nodes.page
    title: null
    source: NodesPage.java:270
    items:
    - id: legacy.rm.nodes.page.title
      label: Nodes of the cluster
      dynamic: true
      kind: title
      field: static.page.nodes.title
      format: none
      source: NodesPage.java:272-276
      note: '<title>/h1; title = "Nodes of the cluster" + (type != null && !type.isEmpty() ? " (" + type + ")" : "") where type = $(node.state); preHead sets it (RmView.preHead''s Applications title is overridden by NodesPage.preHead)'
  - id: legacy.rm.nodes.states
    title: null
    source: NodeState.java:29
    items:
    - id: legacy.rm.nodes.states.new
      label: NEW
      kind: nav
      field: static.node.state.new
      format: url
      source: NodeState.java:31
      note: NodeState value accepted by /cluster/nodes/{node.state}; an active state (isActiveState). 3.4.3 NodesPage renders NO dedicated node-state tab bar - node-state navigation is only the Cluster Nodes Metrics links (legacy.rm.shared.metrics.nodes). These items record the accepted path values from the NodeState enum
    - id: legacy.rm.nodes.states.running
      label: RUNNING
      kind: nav
      field: static.node.state.running
      format: url
      source: NodeState.java:34
      note: NodeState value accepted by /cluster/nodes/{node.state}; active state
    - id: legacy.rm.nodes.states.unhealthy
      label: UNHEALTHY
      kind: nav
      field: static.node.state.unhealthy
      format: url
      source: NodeState.java:37
      note: NodeState value accepted by /cluster/nodes/{node.state}; active but unusable (isUnusable). Hidden from the unfiltered list (NodesPage.java:159-160)
    - id: legacy.rm.nodes.states.decommissioned
      label: DECOMMISSIONED
      kind: nav
      field: static.node.state.decommissioned
      format: url
      source: NodeState.java:40
      note: NodeState value accepted by /cluster/nodes/{node.state}; inactive (isInactiveState) - served from getInactiveRMNodes, Node HTTP Address shows N/A
    - id: legacy.rm.nodes.states.lost
      label: LOST
      kind: nav
      field: static.node.state.lost
      format: url
      source: NodeState.java:43
      note: NodeState value accepted by /cluster/nodes/{node.state}; inactive; metric link /cluster/nodes/lost (legacy.rm.shared.metrics.nodes.lost)
    - id: legacy.rm.nodes.states.rebooted
      label: REBOOTED
      kind: nav
      field: static.node.state.rebooted
      format: url
      source: NodeState.java:46
      note: NodeState value accepted by /cluster/nodes/{node.state}; inactive; metric link /cluster/nodes/rebooted
    - id: legacy.rm.nodes.states.decommissioning
      label: DECOMMISSIONING
      kind: nav
      field: static.node.state.decommissioning
      format: url
      source: NodeState.java:49
      note: NodeState value accepted by /cluster/nodes/{node.state}; active state; metric link /cluster/nodes/decommissioning
    - id: legacy.rm.nodes.states.shutdown
      label: SHUTDOWN
      kind: nav
      field: static.node.state.shutdown
      format: url
      source: NodeState.java:52
      note: NodeState value accepted by /cluster/nodes/{node.state}; inactive; metric link /cluster/nodes/shutdown
  - id: legacy.rm.nodes.table
    title: null
    source: NodesPage.java:78
    items:
    - id: legacy.rm.nodes.table.node-labels
      label: Node Labels
      kind: column
