  - RmController#failure
  - RedirectionErrorPage
  - ErrorBlock
  sections:
  - id: legacy.rm.failure.message
    title: null
    source: RedirectionErrorPage.java:31
    items:
    - id: legacy.rm.failure.message.text
      label: 'The application master for '
      dynamic: true
      kind: text
      field: static.error.proxyRedirect
      fields:
      - app.id
      rest: null
      derivation: '"The application master for " + aid + " redirected the resource manager''s web proxy''s request back to the web proxy, which means your request to view the application master''s web UI cannot be fulfilled. The typical cause for this error is a network misconfiguration that causes the resource manager''s web proxy host to resolve to an unexpected IP address on the application master host. Please contact your cluster administrator to resolve the issue."'
      format: none
      source: RedirectionErrorPage.java:34
      scenario: AM redirects the RM web proxy request back to the proxy (network misconfiguration); reached via WebAppProxyServlet, not via navigation
