- id: legacy.rm.apps
  daemon: rm
  route: /cluster | /cluster/apps | /cluster/apps/{app.state} | /cluster/queue/{queue.name} | /cluster/failure(no)
  title: '{app.state|All} Applications'
  titleDynamic: true
  query:
  - name: app.state
    doc: 'path param (RMWebApp: pajoin("/apps", APP_STATE)); comma separated YarnApplicationState names; empty => All; AppsBlock.fetchData splits on '','' and YarnApplicationState.valueOf(trim)'
  - name: apps.num
    doc: limit of applications returned (AppsBlock.fetchData -> request.setLimit)
  - name: app.started-time.begin
    doc: epoch ms lower bound (must be >=0)
  - name: app.started-time.end
    doc: epoch ms upper bound (must be >=begin)
  - name: queue.name
    doc: route /cluster/queue/{queue.name} only changes the TITLE to 'Queue <name>' (RmController.queue); it does NOT filter the table
  classes:
  - RmController#index
  - RmController#queue
  - RmView
  - AppsBlockWithMetrics
  - MetricsOverviewTable
  - RMAppsBlock
  - AppsBlock
  - ColumnHeader
  - WebPageUtils
  - NavBlock
  includes:
  - legacy.rm.shared.chrome
  - legacy.rm.shared.metrics
  sections:
  - id: legacy.rm.apps.page
    title: null
    source: RmView.java:45
    items:
    - id: legacy.rm.apps.page.title
      label: Applications
      kind: title
      dynamic: true
      field: static.page.apps.title
      format: none
      source: RmView.java:45
      note: <title>/h1 = sjoin(reqState-or-'All', 'Applications') e.g. 'RUNNING Applications'. AppsBlock.render() later calls setTitle('Applications') but after the header was rendered, so it is NOT visible [INFERENCE - verify live]. /cluster/queue/{q} sets 'Queue <q>' in the controller but RmView.preHead overwrites it with the Applications title [INFERENCE - verify live].
  - id: legacy.rm.apps.table
    title: null
    source: RMAppsBlock.java:56
    items:
    - id: legacy.rm.apps.table.id
      label: ID
      kind: column
      field: app.id
      rest:
        resource: rm.apps
        path: apps.app[].id
      derivation: <a href=/cluster/app/{app.getAppId()}>{appId}</a>
      format: url
      normaliser: html-strip
      source: RMAppsBlock.java:57
      note: link to /cluster/app/<id>; default sort desc on column 0 (natural sort)
    - id: legacy.rm.apps.table.user
      label: User
      kind: column
      field: app.user
      rest:
        resource: rm.apps
        path: apps.app[].user
      format: html-escaped
      source: RMAppsBlock.java:58
    - id: legacy.rm.apps.table.name
