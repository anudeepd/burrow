- id: legacy.rm.appattempt
  daemon: rm
  route: /cluster/appattempt/{attempt.id}
  title: Application Attempt {attempt.id}
  titleDynamic: true
  classes:
  - RmController#appattempt
  - AppAttemptPage
  - RMAppAttemptBlock
  - AppAttemptBlock
  includes:
  - legacy.rm.shared.chrome
  sections:
  - id: legacy.rm.appattempt.page
    title: null
    source: AppAttemptPage.java:38
    items:
    - id: legacy.rm.appattempt.page.title
      label: 'Application Attempt '
      dynamic: true
      kind: title
      field: static.page.attempt.title
      fields:
      - attempt.appAttemptId
      derivation: 'appAttemptId.isEmpty() ? "Bad request: missing application attempt ID" : join("Application Attempt ", appAttemptId)'
      format: none
      source: AppAttemptPage.java:38-43
      note: 'AppAttemptBlock.render re-sets join("Application Attempt ", attemptid) (AppAttemptBlock.java:133). Error branches: puts("Bad request: requires application attempt ID") AppAttemptBlock.java:67, puts("Invalid application attempt ID: " + attemptid) AppAttemptBlock.java:74, puts("Application Attempt not found: " + attemptid) AppAttemptBlock.java:104'
    - id: legacy.rm.appattempt.page.containers-failed
      label: Sorry, Failed to get containers for application attempt
      dynamic: true
      kind: text
      field: static.error.containersReadFailed
      fields:
      - attempt.appAttemptId
      format: none
      derivation: '"Sorry, Failed to get containers for application attempt" + attemptid + "."'
      when:
      - other:getContainers() throws
      source: AppAttemptBlock.java:145-147
      note: p element; the attempts table is skipped
  - id: legacy.rm.appattempt.summary
    title: Application Attempt Overview
    source: RMAppAttemptBlock.java:482
    items:
    - id: legacy.rm.appattempt.summary.title
      label: Application Attempt Overview
      kind: title
      field: static.section.applicationAttemptOverview
      format: none
      source: RMAppAttemptBlock.java:482
      note: InfoBlock th colspan=2 (ResponseInfo.about()); label also used at RMAppAttemptBlock.java:444 (clear()) and AppAttemptBlock.java:213
    - id: legacy.rm.appattempt.summary.state
      label: 'Application Attempt State:'
      kind: kv
      field: attempt.appAttemptState
      rest:
        resource: rm.app.attempt
        path: appAttemptState
      format: enum
      nullDisplay: N/A
      derivation: 'appAttempt.getAppAttemptState() == null ? UNAVAILABLE : appAttempt.getAppAttemptState()'
      source: RMAppAttemptBlock.java:483-486
      note: YarnApplicationAttemptState name (NEW/SUBMITTED/SCHEDULED/ALLOCATED_SAVING/ALLOCATED/RUNNING/FINISHING/FINISHED/FAILED/KILLED)
    - id: legacy.rm.appattempt.summary.started
      label: 'Started:'
      kind: kv
      field: attempt.startedTime
      rest:
        resource: rm.app.attempt
        path: startedTime
      derivation: Times.format(appAttempt.getStartedTime())
      format: epoch-datetime
      normaliser: epoch
      source: RMAppAttemptBlock.java:487
    - id: legacy.rm.appattempt.summary.elapsed
      label: 'Elapsed:'
      kind: kv
      field: attempt.derived.elapsedText
      fields:
      - attempt.startedTime
      - attempt.finishedTime
      rest:
        resource: rm.app.attempt
        path: finishedTime
      derivation: org.apache.hadoop.util.StringUtils.formatTime(Times.elapsed(startedTime, finishedTime))
      format: duration
      normaliser: duration
      source: RMAppAttemptBlock.java:488-490
      note: no raw attempt.elapsedTime key on the single-attempt endpoint
    - id: legacy.rm.appattempt.summary.am-container
      label: 'AM Container:'
      kind: link
      field: attempt.amContainerId
      rest:
        resource: rm.app.attempt
        path: amContainerId
      derivation: 'amContainerId == null || containers == null || !hasAMContainer(AMContainerId, containers) ? null : root_url("container", amContainerId); text = String.valueOf(amContainerId) or N/A'
      format: url
      nullDisplay: N/A
      source: RMAppAttemptBlock.java:491-497
      note: href /cluster/container/{amContainerId}
    - id: legacy.rm.appattempt.summary.node
      label: 'Node:'
      kind: kv
      field: attempt.derived.hostPortText
      fields:
      - attempt.host
      - attempt.rpcPort
      rest:
        resource: rm.app.attempt
        path: host
      derivation: 'host != null && rpcPort >= 0 && rpcPort < 65536 ? host + ":" + rpcPort : "N/A"'
      format: none
      nullDisplay: N/A
      source: RMAppAttemptBlock.java:498
      note: node computed in AppAttemptBlock.java:131-136 and passed into generateOverview()
    - id: legacy.rm.appattempt.summary.tracking
      label: 'Tracking URL:'
      kind: link
      field: attempt.derived.trackingUiText
      fields:
      - attempt.trackingUrl
      - attempt.appAttemptState
      rest:
        resource: rm.app.attempt
        path: trackingUrl
      derivation: 'trackingUrl null||"N/A" ? "Unassigned" : state in (FINISHED,FAILED,KILLED) ? "History" : "ApplicationMaster"; href = root_url(trackingUrl) or null'
      format: none
      source: RMAppAttemptBlock.java:499-511
    - id: legacy.rm.appattempt.summary.diagnostics
      label: 'Diagnostics Info:'
      kind: kv
      field: attempt.diagnosticsInfo
      rest:
        resource: rm.app.attempt
        path: diagnosticsInfo
      format: html-escaped
      nullDisplay: ''
      source: RMAppAttemptBlock.java:512-514
      note: multi-line value split into divs per line by InfoBlock
    - id: legacy.rm.appattempt.summary.app-blacklisted
      label: 'Nodes blacklisted by the application:'
      kind: kv
      field: attempt.derived.appBlacklistedNodesText
      rest: null
      derivation: getNodeString(rmAppAttempt.getBlacklistedNodes()) => join ", " or "-"
      format: join-comma
      nullDisplay: '-'
      source: RMAppAttemptBlock.java:515
      restGap: true
      note: no blacklistedNodes key on the single-attempt endpoint; available as attempt.blacklistedNodes via rm.app.attempts
    - id: legacy.rm.appattempt.summary.rm-blacklisted
      label: 'Nodes blacklisted by the system:'
      kind: kv
      field: attempt.derived.rmBlacklistedNodesText
      rest: null
      derivation: getNodeString(AMBlacklistManager.getBlacklistUpdates().getBlacklistAdditions()) => join ", " or "-"
      format: join-comma
      nullDisplay: '-'
      source: RMAppAttemptBlock.java:516
      restGap: true
      note: available as attempt.nodesBlacklistedBySystem via rm.app.attempts
  - id: legacy.rm.appattempt.metrics
    title: Application Attempt Metrics
    source: RMAppAttemptBlock.java:445
    items:
    - id: legacy.rm.appattempt.metrics.title
      label: Application Attempt Metrics
      kind: title
      field: static.section.applicationAttemptMetrics
      format: none
      source: RMAppAttemptBlock.java:445
      note: RM-only InfoBlock created by createAttemptHeadRoomTable; only when attempt is not in a final state
    - id: legacy.rm.appattempt.metrics.headroom
