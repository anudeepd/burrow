- id: legacy.rm.nodelabels
  daemon: rm
  route: /cluster/nodelabels
  title: Node labels of the cluster
  classes:
  - RmController#nodelabels
  - NodeLabelsPage
  - NodeLabelsBlock
  - NavBlock
  includes:
  - legacy.rm.shared.chrome
  sections:
  - id: legacy.rm.nodelabels.page
    title: null
    source: NodeLabelsPage.java:86
    items:
    - id: legacy.rm.nodelabels.page.title
      label: Node labels of the cluster
      kind: title
      field: static.page.nodelabels.title
      format: none
      source: NodeLabelsPage.java:86-87
      note: <title>/h1 set via setTitle(title) in preHead
  - id: legacy.rm.nodelabels.table
    title: null
    source: NodeLabelsPage.java:49
    items:
    - id: legacy.rm.nodelabels.table.label-name
      label: Label Name
      kind: column
      field: nodelabel.derived.labelNameText
      fields:
      - nodelabel.name
      rest:
        resource: rm.node-labels
        path: nodeLabelInfo[].name
      derivation: 'info.getLabelName().isEmpty() ? NodeLabel.DEFAULT_NODE_LABEL_PARTITION : info.getLabelName()'
      format: none
      normaliser: none
      nullDisplay: <DEFAULT_PARTITION>
      source: NodeLabelsPage.java:49
      note: the default partition (empty label name) is shown as <DEFAULT_PARTITION>; rows come from RMNodeLabelsManager.pullRMNodeLabelsInfo() (RMNodeLabel)
    - id: legacy.rm.nodelabels.table.label-type
      label: Label Type
      kind: column
      field: nodelabel.derived.labelTypeText
      fields:
      - nodelabel.exclusivity
      rest:
        resource: rm.node-labels
        path: nodeLabelInfo[].exclusivity
      derivation: 'info.getIsExclusive() ? "Exclusive Partition" : "Non Exclusive Partition"'
      format: none
      normaliser: none
      source: NodeLabelsPage.java:50
      note: REST nodelabel.exclusivity is serialised as the STRING "true"/"false" (get-node-labels is root-unwrapped with stringified scalars); compare case-insensitively
    - id: legacy.rm.nodelabels.table.active-nms
      label: Num Of Active NMs
      kind: link
      field: nodelabel.activeNMs
      rest:
        resource: rm.node-labels
        path: nodeLabelInfo[].activeNMs
      derivation: 'nActiveNMs > 0 ? <a href=url("nodes","?node.label="+labelName)>nActiveNMs</a> : nActiveNMs'
      format: int
      normaliser: int
      when:
      - value:non-empty
      source: NodeLabelsPage.java:51
      note: value is the RMNodeLabel.getNumActiveNMs() partition count; when >0 it links to /cluster/nodes?node.label=<label> (NodesPage.java:67-76). REST nodelabel.activeNMs is nullable and is ABSENT from the live get-node-labels body - count nodes by label via rm.nodes nodeLabels instead
      restGap: true
      altSource: count of rm.nodes nodes whose nodeLabels contains this label
    - id: legacy.rm.nodelabels.table.total-resource
      label: Total Resource
      kind: column
      field: nodelabel.derived.totalResourceText
      fields:
      - nodelabel.partitionInfo.resourceAvailable.memory
      - nodelabel.partitionInfo.resourceAvailable.vCores
      rest:
        resource: rm.node-labels
        path: nodeLabelInfo[].partitionInfo.resourceAvailable
      derivation: info.getResource().toFormattedString()
      format: resource-string
      normaliser: resource-string
      source: NodeLabelsPage.java:78
      note: RMNodeLabel.getResource() formatted Resource string e.g. '<memory:3 GB, vCores:4>'; REST equivalent nodeLabelInfo[].partitionInfo.resourceAvailable (memory/vCores are STRINGS in the unwrapped get-node-labels JSON)
  sourceFiles:
  - parity/inventory/src/legacy-nodes.yaml
