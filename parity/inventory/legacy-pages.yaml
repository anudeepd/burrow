      nullDisplay: N/A
      source: RMAppsBlock.java:64
      note: 'JS renderHadoopDate: ''Sat Oct 3 14:05:09 +0200 2026'' (day NOT zero padded, offset +HHMM, BROWSER time zone); data ''0'' or ''-1'' => N/A'
    - id: legacy.rm.apps.table.launchtime
      label: LaunchTime
      kind: column
      field: app.launchTime
