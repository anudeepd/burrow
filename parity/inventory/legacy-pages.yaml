      kind: column
      field: app.runningContainers
      rest:
        resource: rm.apps
        path: apps.app[].runningContainers
      format: int
      normaliser: na-as-null
      nullDisplay: N/A
      when:
      - value:-1
      source: RMAppsBlock.java:69
    - id: legacy.rm.apps.table.allocated-vcores
      label: Allocated CPU VCores
      kind: column
      field: app.allocatedVCores
      rest:
        resource: rm.apps
        path: apps.app[].allocatedVCores
      format: int
      normaliser: na-as-null
      nullDisplay: N/A
      when:
      - value:-1
      source: RMAppsBlock.java:70
      note: legacy AppInfo.allocatedCpuVcores defaults 0 (never -1 in 3.4.3); N/A branch is dead for completed apps
    - id: legacy.rm.apps.table.allocated-mb
      label: Allocated Memory MB
      kind: column
      field: app.allocatedMB
      rest:
        resource: rm.apps
        path: apps.app[].allocatedMB
      format: int
      normaliser: na-as-null
      nullDisplay: N/A
      when:
      - value:-1
      source: RMAppsBlock.java:71
    - id: legacy.rm.apps.table.allocated-gpus
      label: Allocated GPUs
      kind: column
      field: app.derived.allocatedGpus
      rest: null
      derivation: '(isAppInCompletedState && app.getAllocatedGpus() <= 0) ? UNAVAILABLE : String.valueOf(app.getAllocatedGpus())'
      format: int
      normaliser: na-as-null
      nullDisplay: N/A
      when:
      - fact:gpuResourceTypeConfigured
      source: RMAppsBlock.java:72
      restGap: true
      note: -1 when yarn.io/gpu is not a configured resource type => column shows '-1' for running apps (completed apps show N/A)
    - id: legacy.rm.apps.table.reserved-vcores
      label: Reserved CPU VCores
      kind: column
      field: app.reservedVCores
      rest:
        resource: rm.apps
        path: apps.app[].reservedVCores
      format: int
      normaliser: na-as-null
      nullDisplay: N/A
      when:
      - value:-1
      source: RMAppsBlock.java:73
    - id: legacy.rm.apps.table.reserved-mb
      label: Reserved Memory MB
      kind: column
      field: app.reservedMB
      rest:
        resource: rm.apps
        path: apps.app[].reservedMB
      format: int
      normaliser: na-as-null
      nullDisplay: N/A
      when:
      - value:-1
      source: RMAppsBlock.java:74
    - id: legacy.rm.apps.table.reserved-gpus
      label: Reserved GPUs
      kind: column
      field: app.derived.reservedGpus
      rest: null
      derivation: '(isAppInCompletedState && app.getReservedGpus() <= 0) ? UNAVAILABLE : String.valueOf(app.getReservedGpus())'
      format: int
      normaliser: na-as-null
      nullDisplay: N/A
      when:
