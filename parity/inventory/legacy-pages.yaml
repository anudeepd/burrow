      kind: column
      field: app.applicationType
      rest:
        resource: rm.apps
        path: apps.app[].applicationType
      format: html-escaped
      source: RMAppsBlock.java:60
    - id: legacy.rm.apps.table.tags
      label: Application Tags
      kind: column
      field: app.applicationTags
      rest:
        resource: rm.apps
        path: apps.app[].applicationTags
      format: html-escaped
      nullDisplay: ''
      source: RMAppsBlock.java:61
      note: comma-joined; null => empty string
    - id: legacy.rm.apps.table.queue
      label: Queue
