derived:
- id: queue.derived.freeGuaranteedPct
  entity: queue
  type: float
  format: float-1dp
  from:
  - queue.absoluteCapacity
  - queue.absoluteUsedCapacity
  derivation: 'absoluteCapacity - absoluteUsedCapacity, clamped at >= 0 (root queue: capacity - usedCapacity)'
  source: hadoop-yarn-server-resourcemanager/org/apache/hadoop/yarn/server/resourcemanager/webapp/RMWebServices.java:415
  restGap: true
  note: Product-side computation (no REST key); declared here because both the legacy scheduler page bar and the SPA need it.
- id: queue.derived.burstRoomPct
  entity: queue
  type: float
  format: float-1dp
  from:
  - queue.absoluteMaxCapacity
  - queue.absoluteUsedCapacity
  derivation: 'absoluteMaxCapacity - absoluteUsedCapacity, clamped at >= 0 (root queue: maxCapacity - usedCapacity)'
  source: hadoop-yarn-server-resourcemanager/org/apache/hadoop/yarn/server/resourcemanager/webapp/RMWebServices.java:415
  restGap: true
- id: queue.derived.fairShareFreeMb
  entity: queue
  type: long
  format: mb
  from:
  - queue.fairResources.memory
  - queue.usedResources.memory
  derivation: fairResources.memory - usedResources.memory
  source: hadoop-yarn-server-resourcemanager/org/apache/hadoop/yarn/server/resourcemanager/webapp/dao/FairSchedulerQueueInfo.java:70
  restGap: true
  when:
  - scheduler=fair
- id: queue.derived.usedOfFairPct
  entity: queue
  type: float
  format: float-1dp
  from:
  - queue.usedResources.memory
  - queue.fairResources.memory
  derivation: usedResources.memory / fairResources.memory * 100
  source: hadoop-yarn-server-resourcemanager/org/apache/hadoop/yarn/server/resourcemanager/webapp/dao/FairSchedulerQueueInfo.java:70
  restGap: true
  when:
  - scheduler=fair
- id: queue.derived.usedOfMinPct
  entity: queue
  type: float
  format: float-1dp
  from:
  - queue.usedResources.memory
  - queue.minResources.memory
  derivation: usedResources.memory / minResources.memory * 100
  source: hadoop-yarn-server-resourcemanager/org/apache/hadoop/yarn/server/resourcemanager/webapp/dao/FairSchedulerQueueInfo.java:63
  restGap: true
  when:
  - scheduler=fair
- id: queue.derived.headroomMb
  entity: queue
  type: long
  format: mb
  from:
  - queue.maxEffectiveCapacity.memory
  - queue.resourcesUsed.memory
  - queue.maxResources.memory
  - queue.usedResources.memory
  derivation: 'capacity: maxEffectiveCapacity.memory - resourcesUsed.memory ; fair: maxResources.memory - usedResources.memory'
  source: hadoop-yarn-server-resourcemanager/org/apache/hadoop/yarn/server/resourcemanager/webapp/dao/CapacitySchedulerQueueInfo.java:45
  restGap: true
