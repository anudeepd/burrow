# Legacy RM UI — /cluster/scheduler (RmController#scheduler). One of three views by configured scheduler:
#   capacity (CapacitySchedulerPage) · fair (FairSchedulerPage + FairSchedulerAppsBlock) · fifo (DefaultSchedulerPage).
# All share route /cluster/scheduler and the shared chrome + MetricsOverviewTable (#schedulermetricsoverview).
# Sources (webapp pkg unless noted): CapacitySchedulerPage.java, FairSchedulerPage.java, DefaultSchedulerPage.java,
#   SchedulerPageUtil.java, FairSchedulerAppsBlock.java, RmController.java, RMWebApp.java; dao/{CapacityScheduler*,FairScheduler*,
#   FifoSchedulerInfo,SchedulerInfo,QueueCapacitiesInfo,PartitionQueueCapacitiesInfo,ResourcesInfo,PartitionResourcesInfo,ResourceInfo,
#   QueueAclsInfo,QueueAclInfo,UsersInfo,LeafQueueTemplateInfo,QueueCapacityVectorInfo,QueueCapacityVectorEntryInfo,
#   AutoQueueTemplatePropertiesInfo}.java; scheduler/capacity/UserInfo.java; hadoop-yarn-server-common webapp/WebPageUtils.java.
version: 1
derived:
  - {id: app.derived.fairShare, entity: app, type: long, format: int, from: [app.id], derivation: "fsinfo.getAppFairShare(app.getCurrentAppAttempt().getAppAttemptId()) => FSAppAttempt.getFairShare().getMemorySize(); FairSchedulerInfo.INVALID_FAIR_SHARE (-1) => the row is skipped", source: "FairSchedulerAppsBlock.java:172-176", restGap: true, altSource: "none in REST; per-app fair share is only in FairScheduler memory"}
  - {id: queue.derived.orderingPolicyDisplayName, entity: queue, type: string, format: none, from: [queue.orderingPolicyInfo], derivation: "q.getOrderingPolicy().getInfo()", source: "CapacitySchedulerLeafQueueInfo.java:66", restGap: true, altSource: "queue.orderingPolicyInfo (config name, not display name) at scheduler.schedulerInfo.queues.queue[].orderingPolicyInfo"}
  - {id: queue.derived.usedMemoryFraction, entity: queue, type: float, format: percent-1dp, from: [queue.usedResources.memory, queue.clusterResources.memory], derivation: "usedResources.getMemorySize() / clusterResources.getMemorySize()", source: "FairSchedulerQueueInfo.java:98-99", restGap: true, altSource: "compute from queue.usedResources.memory / queue.clusterResources.memory"}
  - {id: queue.derived.steadyFairShareMemoryFraction, entity: queue, type: float, format: percent-1dp, from: [queue.steadyFairResources.memory, queue.clusterResources.memory], derivation: "steadyFairResources.getMemorySize() / clusterResources.getMemorySize()", source: "FairSchedulerQueueInfo.java:113-114", restGap: true, altSource: "compute from queue.steadyFairResources.memory / queue.clusterResources.memory"}
  - {id: queue.derived.instantaneousFairShareMemoryFraction, entity: queue, type: float, format: percent-1dp, from: [queue.fairResources.memory, queue.clusterResources.memory], derivation: "fairResources.getMemorySize() / clusterResources.getMemorySize()", source: "FairSchedulerQueueInfo.java:115-116", restGap: true, altSource: "compute from queue.fairResources.memory / queue.clusterResources.memory"}
  - {id: queue.derived.maxResourcesFraction, entity: queue, type: float, format: percent-1dp, from: [queue.maxResources.memory, queue.clusterResources.memory], derivation: "maxResources.getMemorySize() / clusterResources.getMemorySize()", source: "FairSchedulerQueueInfo.java:117", restGap: true, altSource: "compute from queue.maxResources.memory / queue.clusterResources.memory"}
  - {id: queue.derived.partitionUiTag, entity: queue, type: string, format: none, from: ["queue.capacities.queueCapacitiesByPartition.partitionName"], derivation: "\"Partition: \" + (partitionName.isEmpty() ? NodeLabel.DEFAULT_NODE_LABEL_PARTITION : partitionName) + \" \" + label.getResource().toString()", source: "CapacitySchedulerPage.java:507-509", restGap: true, altSource: "partitionName from queue.capacities.queueCapacitiesByPartition[]; the RMNodeLabel resource string is only in rm.get-node-labels"}
  - {id: queueuser.derived.maxAmResource, entity: queueuser, type: string, format: resource-string, from: ["queue.resources.resourceUsagesByPartition.userAmLimit", queueuser.userWeight], derivation: "queueUsageResources.getUserAmLimit() (fallback queueUsageResources.getAMLimit() when null), multiplied by userInfo.getUserWeight() when userWeight != 1.0; ResourceInfo.toString()", source: "CapacitySchedulerPage.java:262-276", restGap: true, altSource: "queue.resources.resourceUsagesByPartition[].userAmLimit (queue-level, unweighted)"}
  - {id: scheduler.derived.aggregateAllocatedContainers, entity: scheduler, type: long, format: int, from: [], derivation: "cs.getRootQueueMetrics().getAggregateAllocatedContainers()", source: "CapacitySchedulerPage.java:563-565", restGap: true, altSource: "none in REST [INFERENCE - QueueMetrics JMX may expose it]"}
  - {id: scheduler.derived.aggregateReleasedContainers, entity: scheduler, type: long, format: int, from: [], derivation: "cs.getRootQueueMetrics().getAggegatedReleasedContainers()", source: "CapacitySchedulerPage.java:566-568", restGap: true, altSource: "none in REST"}
  - {id: scheduler.derived.aggregateFulfilledReservations, entity: scheduler, type: long, format: int, from: [], derivation: "healthInfo.getAggregateFulFilledReservationsCount()", source: "CapacitySchedulerPage.java:569", restGap: true, altSource: "none in REST"}
  - {id: scheduler.derived.aggregatePreemptions, entity: scheduler, type: long, format: int, from: [], derivation: "healthInfo.getAggregatePreemptionCount()", source: "CapacitySchedulerPage.java:570", restGap: true, altSource: "none in REST"}
  - {id: scheduler.derived.lastOperationTimestamp, entity: scheduler, type: long, format: epoch-datetime, from: [], derivation: "SchedulerHealth.DetailedInformation.getTimestamp() for the operation (Allocation|Reservation|Release|Preemption); 0 => containerId/nodeId/queue default to \"N/A\"", source: "CapacitySchedulerPage.java:617-621", restGap: true, altSource: "none (CapacitySchedulerHealthInfo.OperationInformation carries no timestamp)"}
pages:
  - id: legacy.rm.scheduler.capacity
    daemon: rm
    route: /cluster/scheduler
    title: "Capacity Scheduler"
    classes: [RmController#scheduler, CapacitySchedulerPage, CSQInfo, LeafQueueInfoBlock, QueueUsersInfoBlock, QueueBlock, QueuesBlock, HealthBlock, SchedulerPageUtil.QueueBlockUtil, MetricsOverviewTable, RMAppsBlock]
    when: [scheduler=capacity]
    includes: [legacy.rm.shared.chrome, legacy.rm.shared.metrics]
    query:
      - {name: openQueues, doc: "queue names separated by '#' that should be auto-expanded in the queue tree; preserved/updated in the URL by SchedulerPageUtil#reopenQueue/storeExpandedQueue (CapacitySchedulerPage.postHead includes QueueBlockUtil)"}
    sections:
      - id: legacy.rm.scheduler.capacity.page
        title: null
        source: "RmController.java:89"
        items:
          - {id: legacy.rm.scheduler.capacity.page.title, label: "Capacity Scheduler", kind: title, field: static.page.scheduler.title, format: none, source: "RmController.java:89", note: "setTitle('Capacity Scheduler') => <title>/h1; also when rs == null"}
      - id: legacy.rm.scheduler.capacity.queues
        title: "Application Queues"
        source: "CapacitySchedulerPage.java:442"
        items:
          - {id: legacy.rm.scheduler.capacity.queues.heading, label: "Application Queues", kind: title, field: static.section.applicationQueues, format: none, source: "CapacitySchedulerPage.java:442", note: "div.ui-widget-header of div#cs-wrapper"}
          - {id: legacy.rm.scheduler.capacity.queues.dump-logs, label: "Dump scheduler logs", kind: button, field: static.button.dumpSchedulerLogs, format: none, when: ["other:areACLsEnabled()==false || callerUGI is admin"], scenario: "viewing user is an RM admin (or app ACLs disabled)", source: "CapacitySchedulerPage.java:406", tooltip: null, note: "POST /ws/v1/cluster/scheduler/logs with time param; button onClick=confirmAction()"}
          - {id: legacy.rm.scheduler.capacity.queues.dump-1min, label: "1 min", kind: button, field: static.option.dumpLogs1min, format: none, when: ["other:same admin condition as the Dump scheduler logs button"], source: "CapacitySchedulerPage.java:407", note: "select#time option value=60"}
          - {id: legacy.rm.scheduler.capacity.queues.dump-5min, label: "5 min", kind: button, field: static.option.dumpLogs5min, format: none, when: ["other:same admin condition as the Dump scheduler logs button"], source: "CapacitySchedulerPage.java:407", note: "option value=300"}
          - {id: legacy.rm.scheduler.capacity.queues.dump-10min, label: "10 min", kind: button, field: static.option.dumpLogs10min, format: none, when: ["other:same admin condition as the Dump scheduler logs button"], source: "CapacitySchedulerPage.java:408", note: "option value=600"}
          - {id: legacy.rm.scheduler.capacity.queues.legend-heading, label: "Legend:", kind: legend, field: static.legend.heading, format: none, source: "CapacitySchedulerPage.java:454"}
          - {id: legacy.rm.scheduler.capacity.queues.legend-capacity, label: "Capacity", kind: legend, field: static.legend.capacity, format: none, source: "CapacitySchedulerPage.java:456", note: "dashed-border swatch Q_GIVEN = configured capacity band"}
          - {id: legacy.rm.scheduler.capacity.queues.legend-used, label: "Used", kind: legend, field: static.legend.used, format: none, source: "CapacitySchedulerPage.java:458", note: "swatch Q_UNDER = used under capacity"}
          - {id: legacy.rm.scheduler.capacity.queues.legend-over, label: "Used (over capacity)", kind: legend, field: static.legend.usedOver, format: none, source: "CapacitySchedulerPage.java:460", note: "swatch Q_OVER"}
          - {id: legacy.rm.scheduler.capacity.queues.legend-max, label: "Max Capacity", kind: legend, field: static.legend.maxCapacity, format: none, source: "CapacitySchedulerPage.java:462"}
          - {id: legacy.rm.scheduler.capacity.queues.legend-requesting, label: "Users Requesting Resources", kind: legend, field: static.legend.usersRequesting, format: none, source: "CapacitySchedulerPage.java:464", note: "swatch ACTIVE_USER (#FFFF00); highlights users with isActive in the users table"}
          - {id: legacy.rm.scheduler.capacity.queues.legend-autocreated, label: "Auto Created Queues", kind: legend, field: static.legend.autoCreated, format: none, source: "CapacitySchedulerPage.java:466", note: "swatch Q_AUTO_CREATED (#F4F0CB)"}
          - {id: legacy.rm.scheduler.capacity.queues.fallback-bar, label: "100% ", kind: chart, field: static.bar.defaultQueue, format: none, when: ["other:cs == null"], scenario: "scheduler not yet initialised", source: "CapacitySchedulerPage.java:449", note: "fallback bar labelled 'default'"}
          - {id: legacy.rm.scheduler.capacity.queues.apps-block, label: null, kind: text, field: static.block.appsTable, format: none, source: "CapacitySchedulerPage.java:535", note: "renders the shared RMAppsBlock #apps applications table (inventoried in legacy.rm.apps.table); clicking a queue in the tree fnFilters that table on column index 5 (queue)"}
      - id: legacy.rm.scheduler.capacity.bar
        title: null
        source: "CapacitySchedulerPage.java:492"
        when: [scheduler=capacity]
        items:
          - {id: legacy.rm.scheduler.capacity.bar.root, label: " used", dynamic: true, kind: chart, field: scheduler.usedCapacity, rest: {resource: rm.scheduler, path: "scheduler.schedulerInfo.usedCapacity"}, derivation: "used = sinfo.getUsedCapacity() / 100; text = StringUtils.formatPercent(used,1) + \" used\"", format: percent-1dp, normaliser: percent, when: ["fact:!labelsWithActiveNMs"], source: "CapacitySchedulerPage.java:474-497 (root bar only when !hasAnyLabelLinkedToNM; otherwise one Partition bar per label, each followed by its own ul#pq tree)", tooltip: null, note: "root bar shown when no node label has active NMs; width fixed Q_MAX_WIDTH"}
          - {id: legacy.rm.scheduler.capacity.bar.root-name, label: "root", kind: text, field: scheduler.queueName, rest: {resource: rm.scheduler, path: "scheduler.schedulerInfo.queueName"}, format: none, when: ["fact:!labelsWithActiveNMs"], source: "CapacitySchedulerPage.java:474-495 (root bar only when !hasAnyLabelLinkedToNM)"}
          - {id: legacy.rm.scheduler.capacity.bar.partition, label: null, dynamic: true, kind: chart, field: queue.derived.partitionUiTag, fields: ["queue.capacities.queueCapacitiesByPartition.partitionName", "queue.capacities.queueCapacitiesByPartition.usedCapacity"], rest: {resource: rm.scheduler, path: "scheduler.schedulerInfo.capacities.queueCapacitiesByPartition[].usedCapacity"}, derivation: "used = capacities.getUsedCapacity()/100; span text = partitionUiTag; qstats = formatPercent(used,1)+\" used\"", format: none, normaliser: percent, source: "CapacitySchedulerPage.java:507-517", when: ["fact:labelsWithActiveNMs"], scenario: "at least one node label (other than default) has active NMs", note: "one bar per RMNodeLabel; nested subtree repeats the bar for root under each label"}
          - {id: legacy.rm.scheduler.capacity.bar.queue, label: " used", dynamic: true, kind: chart, field: "queue.capacities.queueCapacitiesByPartition.usedCapacity", fields: ["queue.capacities.queueCapacitiesByPartition.absoluteCapacity", "queue.capacities.queueCapacitiesByPartition.absoluteUsedCapacity", "queue.capacities.queueCapacitiesByPartition.absoluteMaxCapacity", "queue.capacities.queueCapacitiesByPartition.capacity"], rest: {resource: rm.scheduler, path: "scheduler.schedulerInfo.queues.queue[].capacities.queueCapacitiesByPartition[].usedCapacity"}, derivation: "used=usedCapacity/100; absCap=absoluteCapacity/100; absMaxCap=absoluteMaxCapacity/100; absUsedCap=absoluteUsedCapacity/100; width(absMaxCap*0.8); given span width absCap/absMaxCap; used span width absUsedCap/absMaxCap (Q_OVER when absUsedCap>absCap else Q_UNDER); stats=formatPercent(used,1)+\" used\"", format: percent-1dp, normaliser: percent, source: "CapacitySchedulerPage.java:335-353", tooltip: "Absolute Capacity:", note: "one li per sub-queue; tooltip text = 'Absolute Capacity:' + formatPercent(absCap,1); leaf queues append the leaf info + users blocks"}
          - {id: legacy.rm.scheduler.capacity.bar.queue-name, label: null, kind: text, field: queue.queuePath, rest: {resource: rm.scheduler, path: "scheduler.schedulerInfo.queues.queue[].queuePath"}, format: none, source: "CapacitySchedulerPage.java:351"}
          - {id: legacy.rm.scheduler.capacity.bar.autocreated, label: null, kind: chart, field: queue.isAutoCreatedLeafQueue, rest: {resource: rm.scheduler, path: "scheduler.schedulerInfo.queues.queue[].isAutoCreatedLeafQueue"}, format: boolean, source: "CapacitySchedulerPage.java:343-346", when: ["scheduler=capacity"], note: "true => li background Q_AUTO_CREATED (#F4F0CB) on top of the width style"}
      - id: legacy.rm.scheduler.capacity.leafqueue
        title: null
        source: "CapacitySchedulerPage.java:116"
        when: [scheduler=capacity]
        scenario: "leaf queue selected in the tree (per-leaf QueueInfoBlock + '#lq' subtree)"
        items:
          - {id: legacy.rm.scheduler.capacity.leafqueue.title, label: " Queue Status", dynamic: true, kind: title, field: queue.queuePath, rest: {resource: rm.scheduler, path: "scheduler.schedulerInfo.queues.queue[].queuePath"}, derivation: "\"'\" + lqinfo.getQueuePath() + \"' Queue Status\"", format: none, normaliser: quoted-name, source: "CapacitySchedulerPage.java:128"}
          - {id: legacy.rm.scheduler.capacity.leafqueue.partition-title, label: " Queue Status for Partition", dynamic: true, kind: title, field: queue.queuePath, fields: ["queue.capacities.queueCapacitiesByPartition.partitionName"], rest: {resource: rm.scheduler, path: "scheduler.schedulerInfo.queues.queue[].queuePath"}, derivation: "\"'\" + lqinfo.getQueuePath() + \"' Queue Status for Partition '\" + nodeLabelDisplay + \"'\" (nodeLabelDisplay = DEFAULT_NODE_LABEL_PARTITION when the label is empty)", format: none, normaliser: quoted-name, source: "CapacitySchedulerPage.java:106-108", when: ["labels"], scenario: "queue tree opened under a node-label partition"}
          - {id: legacy.rm.scheduler.capacity.leafqueue.queue-state, label: "Queue State:", kind: kv, field: queue.state, rest: {resource: rm.scheduler, path: "scheduler.schedulerInfo.queues.queue[].state"}, format: enum, source: "CapacitySchedulerPage.java:129", note: "QueueState name (RUNNING/STOPPED/DRAINING)"}
          - {id: legacy.rm.scheduler.capacity.leafqueue.used-capacity, label: "Used Capacity:", kind: kv, field: "queue.capacities.queueCapacitiesByPartition.usedCapacity", fields: ["queue.resources.resourceUsagesByPartition.used"], rest: {resource: rm.scheduler, path: "scheduler.schedulerInfo.queues.queue[].capacities.queueCapacitiesByPartition[].usedCapacity"}, derivation: "appendPercent(resourceUsages.getUsed(), capacities.getUsedCapacity()/100) => ResourceInfo.toString() + \" (\" + formatPercent(f,1) + \")\"", format: "other:ResourceInfo.toString() + ' (percent)'", normaliser: resource-string, source: "CapacitySchedulerPage.java:159"}
          - {id: legacy.rm.scheduler.capacity.leafqueue.configured-weight, label: "Configured Weight:", dynamic: true, kind: kv, field: "queue.capacities.queueCapacitiesByPartition.weight", fields: ["queue.capacities.queueCapacitiesByPartition.configuredMinResource"], rest: {resource: rm.scheduler, path: "scheduler.schedulerInfo.queues.queue[].capacities.queueCapacitiesByPartition[].weight"}, derivation: "capacities.getWeight() != -1 ? label \"Configured Weight:\", value capacities.getWeight() : label \"Configured Capacity:\", value configuredMinResource == null ? Resources.none().toString() : configuredMinResource.toString()", format: "other:float or resource-string", source: "CapacitySchedulerPage.java:165-169", note: "label switches between 'Configured Weight:' and 'Configured Capacity:' depending on whether weight is set (weight == -1 means unset)"}
          - {id: legacy.rm.scheduler.capacity.leafqueue.configured-max-capacity, label: "Configured Max Capacity:", kind: kv, field: "queue.capacities.queueCapacitiesByPartition.configuredMaxResource", rest: {resource: rm.scheduler, path: "scheduler.schedulerInfo.queues.queue[].capacities.queueCapacitiesByPartition[].configuredMaxResource"}, derivation: "configuredMaxResource == null || configuredMaxResource.getResource().equals(Resources.none()) ? \"unlimited\" : configuredMaxResource.toString()", format: resource-string, normaliser: resource-string, nullDisplay: "unlimited", source: "CapacitySchedulerPage.java:170-174"}
          - {id: legacy.rm.scheduler.capacity.leafqueue.effective-capacity, label: "Effective Capacity:", kind: kv, field: "queue.capacities.queueCapacitiesByPartition.effectiveMinResource", fields: ["queue.capacities.queueCapacitiesByPartition.capacity"], rest: {resource: rm.scheduler, path: "scheduler.schedulerInfo.queues.queue[].capacities.queueCapacitiesByPartition[].effectiveMinResource"}, derivation: "appendPercent(capacities.getEffectiveMinResource(), capacities.getCapacity()/100)", format: "other:ResourceInfo.toString() + ' (percent)'", normaliser: resource-string, source: "CapacitySchedulerPage.java:176-178"}
          - {id: legacy.rm.scheduler.capacity.leafqueue.effective-max-capacity, label: "Effective Max Capacity:", kind: kv, field: "queue.capacities.queueCapacitiesByPartition.effectiveMaxResource", fields: ["queue.capacities.queueCapacitiesByPartition.maxCapacity"], rest: {resource: rm.scheduler, path: "scheduler.schedulerInfo.queues.queue[].capacities.queueCapacitiesByPartition[].effectiveMaxResource"}, derivation: "appendPercent(capacities.getEffectiveMaxResource(), capacities.getMaxCapacity()/100)", format: "other:ResourceInfo.toString() + ' (percent)'", normaliser: resource-string, source: "CapacitySchedulerPage.java:179-181"}
          - {id: legacy.rm.scheduler.capacity.leafqueue.absolute-used-capacity, label: "Absolute Used Capacity:", kind: kv, field: "queue.capacities.queueCapacitiesByPartition.absoluteUsedCapacity", rest: {resource: rm.scheduler, path: "scheduler.schedulerInfo.queues.queue[].capacities.queueCapacitiesByPartition[].absoluteUsedCapacity"}, derivation: "percent(capacities.getAbsoluteUsedCapacity()/100)", format: percent-1dp, normaliser: percent, source: "CapacitySchedulerPage.java:182-183"}
          - {id: legacy.rm.scheduler.capacity.leafqueue.absolute-capacity, label: "Absolute Configured Capacity:", kind: kv, field: "queue.capacities.queueCapacitiesByPartition.absoluteCapacity", rest: {resource: rm.scheduler, path: "scheduler.schedulerInfo.queues.queue[].capacities.queueCapacitiesByPartition[].absoluteCapacity"}, derivation: "percent(capacities.getAbsoluteCapacity()/100)", format: percent-1dp, normaliser: percent, source: "CapacitySchedulerPage.java:184-185"}
          - {id: legacy.rm.scheduler.capacity.leafqueue.absolute-max-capacity, label: "Absolute Configured Max Capacity:", kind: kv, field: "queue.capacities.queueCapacitiesByPartition.absoluteMaxCapacity", rest: {resource: rm.scheduler, path: "scheduler.schedulerInfo.queues.queue[].capacities.queueCapacitiesByPartition[].absoluteMaxCapacity"}, derivation: "percent(capacities.getAbsoluteMaxCapacity()/100)", format: percent-1dp, normaliser: percent, source: "CapacitySchedulerPage.java:186-187"}
          - {id: legacy.rm.scheduler.capacity.leafqueue.used-resources, label: "Used Resources:", kind: kv, field: "queue.resources.resourceUsagesByPartition.used", rest: {resource: rm.scheduler, path: "scheduler.schedulerInfo.queues.queue[].resources.resourceUsagesByPartition[].used"}, format: resource-string, normaliser: resource-string, source: "CapacitySchedulerPage.java:188"}
          - {id: legacy.rm.scheduler.capacity.leafqueue.max-am-limit-pct, label: "Configured Max Application Master Limit:", kind: kv, field: "queue.capacities.queueCapacitiesByPartition.maxAMLimitPercentage", rest: {resource: rm.scheduler, path: "scheduler.schedulerInfo.queues.queue[].capacities.queueCapacitiesByPartition[].maxAMLimitPercentage"}, derivation: "StringUtils.format(\"%.1f\", capacities.getMaxAMLimitPercentage())", format: float-1dp, normaliser: other:float, source: "CapacitySchedulerPage.java:189-190", note: "raw 1-dp float, no % sign"}
          - {id: legacy.rm.scheduler.capacity.leafqueue.max-am-resources, label: "Max Application Master Resources:", kind: kv, field: "queue.resources.resourceUsagesByPartition.amLimit", rest: {resource: rm.scheduler, path: "scheduler.schedulerInfo.queues.queue[].resources.resourceUsagesByPartition[].amLimit"}, format: resource-string, normaliser: resource-string, source: "CapacitySchedulerPage.java:191-192"}
          - {id: legacy.rm.scheduler.capacity.leafqueue.used-am-resources, label: "Used Application Master Resources:", kind: kv, field: "queue.resources.resourceUsagesByPartition.amUsed", rest: {resource: rm.scheduler, path: "scheduler.schedulerInfo.queues.queue[].resources.resourceUsagesByPartition[].amUsed"}, derivation: "amUsed = resourceUsages.getAmUsed() == null ? new ResourceInfo(Resources.none()) : resourceUsages.getAmUsed(); toString()", format: resource-string, normaliser: resource-string, source: "CapacitySchedulerPage.java:193", note: "null amUsed (partition without AM usage) prints <memory:0, vCores:0>"}
          - {id: legacy.rm.scheduler.capacity.leafqueue.max-am-per-user, label: "Max Application Master Resources Per User:", kind: kv, field: "queue.resources.resourceUsagesByPartition.userAmLimit", rest: {resource: rm.scheduler, path: "scheduler.schedulerInfo.queues.queue[].resources.resourceUsagesByPartition[].userAmLimit"}, format: resource-string, normaliser: resource-string, source: "CapacitySchedulerPage.java:194-195"}
          - {id: legacy.rm.scheduler.capacity.leafqueue.num-active-apps, label: "Num Schedulable Applications:", kind: kv, field: queue.numActiveApplications, rest: {resource: rm.scheduler, path: "scheduler.schedulerInfo.queues.queue[].numActiveApplications"}, format: int, normaliser: int, source: "CapacitySchedulerPage.java:200-201"}
          - {id: legacy.rm.scheduler.capacity.leafqueue.num-pending-apps, label: "Num Non-Schedulable Applications:", kind: kv, field: queue.numPendingApplications, rest: {resource: rm.scheduler, path: "scheduler.schedulerInfo.queues.queue[].numPendingApplications"}, format: int, normaliser: int, source: "CapacitySchedulerPage.java:202-203"}
          - {id: legacy.rm.scheduler.capacity.leafqueue.num-containers, label: "Num Containers:", kind: kv, field: queue.numContainers, rest: {resource: rm.scheduler, path: "scheduler.schedulerInfo.queues.queue[].numContainers"}, format: int, normaliser: int, source: "CapacitySchedulerPage.java:204-205"}
          - {id: legacy.rm.scheduler.capacity.leafqueue.max-applications, label: "Max Applications:", kind: kv, field: queue.maxApplications, rest: {resource: rm.scheduler, path: "scheduler.schedulerInfo.queues.queue[].maxApplications"}, format: int, normaliser: int, source: "CapacitySchedulerPage.java:206-207"}
          - {id: legacy.rm.scheduler.capacity.leafqueue.max-apps-per-user, label: "Max Applications Per User:", kind: kv, field: queue.maxApplicationsPerUser, rest: {resource: rm.scheduler, path: "scheduler.schedulerInfo.queues.queue[].maxApplicationsPerUser"}, format: int, normaliser: int, source: "CapacitySchedulerPage.java:208-209"}
          - {id: legacy.rm.scheduler.capacity.leafqueue.min-user-limit-pct, label: "Configured Minimum User Limit Percent:", kind: kv, field: queue.userLimit, rest: {resource: rm.scheduler, path: "scheduler.schedulerInfo.queues.queue[].userLimit"}, derivation: "lqinfo.getUserLimit() + \"%\"", format: percent-int, normaliser: percent, source: "CapacitySchedulerPage.java:210-211"}
          - {id: legacy.rm.scheduler.capacity.leafqueue.user-limit-factor, label: "Configured User Limit Factor:", kind: kv, field: queue.userLimitFactor, rest: {resource: rm.scheduler, path: "scheduler.schedulerInfo.queues.queue[].userLimitFactor"}, format: none, normaliser: other:float, source: "CapacitySchedulerPage.java:212"}
          - {id: legacy.rm.scheduler.capacity.leafqueue.node-labels, label: "Accessible Node Labels:", kind: kv, field: queue.nodeLabels, rest: {resource: rm.scheduler, path: "scheduler.schedulerInfo.queues.queue[].nodeLabels"}, derivation: "StringUtils.join(\",\", lqinfo.getNodeLabels())", format: join-comma, normaliser: none, source: "CapacitySchedulerPage.java:213-214"}
          - {id: legacy.rm.scheduler.capacity.leafqueue.ordering-policy, label: "Ordering Policy: ", kind: kv, field: queue.derived.orderingPolicyDisplayName, fields: [queue.orderingPolicyInfo], rest: null, derivation: "lqinfo.getOrderingPolicyDisplayName()", format: none, source: "CapacitySchedulerPage.java:215", restGap: true, note: "display name is @XmlTransient; REST exposes only orderingPolicyInfo (config name)"}
