          - {id: legacy.rm.shared.metrics.cluster.containers-running, label: "Containers Running", kind: metric, field: cluster.metrics.containersAllocated, fields: [cluster.metrics.totalAllocatedContainersAcrossPartition, cluster.metrics.crossPartitionMetricsAvailable], rest: {resource: rm.metrics, path: "clusterMetrics.containersAllocated"}, derivation: "allocatedContainers = crossPartitionMetricsAvailable ? getTotalAllocatedContainersAcrossPartition() : getContainersAllocated()", format: int, normaliser: int, source: "MetricsOverviewTable.java:104", note: "value source switches on crossPartitionMetricsAvailable (true only for CapacityScheduler with a root queue)", when: ["scheduler=capacity"]}
