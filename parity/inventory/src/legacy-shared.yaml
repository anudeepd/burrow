# Legacy RM UI — shared blocks included by many pages (chrome, nav, MetricsOverviewTable).
# Sources: .cluster/src-extract/hadoop-yarn-server-resourcemanager/.../webapp/{NavBlock,MetricsOverviewTable,RmView}.java,
#          hadoop-yarn-server-common/.../webapp/WebPageUtils.java, hadoop-yarn-common/.../webapp/view/{HeaderBlock,JQueryUI,TwoColumnLayout}.java
version: 1
derived:
  - {id: clusteruser.derived.loggedInText, entity: clusteruser, type: string, format: none, from: [clusteruser.requestedUser], derivation: '"Logged in as: " + request().getRemoteUser()  (empty string when getRemoteUser()==null)', source: "HeaderBlock.java:29"}
  - {id: cluster.metrics.derived.appsCompletedAll, entity: cluster.metrics, type: long, format: int, from: [cluster.metrics.appsCompleted, cluster.metrics.appsFailed, cluster.metrics.appsKilled], derivation: "String.valueOf(clusterMetrics.getAppsCompleted() + clusterMetrics.getAppsFailed() + clusterMetrics.getAppsKilled())", source: "MetricsOverviewTable.java:117"}
  - {id: cluster.metrics.derived.usedResourcesText, entity: cluster.metrics, type: string, format: resource-string, from: [cluster.metrics.allocatedMB, cluster.metrics.allocatedVirtualCores, cluster.metrics.totalUsedResourcesAcrossPartition.memory, cluster.metrics.totalUsedResourcesAcrossPartition.vCores, cluster.metrics.totalReservedResourcesAcrossPartition.memory, cluster.metrics.totalReservedResourcesAcrossPartition.vCores], derivation: 'usedResources.getFormattedString() => "<memory:" + StringUtils.byteDesc(MB*1024*1024) + ", vCores:" + vcores + [", name: value+units" for nonzero custom resources] + ">"; usedResources = crossPartitionMetricsAvailable ? totalUsedResourcesAcrossPartition - totalReservedResourcesAcrossPartition : (allocatedMB, allocatedVirtualCores)', source: "MetricsOverviewTable.java:70-124"}
  - {id: cluster.metrics.derived.totalResourcesText, entity: cluster.metrics, type: string, format: resource-string, from: [cluster.metrics.totalMB, cluster.metrics.totalVirtualCores, cluster.metrics.totalClusterResourcesAcrossPartition.memory, cluster.metrics.totalClusterResourcesAcrossPartition.vCores], derivation: 'totalResources.getFormattedString(); totalResources = crossPartitionMetricsAvailable ? totalClusterResourcesAcrossPartition : (totalMB, totalVirtualCores)', source: "MetricsOverviewTable.java:75-125"}
  - {id: cluster.metrics.derived.reservedResourcesText, entity: cluster.metrics, type: string, format: resource-string, from: [cluster.metrics.reservedMB, cluster.metrics.reservedVirtualCores, cluster.metrics.totalReservedResourcesAcrossPartition.memory, cluster.metrics.totalReservedResourcesAcrossPartition.vCores], derivation: 'reservedResources.getFormattedString(); reservedResources = crossPartitionMetricsAvailable ? totalReservedResourcesAcrossPartition : (reservedMB, reservedVirtualCores)', source: "MetricsOverviewTable.java:78-126"}
  - {id: usermetrics.derived.appsSubmitted, entity: usermetrics, type: int, format: int, from: [], derivation: "userMetrics.getAppsSubmitted()  (QueueMetrics of root queue, user tag)", source: "MetricsOverviewTable.java:182", restGap: true, altSource: "/jmx bean Hadoop:service=ResourceManager,name=QueueMetrics,q0=root,user=<user> attribute AppsSubmitted [INFERENCE - verify live]"}
  - {id: usermetrics.derived.appsPending, entity: usermetrics, type: int, format: int, from: [], derivation: "userMetrics.getAppsPending()", source: "MetricsOverviewTable.java:183", restGap: true, altSource: "/jmx QueueMetrics q0=root,user=<user> AppsPending"}
  - {id: usermetrics.derived.appsRunning, entity: usermetrics, type: int, format: int, from: [], derivation: "userMetrics.getAppsRunning()", source: "MetricsOverviewTable.java:184", restGap: true, altSource: "/jmx QueueMetrics q0=root,user=<user> AppsRunning"}
  - {id: usermetrics.derived.appsCompletedAll, entity: usermetrics, type: int, format: int, from: [], derivation: "userMetrics.getAppsCompleted() + userMetrics.getAppsFailed() + userMetrics.getAppsKilled()", source: "MetricsOverviewTable.java:185-190", restGap: true, altSource: "/jmx QueueMetrics q0=root,user=<user> AppsCompleted+AppsFailed+AppsKilled"}
  - {id: usermetrics.derived.runningContainers, entity: usermetrics, type: int, format: int, from: [], derivation: "userMetrics.getRunningContainers() (= userMetrics.getAllocatedContainers())", source: "MetricsOverviewTable.java:191", restGap: true, altSource: "/jmx QueueMetrics q0=root,user=<user> AllocatedContainers"}
  - {id: usermetrics.derived.pendingContainers, entity: usermetrics, type: int, format: int, from: [], derivation: "userMetrics.getPendingContainers()", source: "MetricsOverviewTable.java:192", restGap: true, altSource: "/jmx QueueMetrics q0=root,user=<user> PendingContainers"}
  - {id: usermetrics.derived.reservedContainers, entity: usermetrics, type: int, format: int, from: [], derivation: "userMetrics.getReservedContainers()", source: "MetricsOverviewTable.java:193", restGap: true, altSource: "/jmx QueueMetrics q0=root,user=<user> ReservedContainers"}
  - {id: usermetrics.derived.allocatedMBText, entity: usermetrics, type: string, format: byteDesc, from: [], derivation: "StringUtils.byteDesc(userMetrics.getAllocatedMB() * BYTES_IN_MB)", source: "MetricsOverviewTable.java:194", restGap: true, altSource: "/jmx QueueMetrics q0=root,user=<user> AllocatedMB"}
  - {id: usermetrics.derived.pendingMBText, entity: usermetrics, type: string, format: byteDesc, from: [], derivation: "StringUtils.byteDesc(userMetrics.getPendingMB() * BYTES_IN_MB)", source: "MetricsOverviewTable.java:195", restGap: true, altSource: "/jmx QueueMetrics q0=root,user=<user> PendingMB"}
  - {id: usermetrics.derived.reservedMBText, entity: usermetrics, type: string, format: byteDesc, from: [], derivation: "StringUtils.byteDesc(userMetrics.getReservedMB() * BYTES_IN_MB)", source: "MetricsOverviewTable.java:196", restGap: true, altSource: "/jmx QueueMetrics q0=root,user=<user> ReservedMB"}
  - {id: usermetrics.derived.allocatedVirtualCores, entity: usermetrics, type: long, format: int, from: [], derivation: "userMetrics.getAllocatedVirtualCores()", source: "MetricsOverviewTable.java:197", restGap: true, altSource: "/jmx QueueMetrics q0=root,user=<user> AllocatedVCores"}
  - {id: usermetrics.derived.pendingVirtualCores, entity: usermetrics, type: long, format: int, from: [], derivation: "userMetrics.getPendingVirtualCores()", source: "MetricsOverviewTable.java:198", restGap: true, altSource: "/jmx QueueMetrics q0=root,user=<user> PendingVCores"}
  - {id: usermetrics.derived.reservedVirtualCores, entity: usermetrics, type: long, format: int, from: [], derivation: "userMetrics.getReservedVirtualCores()", source: "MetricsOverviewTable.java:199", restGap: true, altSource: "/jmx QueueMetrics q0=root,user=<user> ReservedVCores"}
  - {id: scheduler.derived.schedulerName, entity: scheduler, type: string, format: none, from: [scheduler.type], derivation: 'SchedulerInfo.schedulerName: "Capacity Scheduler" | "Fair Scheduler" | "Fifo Scheduler" | rs.getClass().getSimpleName()  (String.valueOf(schedulerInfo.getSchedulerType()))', source: "SchedulerInfo.java:51-59", note: "REST /scheduler exposes type=capacityScheduler|fairScheduler|fifoScheduler, not this display name"}
  - {id: scheduler.derived.schedulingResourceTypes, entity: scheduler, type: string, format: "other:Arrays.toString(ResourceTypeInfo[])", from: [], derivation: "Arrays.toString(ResourceUtils.getResourcesTypeInfo().toArray(new ResourceTypeInfo[0])) => \"[name: memory-mb, units: Mi, type: COUNTABLE, minimum: 0, maximum: 9223372036854775807, name: vcores, ...]\"", source: "MetricsOverviewTable.java:231-232", altSource: "GET /ws/v1/cluster/resource-types (ResourceTypeInfo list)"}
  - {id: scheduler.derived.minAllocationText, entity: scheduler, type: string, format: resource-string, from: [], derivation: "schedulerInfo.getMinAllocation().toString() => ResourceInfo.toString() => Resource.toString() \"<memory:M, vCores:V[, custom: n units]>\" (rs.getMinimumResourceCapability())", source: "MetricsOverviewTable.java:233", restGap: true, altSource: "none in /ws/v1/cluster/scheduler for FIFO/Fair; Capacity exposes maximumAllocation only"}
  - {id: scheduler.derived.maxAllocationText, entity: scheduler, type: string, format: resource-string, from: [], derivation: "schedulerInfo.getMaxAllocation().toString() (rs.getMaximumResourceCapability())", source: "MetricsOverviewTable.java:234", altSource: "scheduler.maximumAllocation.* (CapacitySchedulerInfo) where available"}
  - {id: scheduler.derived.maximumClusterPriority, entity: scheduler, type: int, format: int, from: [], derivation: "schedulerInfo.getMaxClusterLevelAppPriority() (rs.getMaxClusterLevelAppPriority().getPriority())", source: "MetricsOverviewTable.java:235", restGap: true, altSource: "none in REST [INFERENCE - confirm with rest-schema scheduler fields]"}
pages:
  - id: legacy.rm.shared.chrome
    daemon: rm
    route: "(every /cluster/* page)"
    title: "(per page)"
    classes: [TwoColumnLayout, HeaderBlock, FooterBlock, NavBlock, WebPageUtils, JQueryUI]
    sections:
      - id: legacy.rm.shared.chrome.header
        title: null
        source: "HeaderBlock.java:26"
        items:
          - {id: legacy.rm.shared.chrome.header.user, label: "Logged in as: ", dynamic: true, kind: text, field: clusteruser.derived.loggedInText, fields: [clusteruser.requestedUser], rest: {resource: rm.cluster-user-info, path: "clusterUserInfo.requestedUser"}, derivation: '"Logged in as: " + request().getRemoteUser()', format: none, when: ["value:non-empty"], source: "HeaderBlock.java:29", note: "REST requestedUser is UGI user of the caller; legacy uses servlet getRemoteUser(). Default unauthenticated RM shows dr.who (StaticUserWebFilter) [INFERENCE - verify live]"}
          - {id: legacy.rm.shared.chrome.header.logo, label: null, kind: text, field: static.header.logo, format: none, source: "HeaderBlock.java:35", note: "img /static/hadoop-st.png"}
          - {id: legacy.rm.shared.chrome.header.title, label: null, kind: title, field: static.header.title, dynamic: true, format: none, source: "HeaderBlock.java:37", note: "h1 = page TITLE; per-page titles recorded on each page entry"}
          - {id: legacy.rm.shared.chrome.jsnotice, label: "This page will not function without javascript enabled. Please enable javascript on your browser.", kind: text, field: static.chrome.jsnotice, format: none, source: "JQueryUI.java:94", note: "hidden by script when JS runs"}
      - id: legacy.rm.shared.chrome.nav
        title: "Cluster"
        source: "NavBlock.java:53"
        items:
          - {id: legacy.rm.shared.chrome.nav.cluster-heading, label: "Cluster", kind: nav, field: static.nav.cluster, format: none, source: "NavBlock.java:53"}
          - {id: legacy.rm.shared.chrome.nav.about, label: "About", kind: nav, field: static.nav.about, format: url, source: "NavBlock.java:55", note: "href /cluster/cluster"}
          - {id: legacy.rm.shared.chrome.nav.nodes, label: "Nodes", kind: nav, field: static.nav.nodes, format: url, source: "NavBlock.java:56", note: "href /cluster/nodes"}
