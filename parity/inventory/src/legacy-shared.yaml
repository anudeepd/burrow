          - {id: legacy.rm.shared.chrome.nav.state.submitted, label: "SUBMITTED", dynamic: true, kind: nav, field: static.nav.state.submitted, format: url, source: "NavBlock.java:64", note: "href /cluster/apps/SUBMITTED"}
          - {id: legacy.rm.shared.chrome.nav.state.accepted, label: "ACCEPTED", dynamic: true, kind: nav, field: static.nav.state.accepted, format: url, source: "NavBlock.java:64", note: "href /cluster/apps/ACCEPTED"}
          - {id: legacy.rm.shared.chrome.nav.state.running, label: "RUNNING", dynamic: true, kind: nav, field: static.nav.state.running, format: url, source: "NavBlock.java:64", note: "href /cluster/apps/RUNNING"}
          - {id: legacy.rm.shared.chrome.nav.state.finished, label: "FINISHED", dynamic: true, kind: nav, field: static.nav.state.finished, format: url, source: "NavBlock.java:64", note: "href /cluster/apps/FINISHED"}
