          - {id: legacy.rm.shared.chrome.nav.applications, label: "Applications", kind: nav, field: static.nav.applications, format: url, source: "NavBlock.java:59", note: "href /cluster/apps; followed by an empty <li> then one link per YarnApplicationState"}
          - {id: legacy.rm.shared.chrome.nav.state.new, label: "NEW", dynamic: true, kind: nav, field: static.nav.state.new, format: url, source: "NavBlock.java:64", note: "href /cluster/apps/NEW; YarnApplicationState.values() order"}
