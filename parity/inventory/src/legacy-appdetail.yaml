# Legacy RM UI — application detail pages:
#   /cluster/app/{app.id}          (RmController#app  -> AppPage  -> RMAppBlock  extends server-common AppBlock)
#   /cluster/appattempt/{attempt.id} (RmController#appattempt -> AppAttemptPage -> RMAppAttemptBlock extends server-common AppAttemptBlock)
#   /cluster/container/{container.id} (RmController#container -> ContainerPage -> RMContainerBlock extends server-common ContainerBlock)
# Sources (RM webapp pkg unless noted): AppPage/AppAttemptPage/ContainerPage, RMAppBlock/RMAppAttemptBlock/RMContainerBlock,
#   hadoop-yarn-server-common .../webapp/{AppBlock,AppAttemptBlock,ContainerBlock,WebPageUtils}.java,
#   hadoop-yarn-common .../webapp/view/InfoBlock.java, JQueryUI.java.
# NOTE on AppPage: RMAppBlock#createApplicationMetricsTable renders the InfoBlock for the accumulated overview rows early
#   (html.__(InfoBlock.class).div(_INFO_WRAP)), so the app page has TWO InfoBlock tables: "Application Overview" and
#   "Application Metrics" (RMAppBlock.java:95-117).
version: 1
derived:
  - {id: app.derived.resourceSecondsText, entity: app, type: string, format: none, from: [app.resourceSecondsMap, app.memorySeconds, app.vcoreSeconds], derivation: 'appMetrics == null ? "N/A" : StringHelper.getResourceSecondsString(appMetrics.getResourceSecondsMap()) => "<memorySeconds> MB-seconds, <vcoreSeconds> vcore-seconds" plus ", <value> <name>-<units>seconds" per custom resource', source: "RMAppBlock.java:108-111", note: "REST app.resourceSecondsMap is the same map; app.memorySeconds / app.vcoreSeconds are its memory/vcore entries"}
  - {id: app.derived.preemptedResourceSecondsText, entity: app, type: string, format: none, from: [app.preemptedResourceSecondsMap, app.preemptedMemorySeconds, app.preemptedVcoreSeconds], derivation: 'appMetrics == null ? "N/A" : StringHelper.getResourceSecondsString(appMetrics.getPreemptedResourceSecondsMap())', source: "RMAppBlock.java:113-115"}
  - {id: attempt.derived.resourcePreemptedText, entity: attempt, type: string, format: resource-string, from: [], derivation: "attemptMetrics == null ? Resources.none() : attemptMetrics.getResourcePreempted()  (Resource.toString)", source: "RMAppBlock.java:87-90", restGap: true, altSource: "none"}
  - {id: attempt.derived.numNonAMContainersPreempted, entity: attempt, type: int, format: int, from: [], derivation: "attemptMetrics == null ? 0 : attemptMetrics.getNumNonAMContainersPreempted()", source: "RMAppBlock.java:91-94", restGap: true, altSource: "none"}
  - {id: attempt.derived.appBlacklistedNodesCount, entity: attempt, type: int, format: int, from: [attempt.blacklistedNodes], derivation: "rmAppAttempt.getBlacklistedNodes().size()", source: "RMAppBlock.java:140-141", restGap: true, altSource: "count of ', '-separated ids in attempt.blacklistedNodes (rm.app.attempts)"}
  - {id: attempt.derived.rmBlacklistedNodesCount, entity: attempt, type: int, format: int, from: [attempt.nodesBlacklistedBySystem], derivation: "rmAppAttempt.getAMBlacklistManager().getBlacklistUpdates().getBlacklistAdditions().size()", source: "RMAppBlock.java:143-145", restGap: true, altSource: "count of ', '-separated ids in attempt.nodesBlacklistedBySystem (rm.app.attempts)"}
  - {id: attempt.derived.appBlacklistedNodesText, entity: attempt, type: string, format: join-comma, from: [attempt.blacklistedNodes], derivation: 'getNodeString(rmAppAttempt.getBlacklistedNodes()) => StringUtils.join(nodes, ", ") or "-" when null/empty', source: "RMAppAttemptBlock.java:515", restGap: true, altSource: "attempt.blacklistedNodes (rm.app.attempts, ', '-joined)"}
  - {id: attempt.derived.rmBlacklistedNodesText, entity: attempt, type: string, format: join-comma, from: [attempt.nodesBlacklistedBySystem], derivation: 'getNodeString(rmAppAttempt.getAMBlacklistManager().getBlacklistUpdates().getBlacklistAdditions()) => join ", " or "-"', source: "RMAppAttemptBlock.java:516", restGap: true, altSource: "attempt.nodesBlacklistedBySystem (rm.app.attempts)"}
  - {id: attempt.derived.elapsedText, entity: attempt, type: string, format: duration, from: [attempt.startedTime, attempt.finishedTime], derivation: "org.apache.hadoop.util.StringUtils.formatTime(Times.elapsed(appAttempt.getStartedTime(), appAttempt.getFinishedTime()))", source: "RMAppAttemptBlock.java:488-490"}
  - {id: attempt.derived.hostPortText, entity: attempt, type: string, format: none, from: [attempt.host, attempt.rpcPort], derivation: 'appAttempt.getHost() != null && appAttempt.getRpcPort() >= 0 && appAttempt.getRpcPort() < 65536 ? appAttempt.getHost() + ":" + appAttempt.getRpcPort() : "N/A"', source: "AppAttemptBlock.java:131-136"}
  - {id: attempt.derived.trackingUiText, entity: attempt, type: string, format: none, from: [attempt.trackingUrl, attempt.appAttemptState], derivation: 'trackingUrl null || "N/A" ? "Unassigned" : state in (FINISHED,FAILED,KILLED) ? "History" : "ApplicationMaster"', source: "RMAppAttemptBlock.java:499-511"}
  - {id: attempt.derived.hrefTracking, entity: attempt, type: string, format: url, from: [attempt.trackingUrl], derivation: 'trackingUrl == null || "N/A" ? null : root_url(trackingUrl)', source: "RMAppAttemptBlock.java:499-504"}
  - {id: attempt.derived.headroomText, entity: attempt, type: string, format: resource-string, from: [], derivation: 'metrics == null ? "N/A" : metrics.getApplicationAttemptHeadroom()', source: "RMAppAttemptBlock.java:446-447", restGap: true, altSource: "none"}
  - {id: attempt.derived.totalAllocatedContainersText, entity: attempt, type: string, format: none, from: [], derivation: '"Total Allocated Containers: " + attemptMetrics.getTotalAllocatedContainers()', source: "RMAppAttemptBlock.java:404-405", restGap: true, altSource: "none"}
  - {id: attempt.derived.localityStatistics, entity: attempt, type: string, format: other:N, from: [], derivation: "attemptMetrics.getLocalityStatistics()[i][j]  (rows i=0 NodeLocal,1 RackLocal,2 OffSwitch; cols j=0..2)", source: "RMAppAttemptBlock.java:417-421", restGap: true, altSource: "none"}
  - {id: attempt.derived.totalOutstandingResourceRequestsText, entity: attempt, type: string, format: resource-string, from: [app.resourceRequests], derivation: '"Total Outstanding Resource Requests: " + getTotalResource(resourceRequests)  (sum over requests with resourceName==ANY of capability * numContainers)', source: "RMAppAttemptBlock.java:311-312", restGap: true, altSource: "compute from app.resourceRequests[]"}
  - {id: container.derived.resourceText, entity: container, type: string, format: 'other:<n> Memory, <n> VCores[, <n> <name>]', from: [container.allocatedResources, container.allocatedMB, container.allocatedVCores], derivation: 'getResources(container) => allocatedResources["memory-mb"] + " Memory, " + allocatedResources["vcores"] + " VCores" plus ", <value> <name>" per custom resource', source: "ContainerBlock.java:137-159"}
pages:
  - id: legacy.rm.app
    daemon: rm
    route: /cluster/app/{app.id}
    title: "Application {app.id}"
    titleDynamic: true
    classes: [RmController#app, AppPage, RMAppBlock, AppBlock]
    includes: [legacy.rm.shared.chrome]
    sections:
      - id: legacy.rm.app.page
        title: null
        source: "AppPage.java:36-41"
        items:
          - {id: legacy.rm.app.page.title, label: "Application ", dynamic: true, kind: title, field: static.page.app.title, fields: [app.id], rest: {resource: rm.app, path: "app.id"}, derivation: 'appId.isEmpty() ? "Bad request: missing application ID" : join("Application ", appId)', format: none, source: "AppPage.java:36-42", note: "<title>/h1 = 'Application <id>'; AppBlock.render later re-sets join(\"Application \", aid) (AppBlock.java:138). Error branches: puts(\"Bad request: requires Application ID\") AppBlock.java:97, puts(\"Invalid Application ID: \" + aid) AppBlock.java:104, puts(\"Application not found: \" + aid) AppBlock.java:132"}
          - {id: legacy.rm.app.page.read-failed, label: "Failed to read the application ", dynamic: true, kind: text, field: static.error.appReadFailed, fields: [app.id], format: none, derivation: '"Failed to read the application " + appID + "."', when: ["other:getApplicationReport() throws"], source: "AppBlock.java:125-126", note: "p element; also LOG.error; shown instead of the page body"}
          - {id: legacy.rm.app.page.attempts-read-failed, label: "Failed to read the attempts of the application ", dynamic: true, kind: text, field: static.error.attemptsReadFailed, fields: [app.id], format: none, derivation: '"Failed to read the attempts of the application " + appID + "."', when: ["other:getApplicationAttemptsReport() throws"], source: "AppBlock.java:162-163", note: "p element"}
      - id: legacy.rm.app.actions
        title: null
        source: "AppBlock.java:174"
        items:
          - {id: legacy.rm.app.actions.kill, label: "Kill Application", kind: button, field: static.button.killApplication, format: none, when: ["conf:yarn.resourcemanager.webapp.ui-actions.enabled=true", "other:!Apps.isApplicationFinalState(app.state) && !(UserGroupInformation.isSecurityEnabled() && httpAuth is simple/pseudo)"], source: "AppBlock.java:182-204", note: "PUT /ws/v1/cluster/apps/{id}/state with {\"state\":\"KILLED\"} after a confirm(\"Are you sure?\") dialog; only for the RM web UI (WEB_UI_TYPE==rm)"}
      - id: legacy.rm.app.summary
        title: "Application Overview"
        source: "AppBlock.java:232"
        items:
          - {id: legacy.rm.app.summary.title, label: "Application Overview", kind: title, field: static.section.applicationOverview, format: none, source: "AppBlock.java:232", note: "InfoBlock th colspan=2 (ResponseInfo.about())"}
          - {id: legacy.rm.app.summary.user, label: "User:", kind: link, field: app.user, rest: {resource: rm.app, path: "app.user"}, derivation: "value is hyperlinked to schedulerPath = <rm-web-url>/cluster/scheduler?openQueues=<app.queue>", format: html-escaped, source: "AppBlock.java:233", note: "href /cluster/scheduler?openQueues={queue}"}
          - {id: legacy.rm.app.summary.name, label: "Name:", kind: kv, field: app.name, rest: {resource: rm.app, path: "app.name"}, format: html-escaped, source: "AppBlock.java:234"}
          - {id: legacy.rm.app.summary.type, label: "Application Type:", kind: kv, field: app.applicationType, rest: {resource: rm.app, path: "app.applicationType"}, format: html-escaped, source: "AppBlock.java:235"}
          - {id: legacy.rm.app.summary.tags, label: "Application Tags:", kind: kv, field: app.applicationTags, rest: {resource: rm.app, path: "app.applicationTags"}, format: html-escaped, nullDisplay: "", source: "AppBlock.java:236-237", note: "null => empty string"}
          - {id: legacy.rm.app.summary.priority, label: "Application Priority:", kind: kv, field: app.priority, rest: {resource: rm.app, path: "app.priority"}, derivation: 'app.getPriority() + " (Higher Integer value indicates higher priority)"', format: "other:{n} (Higher Integer value indicates higher priority)", normaliser: lead-int, source: "AppBlock.java:238", note: "clarifyAppPriority() appends the parenthetical"}
          - {id: legacy.rm.app.summary.state, label: "YarnApplicationState:", kind: kv, field: app.state, rest: {resource: rm.app, path: "app.state"}, derivation: 'state==null ? "N/A" : clarifyAppState(state) => "<STATE>: <explanation>" (NEW/NEW_SAVING/SUBMITTED/ACCEPTED/RUNNING only)', format: enum, nullDisplay: "N/A", normaliser: before-colon+enum-name, source: "AppBlock.java:239-242", note: "clarifyAppState() text; UNAVAILABLE == 'N/A'"}
          - {id: legacy.rm.app.summary.queue, label: "Queue:", kind: link, field: app.queue, rest: {resource: rm.app, path: "app.queue"}, derivation: "value hyperlinked to schedulerPath (/cluster/scheduler?openQueues={queue})", format: html-escaped, source: "AppBlock.java:243"}
          - {id: legacy.rm.app.summary.finalstatus, label: "FinalStatus Reported by AM:", kind: kv, field: app.finalStatus, rest: {resource: rm.app, path: "app.finalStatus"}, derivation: 'UNDEFINED => "Application has not completed yet." else status.toString()', format: enum, normaliser: final-status-text, source: "AppBlock.java:244-245", note: "clairfyAppFinalStatus()"}
          - {id: legacy.rm.app.summary.started, label: "Started:", kind: kv, field: app.startedTime, rest: {resource: rm.app, path: "app.startedTime"}, derivation: "Times.format(app.getStartedTime())", format: epoch-datetime, normaliser: epoch, source: "AppBlock.java:246", note: "Java DateTimeFormatter 'EEE MMM dd HH:mm:ss Z yyyy'"}
          - {id: legacy.rm.app.summary.launched, label: "Launched:", kind: kv, field: app.launchTime, rest: {resource: rm.app, path: "app.launchTime"}, derivation: "Times.format(app.getLaunchTime())", format: epoch-datetime, normaliser: epoch, source: "AppBlock.java:247"}
          - {id: legacy.rm.app.summary.finished, label: "Finished:", kind: kv, field: app.finishedTime, rest: {resource: rm.app, path: "app.finishedTime"}, derivation: "Times.format(app.getFinishedTime())", format: epoch-datetime, normaliser: epoch, source: "AppBlock.java:248"}
          - {id: legacy.rm.app.summary.elapsed, label: "Elapsed:", kind: kv, field: app.elapsedTime, rest: {resource: rm.app, path: "app.elapsedTime"}, derivation: "StringUtils.formatTime(app.getElapsedTime())", format: duration, normaliser: duration, source: "AppBlock.java:249", note: "app.elapsedTime is raw ms in REST; UI formats"}
          - {id: legacy.rm.app.summary.tracking, label: "Tracking URL:", kind: link, field: app.derived.trackingUiText, fields: [app.trackingUrl, app.state], rest: {resource: rm.app, path: "app.trackingUrl"}, derivation: 'trackingUrl null||"N/A" ? "Unassigned" : Apps.isApplicationFinalState(state) ? "History" : "ApplicationMaster"; href = app.getTrackingUrl() or null', format: none, source: "AppBlock.java:250-258", note: "reuses app.derived.trackingUiText / app.derived.hrefTracking declared in legacy-apps.yaml"}
          - {id: legacy.rm.app.summary.logagg, label: "Log Aggregation Status:", kind: link, field: app.logAggregationStatus, rest: {resource: rm.app, path: "app.logAggregationStatus"}, derivation: 'status==null ? "N/A" : (DISABLED|NOT_START|SUCCEEDED ? status.name() : hyperlink root_url("logaggregationstatus", appId) with text status.name())', format: enum, nullDisplay: "N/A", when: ["other:webUiType == rm"], source: "AppBlock.java:261-272", note: "href /cluster/logaggregationstatus/{appId}; only rendered for the RM web UI"}
          - {id: legacy.rm.app.summary.timeout, label: "Application Timeout (Remaining Time):", kind: kv, field: app.timeouts.timeout.remainingTimeInSeconds, rest: {resource: rm.app, path: "app.timeouts.timeout.remainingTimeInSeconds"}, derivation: 'LIFETIME timeout remainingTime < 0 ? "Unlimited" : String.format("%d seconds", timeout)', format: "other:%d seconds", nullDisplay: "Unlimited", when: ["value:-1", "other:webUiType == rm"], normaliser: lead-int, source: "AppBlock.java:273-279", note: "appReport.getApplicationTimeouts().get(ApplicationTimeoutType.LIFETIME); field path timeouts.timeout[].remainingTimeInSeconds"}
          - {id: legacy.rm.app.summary.diagnostics, label: "Diagnostics:", kind: kv, field: app.diagnostics, rest: {resource: rm.app, path: "app.diagnostics"}, format: html-escaped, nullDisplay: "", source: "AppBlock.java:281-282"}
          - {id: legacy.rm.app.summary.unmanaged, label: "Unmanaged Application:", kind: kv, field: app.unmanagedApplication, rest: {resource: rm.app, path: "app.unmanagedApplication"}, format: boolean, source: "AppBlock.java:283"}
          - {id: legacy.rm.app.summary.app-expression, label: "Application Node Label expression:", kind: kv, field: app.appNodeLabelExpression, rest: {resource: rm.app, path: "app.appNodeLabelExpression"}, format: html-escaped, nullDisplay: "<Not set>", source: "AppBlock.java:284-286", note: "lower-case 'expression' in the label (verbatim)"}
          - {id: legacy.rm.app.summary.am-expression, label: "AM container Node Label expression:", kind: kv, field: app.amNodeLabelExpression, rest: {resource: rm.app, path: "app.amNodeLabelExpression"}, format: html-escaped, nullDisplay: "<Not set>", normaliser: default-partition, source: "AppBlock.java:287-289"}
      - id: legacy.rm.app.metrics
        title: "Application Metrics"
        source: "RMAppBlock.java:97"
        items:
          - {id: legacy.rm.app.metrics.title, label: "Application Metrics", kind: title, field: static.section.applicationMetrics, format: none, source: "RMAppBlock.java:97", note: "RM-only InfoBlock; base AppBlock#createApplicationMetricsTable is a no-op"}
          - {id: legacy.rm.app.metrics.total-preempted, label: "Total Resource Preempted:", kind: kv, field: app.preemptedResourceMB, fields: [app.preemptedResourceMB, app.preemptedResourceVCores], rest: {resource: rm.app, path: "app.preemptedResourceMB"}, derivation: 'appMetrics == null ? "N/A" : appMetrics.getResourcePreempted()  (Resource.toString "<memory:MB, vCores:N>")', format: resource-string, nullDisplay: "N/A", normaliser: resource-mb, source: "RMAppBlock.java:98-99", note: "REST exposes preemptedResourceMB + preemptedResourceVCores separately"}
          - {id: legacy.rm.app.metrics.nonam-preempted, label: "Total Number of Non-AM Containers Preempted:", kind: kv, field: app.numNonAMContainerPreempted, rest: {resource: rm.app, path: "app.numNonAMContainerPreempted"}, format: int, nullDisplay: "N/A", source: "RMAppBlock.java:100-101"}
          - {id: legacy.rm.app.metrics.am-preempted, label: "Total Number of AM Containers Preempted:", kind: kv, field: app.numAMContainerPreempted, rest: {resource: rm.app, path: "app.numAMContainerPreempted"}, format: int, nullDisplay: "N/A", source: "RMAppBlock.java:102-103"}
          - {id: legacy.rm.app.metrics.attempt-resource-preempted, label: "Resource Preempted from Current Attempt:", kind: kv, field: attempt.derived.resourcePreemptedText, rest: null, derivation: "attemptMetrics == null ? Resources.none() : attemptMetrics.getResourcePreempted()", format: resource-string, source: "RMAppBlock.java:104-105", restGap: true, scenario: "app whose current AM attempt had resources preempted"}
          - {id: legacy.rm.app.metrics.attempt-nonam-preempted, label: "Number of Non-AM Containers Preempted from Current Attempt:", kind: kv, field: attempt.derived.numNonAMContainersPreempted, rest: null, derivation: "attemptMetrics == null ? 0 : attemptMetrics.getNumNonAMContainersPreempted()", format: int, source: "RMAppBlock.java:106-107", restGap: true}
          - {id: legacy.rm.app.metrics.aggregate-allocation, label: "Aggregate Resource Allocation:", kind: kv, field: app.derived.resourceSecondsText, fields: [app.resourceSecondsMap, app.memorySeconds, app.vcoreSeconds], rest: {resource: rm.app, path: "app.resourceSecondsMap"}, derivation: 'StringHelper.getResourceSecondsString(appMetrics.getResourceSecondsMap())', format: none, nullDisplay: "N/A", source: "RMAppBlock.java:108-111", scenario: "app with resource usage (appMetrics != null)"}
          - {id: legacy.rm.app.metrics.aggregate-preempted-allocation, label: "Aggregate Preempted Resource Allocation:", kind: kv, field: app.derived.preemptedResourceSecondsText, fields: [app.preemptedResourceSecondsMap, app.preemptedMemorySeconds, app.preemptedVcoreSeconds], rest: {resource: rm.app, path: "app.preemptedResourceSecondsMap"}, derivation: 'StringHelper.getResourceSecondsString(appMetrics.getPreemptedResourceSecondsMap())', format: none, nullDisplay: "N/A", source: "RMAppBlock.java:112-115"}
      - id: legacy.rm.app.attempts
        title: null
        source: "RMAppBlock.java:126"
        items:
          - {id: legacy.rm.app.attempts.attempt-id, label: "Attempt ID", kind: column, field: attempt.appAttemptId, rest: {resource: rm.app.attempts, path: "appAttempts.appAttempt[].appAttemptId"}, derivation: "cell = <a href=/cluster/appattempt/{appAttemptId}>{appAttemptId}</a>; natural sort desc on this column", format: url, source: "RMAppBlock.java:126", tooltip: null, note: "RMAppBlock overrides AppBlock#generateApplicationTable; href = url(\"appattempt\", id)"}
          - {id: legacy.rm.app.attempts.started, label: "Started", kind: column, field: attempt.startTime, rest: {resource: rm.app.attempts, path: "appAttempts.appAttempt[].startTime"}, derivation: "renderHadoopDate JS on raw epoch-ms", format: epoch-datetime, normaliser: epoch, nullDisplay: "N/A", source: "RMAppBlock.java:127", note: "data '0' or '-1' => N/A"}
          - {id: legacy.rm.app.attempts.node, label: "Node", kind: link, field: attempt.nodeHttpAddress, rest: {resource: rm.app.attempts, path: "appAttempts.appAttempt[].nodeHttpAddress"}, derivation: "href = httpSchemePrefix + nodeHttpAddress; text = nodeHttpAddress or N/A; '#' when null", format: url, nullDisplay: "N/A", normaliser: strip-scheme, source: "RMAppBlock.java:127", note: "RMAppBlock: nodeLink = attemptInfo.getNodeHttpAddress() prefixed with WebAppUtils.getHttpSchemePrefix(conf)"}
          - {id: legacy.rm.app.attempts.logs, label: "Logs", kind: link, field: attempt.logsLink, rest: {resource: rm.app.attempts, path: "appAttempts.appAttempt[].logsLink"}, derivation: "href = logsLink; text 'Logs' or 'N/A'; '#' when null", format: url, nullDisplay: "N/A", normaliser: url, source: "RMAppBlock.java:127"}
          - {id: legacy.rm.app.attempts.app-blacklisted, label: "Nodes blacklisted by the app", kind: column, field: attempt.derived.appBlacklistedNodesCount, rest: null, derivation: "rmAppAttempt.getBlacklistedNodes().size()", format: int, source: "RMAppBlock.java:128-129", tooltip: "Nodes blacklisted by the application", restGap: true, note: "th selector .appBlacklistednodes; REST attempt.blacklistedNodes is the ', '-joined list, not a count"}
          - {id: legacy.rm.app.attempts.rm-blacklisted, label: "Nodes blacklisted by the system", kind: column, field: attempt.derived.rmBlacklistedNodesCount, rest: null, derivation: "rmAppAttempt.getAMBlacklistManager().getBlacklistUpdates().getBlacklistAdditions().size()", format: int, source: "RMAppBlock.java:130-131", tooltip: "Nodes blacklisted by the RM for the app", restGap: true, note: "th selector .rmBlacklistednodes; label literal is 'Nodes blacklisted by the RM for the' + ' app', title is 'Nodes blacklisted by the system'"}
      - id: legacy.rm.app.attempts.datatable
        title: null
        source: "WebPageUtils.java:83"
        items:
          - {id: legacy.rm.app.attempts.datatable.length, label: "Show _MENU_ entries", kind: legend, field: static.datatable.length, format: none, source: "common-bin/webapps/static/dt-1.11.5/js/jquery.dataTables.min.js", note: "JQueryUI.tableInit defaults iDisplayLength:20, aLengthMenu:[20, 40, 60, 80, 100]"}
          - {id: legacy.rm.app.attempts.datatable.search, label: "Search:", kind: button, field: static.datatable.search, format: none, source: "common-bin/webapps/static/dt-1.11.5/js/jquery.dataTables.min.js"}
          - {id: legacy.rm.app.attempts.datatable.info, label: "Showing _START_ to _END_ of _TOTAL_ entries", kind: legend, field: static.datatable.info, format: none, source: "common-bin/webapps/static/dt-1.11.5/js/jquery.dataTables.min.js"}
          - {id: legacy.rm.app.attempts.datatable.info-empty, label: "Showing 0 to 0 of 0 entries", kind: legend, field: static.datatable.infoEmpty, format: none, source: "common-bin/webapps/static/dt-1.11.5/js/jquery.dataTables.min.js"}
          - {id: legacy.rm.app.attempts.datatable.info-filtered, label: "(filtered from _MAX_ total entries)", kind: legend, field: static.datatable.infoFiltered, format: none, source: "common-bin/webapps/static/dt-1.11.5/js/jquery.dataTables.min.js"}
          - {id: legacy.rm.app.attempts.datatable.empty, label: "No data available in table", kind: legend, field: static.datatable.empty, format: none, source: "common-bin/webapps/static/dt-1.11.5/js/jquery.dataTables.min.js"}
          - {id: legacy.rm.app.attempts.datatable.processing, label: "Processing...", kind: legend, field: static.datatable.processing, format: none, source: "WebPageUtils.java:83", note: "attemptsTableInit sets bProcessing:true, bDeferRender:true"}
          - {id: legacy.rm.app.attempts.datatable.pager, label: "First", kind: button, field: static.datatable.pager, format: none, source: "common-bin/webapps/static/dt-1.11.5/js/jquery.dataTables.min.js", note: "sPaginationType full_numbers: First / Previous / page numbers / Next / Last"}
  - id: legacy.rm.appattempt
    daemon: rm
    route: /cluster/appattempt/{attempt.id}
    title: "Application Attempt {attempt.id}"
    titleDynamic: true
    classes: [RmController#appattempt, AppAttemptPage, RMAppAttemptBlock, AppAttemptBlock]
    includes: [legacy.rm.shared.chrome]
    sections:
      - id: legacy.rm.appattempt.page
        title: null
        source: "AppAttemptPage.java:38"
        items:
          - {id: legacy.rm.appattempt.page.title, label: "Application Attempt ", dynamic: true, kind: title, field: static.page.attempt.title, fields: [attempt.appAttemptId], derivation: 'appAttemptId.isEmpty() ? "Bad request: missing application attempt ID" : join("Application Attempt ", appAttemptId)', format: none, source: "AppAttemptPage.java:38-43", note: "AppAttemptBlock.render re-sets join(\"Application Attempt \", attemptid) (AppAttemptBlock.java:133). Error branches: puts(\"Bad request: requires application attempt ID\") AppAttemptBlock.java:67, puts(\"Invalid application attempt ID: \" + attemptid) AppAttemptBlock.java:74, puts(\"Application Attempt not found: \" + attemptid) AppAttemptBlock.java:104"}
          - {id: legacy.rm.appattempt.page.containers-failed, label: "Sorry, Failed to get containers for application attempt", dynamic: true, kind: text, field: static.error.containersReadFailed, fields: [attempt.appAttemptId], format: none, derivation: '"Sorry, Failed to get containers for application attempt" + attemptid + "."', when: ["other:getContainers() throws"], source: "AppAttemptBlock.java:145-147", note: "p element; the attempts table is skipped"}
      - id: legacy.rm.appattempt.summary
        title: "Application Attempt Overview"
        source: "RMAppAttemptBlock.java:482"
