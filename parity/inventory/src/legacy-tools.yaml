          - {id: legacy.rm.tools.jmx.err-nosuchattr, label: "No attribute with name ", kind: text, dynamic: true, field: static.jmx.errNoAttr, format: none, source: "hadoop-common/org/apache/hadoop/jmx/JMXJsonServlet.java:308-309", note: '"No attribute with name " + attribute + " was found." -> status 404.'}
