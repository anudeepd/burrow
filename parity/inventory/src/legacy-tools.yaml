          - {id: legacy.rm.tools.jmx.bean-name, label: "name", kind: text, field: static.jmx.beanName, format: none, source: "hadoop-common/org/apache/hadoop/jmx/JMXJsonServlet.java:303", note: "ObjectName.toString()."}
