# Legacy RM "Tools" pages — raw servlets registered on the RM's HttpServer2 webapp (NOT Hamlet blocks, no NavBlock/HeaderBlock chrome).
# Sources relative to .cluster/src-extract/:
#   hadoop-common/org/apache/hadoop/conf/ConfServlet.java, jmx/JMXJsonServlet.java, log/LogLevel.java,
#   http/HttpServer2.java (servlet registration + StackServlet + AdminAuthorizedServlet), http/AdminAuthorizedServlet.java,
#   org/apache/hadoop/conf/Configuration.java (dumpConfiguration).
# The Tools nav entries (static.nav.tools.*) are declared in legacy-shared.yaml and are NOT redeclared here.
version: 1
pages:
  - id: legacy.rm.tools.conf
    daemon: rm
    route: /conf
    title: null
    classes: [ConfServlet]
    when: []
    sections:
      - id: legacy.rm.tools.conf.body
        title: null
        source: hadoop-common/org/apache/hadoop/conf/ConfServlet.java:59
        items:
          - {id: legacy.rm.tools.conf.raw, label: "(raw servlet response, no HTML chrome)", kind: text, field: static.conf.raw, format: none, source: "hadoop-common/org/apache/hadoop/conf/ConfServlet.java:59", note: "The page IS the serialized Configuration: XML by default, JSON when the request Accept header contains 'json'. No Hamlet layout, no nav."}
          - {id: legacy.rm.tools.conf.accept, label: "Accept: application/json", kind: text, field: static.conf.acceptHeader, format: none, source: "hadoop-common/org/apache/hadoop/conf/ConfServlet.java:86-89", note: "format switch is the Accept HEADER (parseAcceptHeader: format.contains(\"json\") ? json : xml). There is NO `format` query parameter in the source; /conf?format=json is ignored (live-verified)."}
          - {id: legacy.rm.tools.conf.content-type-xml, label: "text/xml; charset=utf-8", kind: text, field: static.conf.contentTypeXml, format: none, source: "hadoop-common/org/apache/hadoop/conf/ConfServlet.java:68"}
          - {id: legacy.rm.tools.conf.content-type-json, label: "application/json; charset=utf-8", kind: text, field: static.conf.contentTypeJson, format: none, source: "hadoop-common/org/apache/hadoop/conf/ConfServlet.java:70"}
          - {id: legacy.rm.tools.conf.param-name, label: "name", kind: text, field: static.conf.nameParam, format: none, source: "hadoop-common/org/apache/hadoop/conf/ConfServlet.java:73", note: "single-property query param; when set the body has exactly one entry."}
          - {id: legacy.rm.tools.conf.xml.property, label: "property", kind: text, field: static.conf.xmlProperty, format: none, source: "hadoop-common/org/apache/hadoop/conf/Configuration.java:3622", note: "XML element per configuration entry; a single `name` request collapses to one <property>."}
          - {id: legacy.rm.tools.conf.xml.name, label: "name", kind: text, field: static.conf.xmlName, format: none, source: "hadoop-common/org/apache/hadoop/conf/Configuration.java:3622"}
          - {id: legacy.rm.tools.conf.xml.value, label: "value", kind: text, field: static.conf.xmlValue, format: none, source: "hadoop-common/org/apache/hadoop/conf/Configuration.java:3622"}
          - {id: legacy.rm.tools.conf.xml.final, label: "final", kind: text, field: static.conf.xmlFinal, format: boolean, source: "hadoop-common/org/apache/hadoop/conf/Configuration.java:3622", note: "string 'true'/'false'."}
          - {id: legacy.rm.tools.conf.xml.source, label: "source", kind: text, field: static.conf.xmlSource, format: none, source: "hadoop-common/org/apache/hadoop/conf/Configuration.java:3622", note: "UNKNOWN_RESOURCE when no updating resource is recorded."}
          - {id: legacy.rm.tools.conf.json.properties, label: "properties", kind: text, field: static.conf.jsonProperties, format: none, source: "hadoop-common/org/apache/hadoop/conf/Configuration.java:3837", note: "top-level array (all-properties form)."}
          - {id: legacy.rm.tools.conf.json.property, label: "property", kind: text, field: static.conf.jsonProperty, format: none, source: "hadoop-common/org/apache/hadoop/conf/Configuration.java:3798", note: "top-level object (single-`name` form)."}
          - {id: legacy.rm.tools.conf.json.key, label: "key", kind: text, field: static.conf.jsonKey, format: none, source: "hadoop-common/org/apache/hadoop/conf/Configuration.java:3867"}
          - {id: legacy.rm.tools.conf.json.value, label: "value", kind: text, field: static.conf.jsonValue, format: none, source: "hadoop-common/org/apache/hadoop/conf/Configuration.java:3869", note: "redacted by ConfigRedactor for secret keys."}
          - {id: legacy.rm.tools.conf.json.isfinal, label: "isFinal", kind: text, field: static.conf.jsonIsFinal, format: boolean, source: "hadoop-common/org/apache/hadoop/conf/Configuration.java:3870"}
          - {id: legacy.rm.tools.conf.json.resource, label: "resource", kind: text, field: static.conf.jsonResource, format: none, source: "hadoop-common/org/apache/hadoop/conf/Configuration.java:3878"}
          - {id: legacy.rm.tools.conf.err-badformat, label: "Bad format: ", kind: text, field: static.conf.errBadFormat, format: none, source: "hadoop-common/org/apache/hadoop/conf/ConfServlet.java:104", note: "BadFormatException -> 400; unreachable via HTTP because format derives from Accept."}
          - {id: legacy.rm.tools.conf.err-notfound, label: "Property ", kind: text, dynamic: true, field: static.conf.errNotFound, format: none, source: "hadoop-common/org/apache/hadoop/conf/Configuration.java:3801", note: '"Property " + propertyName + " not found" -> IllegalArgumentException -> 404 (ConfServlet.java:80).'}
