          - {id: legacy.rm.logaggregationstatus.description.running, label: "RUNNING", kind: legend, field: static.logAggregationStatus.running, format: none, source: "RMAppLogAggregationStatusBlock.java:95-96", note: 'Description cell: "Log Aggregation is Running." (LogAggregationStatus.RUNNING)'}
          - {id: legacy.rm.logaggregationstatus.description.runningwithfailure, label: "RUNNING_WITH_FAILURE", kind: legend, field: static.logAggregationStatus.runningWithFailure, format: none, source: "RMAppLogAggregationStatusBlock.java:97-99", note: 'Description cell: "Log Aggregation is Running, but has failures in previous cycles" (LogAggregationStatus.RUNNING_WITH_FAILURE)'}
