# Legacy RM UI — Nodes page (/cluster/nodes, /cluster/nodes/{node.state}) and Node Labels page (/cluster/nodelabels).
# Sources (RM webapp pkg unless noted): RMWebApp.java (routes), RmController.java, RmView.java, NodesPage.java,
#   NodeLabelsPage.java, MetricsOverviewTable.java, NavBlock.java, dao/{NodeInfo,NodeLabelInfo,PartitionInfo,ResourceInfo,
#   ResourceInformationsInfo,ResourceUtilizationInfo,NodeAttributesInfo,NodeAttributeInfo,AllocationTagsInfo,AllocationTagInfo}.java,
#   hadoop-yarn-api .../api/records/NodeState.java, NodeLabel.java, hadoop-yarn-common .../nodelabels/RMNodeLabel.java,
#   hadoop-yarn-server-common .../webapp/WebPageUtils.java, hadoop-yarn-common static yarn.dt.plugins.js (renderHadoopDate), DataTables 1.11.5 defaults.
version: 1
derived:
  - {id: node.derived.allocationTagsSummary, entity: node, type: string, format: join-comma, from: ["node.allocationTags.allocationTagInfo.allocationTag", "node.allocationTags.allocationTagInfo.allocationsCount"], derivation: 'info.getAllocationTagsSummary() = allocationTags.toString() => comma-join of AllocationTagInfo.toString() = tag + "(" + count + ")" over AllocationTagsInfo.allocationTagInfo[]; "" when null/empty', source: "NodesPage.java:195", restGap: false, altSource: "node.allocationTags.allocationTagInfo[].allocationTag + allocationsCount (rm.nodes); live {} when no tags", note: "AllocationTagsInfo @XmlRootElement(name=allocationTagsInfo) serialises wrapped in native types via JAXBContextResolver as node.allocationTags = {\"allocationTagsInfo\":{\"allocationTagInfo\":[{allocationTag,allocationsCount}]}}"}
  - {id: node.derived.customResourceUsed, entity: node, type: long, format: int, from: [], derivation: 'info.getUsedResource().getResource().getResourceValue(resourceName) for each configured non-memory/vcores ResourceType (ResourceUtils.getResourceTypeIndex()); header = resourceName + " Used"', source: "NodesPage.java:239-242", restGap: false, altSource: "node.usedResource.resourceInformations.resourceInformation[].value (name-matched); only for the resource-type entries other than memory-mb/vcores"}
  - {id: node.derived.customResourceAvail, entity: node, type: long, format: int, from: [], derivation: 'info.getAvailableResource().getResource().getResourceValue(resourceName) for each configured non-memory/vcores ResourceType; header = resourceName + " Avail"', source: "NodesPage.java:243-249", restGap: false, altSource: "node.availableResource.resourceInformations.resourceInformation[].value (name-matched)"}
  - {id: nodelabel.derived.labelNameText, entity: nodelabel, type: string, format: none, from: [nodelabel.name], derivation: 'info.getLabelName().isEmpty() ? NodeLabel.DEFAULT_NODE_LABEL_PARTITION : info.getLabelName()  (DEFAULT_NODE_LABEL_PARTITION = "<DEFAULT_PARTITION>")', source: "NodeLabelsPage.java:61-63", restGap: false, altSource: "nodelabel.name (rm.node-labels); empty string denotes the default partition"}
  - {id: nodelabel.derived.labelTypeText, entity: nodelabel, type: string, format: none, from: [nodelabel.exclusivity], derivation: 'info.getIsExclusive() ? "Exclusive Partition" : "Non Exclusive Partition"', source: "NodeLabelsPage.java:64-66", restGap: false, altSource: "nodelabel.exclusivity (rm.node-labels), serialised as the STRING \"true\"/\"false\""}
  - {id: nodelabel.derived.totalResourceText, entity: nodelabel, type: string, format: resource-string, from: [nodelabel.partitionInfo.resourceAvailable.memory, nodelabel.partitionInfo.resourceAvailable.vCores], derivation: 'info.getResource().toFormattedString() => Resource.toString() = "<memory:" + StringUtils.byteDesc(MB*1024*1024) + ", vCores:" + cores + [", name: value+units" for nonzero custom resources] + ">" (RMNodeLabel.getResource())', source: "NodeLabelsPage.java:78", restGap: false, altSource: "REST /ws/v1/cluster/get-node-labels nodeLabelInfo[].partitionInfo.resourceAvailable (memory + vCores + resourceInformations)"}
pages:
  - id: legacy.rm.nodes
    daemon: rm
    route: "/cluster/nodes | /cluster/nodes/{node.state}"
    title: "Nodes of the cluster"
    titleDynamic: true
    query:
      - {name: node.state, doc: "route path param (RMWebApp.java:68 pajoin(\"/nodes\", NODE_STATE); YarnWebParams.NODE_STATE = \"node.state\"); a NodeState enum name, matched case-insensitively (NodesPage.java:128-129 NodeState.valueOf(StringUtils.toUpperCase(type))); filters the table and appends \" (<type>)\" to the title (NodesPage.java:272-276); empty => all active RM nodes except UNHEALTHY (NodesPage.java:153-162); DECOMMISSIONED|LOST|REBOOTED|SHUTDOWN read getInactiveRMNodes (NodesPage.java:131-144)"}
      - {name: node.label, doc: "request param (NodesPage.java:75 $(NODE_LABEL, CommonNodeLabelsManager.ANY).trim(); YarnWebParams.NODE_LABEL = \"node.label\"); CommonNodeLabelsManager.ANY = \"*\" disables label filtering; empty string shows only nodes with no label; otherwise only nodes whose nodeLabels contains that label (NodesPage.java:165-180). Targets of the Node Labels page active-NM links /cluster/nodes?node.label=<label>"}
    classes: [RmController#nodes, NodesPage, NodesBlock, MetricsOverviewTable, NavBlock, WebPageUtils]
    includes: [legacy.rm.shared.chrome, legacy.rm.shared.metrics]
    sections:
      - id: legacy.rm.nodes.page
        title: null
        source: "NodesPage.java:270"
        items:
          - {id: legacy.rm.nodes.page.title, label: "Nodes of the cluster", dynamic: true, kind: title, field: static.page.nodes.title, format: none, source: "NodesPage.java:272-276", note: "<title>/h1; title = \"Nodes of the cluster\" + (type != null && !type.isEmpty() ? \" (\" + type + \")\" : \"\") where type = $(node.state); preHead sets it (RmView.preHead's Applications title is overridden by NodesPage.preHead)"}
      - id: legacy.rm.nodes.states
        title: null
        source: "NodeState.java:29"
        items:
          - {id: legacy.rm.nodes.states.new, label: "NEW", kind: nav, field: static.node.state.new, format: url, source: "NodeState.java:31", note: "NodeState value accepted by /cluster/nodes/{node.state}; an active state (isActiveState). 3.4.3 NodesPage renders NO dedicated node-state tab bar - node-state navigation is only the Cluster Nodes Metrics links (legacy.rm.shared.metrics.nodes). These items record the accepted path values from the NodeState enum"}
          - {id: legacy.rm.nodes.states.running, label: "RUNNING", kind: nav, field: static.node.state.running, format: url, source: "NodeState.java:34", note: "NodeState value accepted by /cluster/nodes/{node.state}; active state"}
          - {id: legacy.rm.nodes.states.unhealthy, label: "UNHEALTHY", kind: nav, field: static.node.state.unhealthy, format: url, source: "NodeState.java:37", note: "NodeState value accepted by /cluster/nodes/{node.state}; active but unusable (isUnusable). Hidden from the unfiltered list (NodesPage.java:159-160)"}
          - {id: legacy.rm.nodes.states.decommissioned, label: "DECOMMISSIONED", kind: nav, field: static.node.state.decommissioned, format: url, source: "NodeState.java:40", note: "NodeState value accepted by /cluster/nodes/{node.state}; inactive (isInactiveState) - served from getInactiveRMNodes, Node HTTP Address shows N/A"}
          - {id: legacy.rm.nodes.states.lost, label: "LOST", kind: nav, field: static.node.state.lost, format: url, source: "NodeState.java:43", note: "NodeState value accepted by /cluster/nodes/{node.state}; inactive; metric link /cluster/nodes/lost (legacy.rm.shared.metrics.nodes.lost)"}
          - {id: legacy.rm.nodes.states.rebooted, label: "REBOOTED", kind: nav, field: static.node.state.rebooted, format: url, source: "NodeState.java:46", note: "NodeState value accepted by /cluster/nodes/{node.state}; inactive; metric link /cluster/nodes/rebooted"}
          - {id: legacy.rm.nodes.states.decommissioning, label: "DECOMMISSIONING", kind: nav, field: static.node.state.decommissioning, format: url, source: "NodeState.java:49", note: "NodeState value accepted by /cluster/nodes/{node.state}; active state; metric link /cluster/nodes/decommissioning"}
          - {id: legacy.rm.nodes.states.shutdown, label: "SHUTDOWN", kind: nav, field: static.node.state.shutdown, format: url, source: "NodeState.java:52", note: "NodeState value accepted by /cluster/nodes/{node.state}; inactive; metric link /cluster/nodes/shutdown"}
      - id: legacy.rm.nodes.table
        title: null
        source: "NodesPage.java:78"
        items:
          - {id: legacy.rm.nodes.table.node-labels, label: "Node Labels", kind: column, field: node.nodeLabels, rest: {resource: rm.nodes, path: "nodes.node[].nodeLabels"}, derivation: 'StringUtils.join(",", info.getNodeLabels())', format: join-comma, normaliser: join-comma, nullDisplay: "", source: "NodesPage.java:78", note: "column 0; ArrayList<String>, sorted (NodeInfo.java:64,178-183); comma-joined; empty when no labels"}
          - {id: legacy.rm.nodes.table.rack, label: "Rack", kind: column, field: node.rack, rest: {resource: rm.nodes, path: "nodes.node[].rack"}, format: none, source: "NodesPage.java:79"}
          - {id: legacy.rm.nodes.table.state, label: "Node State", kind: column, field: node.state, rest: {resource: rm.nodes, path: "nodes.node[].state"}, format: enum, source: "NodesPage.java:80", note: "NodeInfo.getState() = String.valueOf(ni.getState()) (NodeState enum name)"}
          - {id: legacy.rm.nodes.table.address, label: "Node Address", kind: column, field: node.id, rest: {resource: rm.nodes, path: "nodes.node[].id"}, format: none, source: "NodesPage.java:81", note: "NodeId.toString() = host:port (e.g. 127.0.0.3:8041)"}
          - {id: legacy.rm.nodes.table.http-address, label: "Node HTTP Address", kind: column, field: node.nodeHTTPAddress, rest: {resource: rm.nodes, path: "nodes.node[].nodeHTTPAddress"}, format: url, normaliser: none, nullDisplay: "N/A", when: ["other:isInactive (state in DECOMMISSIONED|LOST|REBOOTED|SHUTDOWN)"], source: "NodesPage.java:82", note: "active nodes render <a href='//host:port'>host:port</a> (the address is both text and href); inactive nodes render the literal N/A (NodesPage.java:182-188)"}
          - {id: legacy.rm.nodes.table.last-health-update, label: "Last health-update", kind: column, field: node.lastHealthUpdate, rest: {resource: rm.nodes, path: "nodes.node[].lastHealthUpdate"}, derivation: "Times.format(info.getLastHealthUpdate())", format: epoch-datetime, normaliser: epoch, tooltip: "raw lastHealthUpdate epoch ms (String.valueOf)", source: "NodesPage.java:83", note: "cell = <br title='<epoch ms>'>Times.format(epoch)</br>; same 'EEE MMM dd HH:mm:ss Z yyyy' formatter as app times; column 5 has sType title-numeric"}
          - {id: legacy.rm.nodes.table.health-report, label: "Health-report", kind: column, field: node.healthReport, rest: {resource: rm.nodes, path: "nodes.node[].healthReport"}, derivation: "StringEscapeUtils.escapeJava(info.getHealthReport())", format: "other:StringEscapeUtils.escapeJava", source: "NodesPage.java:84", note: "NodeInfo.healthReport = String.valueOf(ni.getHealthReport()) (null => \"null\"); the Java-escaped string is embedded into the JS array literal, then rendered HTML-decoded"}
          - {id: legacy.rm.nodes.table.containers, label: "Containers", kind: column, field: node.numContainers, rest: {resource: rm.nodes, path: "nodes.node[].numContainers"}, format: int, when: ["conf:yarn.resourcemanager.opportunistic-container-allocation.enabled=false"], source: "NodesPage.java:87", note: "header becomes 'Running Containers (G)' when opportunistic containers are enabled (NodesPage.java:96); column 7 is bSearchable:false"}
          - {id: legacy.rm.nodes.table.containers-g, label: "Running Containers (G)", kind: column, field: node.numContainers, rest: {resource: rm.nodes, path: "nodes.node[].numContainers"}, format: int, when: ["conf:yarn.resourcemanager.opportunistic-container-allocation.enabled=true"], source: "NodesPage.java:96", note: "guaranteed running containers; same value as the 'Containers' column"}
          - {id: legacy.rm.nodes.table.allocation-tags, label: "Allocation Tags", kind: column, field: node.derived.allocationTagsSummary, fields: ["node.allocationTags.allocationTagInfo.allocationTag", "node.allocationTags.allocationTagInfo.allocationsCount"], rest: {resource: rm.nodes, path: "nodes.node[].allocationTags"}, derivation: 'info.getAllocationTagsSummary() = comma-join of tag + "(" + count + ")"', format: join-comma, source: "NodesPage.java:88", note: "empty string when no allocation tags (NodeInfo.getAllocationTagsSummary returns \"\" for null)"}
          - {id: legacy.rm.nodes.table.mem-used, label: "Mem Used", kind: column, field: node.usedMemoryMB, rest: {resource: rm.nodes, path: "nodes.node[].usedMemoryMB"}, derivation: "StringUtils.byteDesc(usedMemory * BYTES_IN_MB)", format: byteDesc, normaliser: bytes-desc, tooltip: "raw usedMemoryMB (MB, String.valueOf)", when: ["conf:yarn.resourcemanager.opportunistic-container-allocation.enabled=false"], source: "NodesPage.java:89", note: "cell = <br title='<MB>'>byteDesc(MB*1024*1024)</br>; header becomes 'Mem Used (G)' when opportunistic enabled; column 9/10 are sType title-numeric, bSearchable:false"}
          - {id: legacy.rm.nodes.table.mem-used-g, label: "Mem Used (G)", kind: column, field: node.usedMemoryMB, rest: {resource: rm.nodes, path: "nodes.node[].usedMemoryMB"}, format: byteDesc, normaliser: bytes-desc, when: ["conf:yarn.resourcemanager.opportunistic-container-allocation.enabled=true"], source: "NodesPage.java:98"}
          - {id: legacy.rm.nodes.table.mem-avail, label: "Mem Avail", kind: column, field: node.availMemoryMB, rest: {resource: rm.nodes, path: "nodes.node[].availMemoryMB"}, derivation: "StringUtils.byteDesc(availableMemory * BYTES_IN_MB)", format: byteDesc, normaliser: bytes-desc, tooltip: "raw availMemoryMB (MB, String.valueOf)", when: ["conf:yarn.resourcemanager.opportunistic-container-allocation.enabled=false"], source: "NodesPage.java:90", note: "header becomes 'Mem Avail (G)' when opportunistic enabled"}
          - {id: legacy.rm.nodes.table.mem-avail-g, label: "Mem Avail (G)", kind: column, field: node.availMemoryMB, rest: {resource: rm.nodes, path: "nodes.node[].availMemoryMB"}, format: byteDesc, normaliser: bytes-desc, when: ["conf:yarn.resourcemanager.opportunistic-container-allocation.enabled=true"], source: "NodesPage.java:99"}
          - {id: legacy.rm.nodes.table.phys-mem-used, label: "Phys Mem Used %", kind: column, field: node.memUtilization, rest: {resource: rm.nodes, path: "nodes.node[].memUtilization"}, derivation: "String.valueOf((int) info.getMemUtilization())", format: int, normaliser: int, source: "NodesPage.java:91", note: "memUtilization is a float 0..100 (live 50.625206); the cell truncates to int with no % sign"}
          - {id: legacy.rm.nodes.table.vcores-used, label: "VCores Used", kind: column, field: node.usedVirtualCores, rest: {resource: rm.nodes, path: "nodes.node[].usedVirtualCores"}, format: int, when: ["conf:yarn.resourcemanager.opportunistic-container-allocation.enabled=false"], source: "NodesPage.java:92", note: "header becomes 'VCores Used (G)' when opportunistic enabled"}
          - {id: legacy.rm.nodes.table.vcores-used-g, label: "VCores Used (G)", kind: column, field: node.usedVirtualCores, rest: {resource: rm.nodes, path: "nodes.node[].usedVirtualCores"}, format: int, when: ["conf:yarn.resourcemanager.opportunistic-container-allocation.enabled=true"], source: "NodesPage.java:101"}
          - {id: legacy.rm.nodes.table.vcores-avail, label: "VCores Avail", kind: column, field: node.availableVirtualCores, rest: {resource: rm.nodes, path: "nodes.node[].availableVirtualCores"}, format: int, when: ["conf:yarn.resourcemanager.opportunistic-container-allocation.enabled=false"], source: "NodesPage.java:93", note: "header becomes 'VCores Avail (G)' when opportunistic enabled"}
          - {id: legacy.rm.nodes.table.vcores-avail-g, label: "VCores Avail (G)", kind: column, field: node.availableVirtualCores, rest: {resource: rm.nodes, path: "nodes.node[].availableVirtualCores"}, format: int, when: ["conf:yarn.resourcemanager.opportunistic-container-allocation.enabled=true"], source: "NodesPage.java:102"}
          - {id: legacy.rm.nodes.table.phys-vcores-used, label: "Phys VCores Used %", kind: column, field: node.cpuUtilization, rest: {resource: rm.nodes, path: "nodes.node[].cpuUtilization"}, derivation: "String.valueOf((int) info.getVcoreUtilization())", format: int, normaliser: int, source: "NodesPage.java:94", note: "NodeInfo.getVcoreUtilization() returns the cpuUtilization field (0..100 float, live 21.39); cell truncates to int, no % sign"}
          - {id: legacy.rm.nodes.table.opp-running, label: "Running Containers (O)", kind: column, field: node.numRunningOpportContainers, rest: {resource: rm.nodes, path: "nodes.node[].numRunningOpportContainers"}, format: int, when: ["conf:yarn.resourcemanager.opportunistic-container-allocation.enabled=true"], source: "NodesPage.java:104"}
          - {id: legacy.rm.nodes.table.opp-mem-used, label: "Mem Used (O)", kind: column, field: node.usedMemoryOpportGB, rest: {resource: rm.nodes, path: "nodes.node[].usedMemoryOpportGB"}, derivation: "StringUtils.byteDesc(info.getUsedMemoryOpportGB() * BYTES_IN_GB)", format: byteDesc, normaliser: bytes-desc, tooltip: "raw usedMemoryOpportGB (GB, String.valueOf)", when: ["conf:yarn.resourcemanager.opportunistic-container-allocation.enabled=true"], source: "NodesPage.java:105", note: "cell = <br title='<GB>'>byteDesc(GB*1024*1024*1024)</br>"}
          - {id: legacy.rm.nodes.table.opp-vcores-used, label: "VCores Used (O)", kind: column, field: node.usedVirtualCoresOpport, rest: {resource: rm.nodes, path: "nodes.node[].usedVirtualCoresOpport"}, format: int, when: ["conf:yarn.resourcemanager.opportunistic-container-allocation.enabled=true"], source: "NodesPage.java:106"}
          - {id: legacy.rm.nodes.table.opp-queued, label: "Queued Containers", kind: column, field: node.numQueuedContainers, rest: {resource: rm.nodes, path: "nodes.node[].numQueuedContainers"}, format: int, when: ["conf:yarn.resourcemanager.opportunistic-container-allocation.enabled=true"], source: "NodesPage.java:107"}
          - {id: legacy.rm.nodes.table.custom-used, label: "{resourceType} Used", dynamic: true, kind: column, field: node.derived.customResourceUsed, rest: null, derivation: 'header = integerEntry.getKey() + " " + "Used" for each ResourceUtils.getResourceTypeIndex() entry except memory-mb/vcores; value = info.getUsedResource().getResource().getResourceValue(resourceName)', format: int, normaliser: none, when: ["other:a non-memory/vcores resource type is configured (ResourceUtils.getResourceTypeIndex beyond memory-mb/vcores)"], scenario: "at least one custom resource type declared via yarn.resource-types (e.g. yarn.io/gpu), then one 'Used'/'Avail' column pair per type", source: "NodesPage.java:108-123", note: "one column pair emitted per configured custom resource type; header embeds the raw resource-type name (e.g. 'yarn.io/gpu Used'); data cell NodePage.java:246-250"}
          - {id: legacy.rm.nodes.table.custom-avail, label: "{resourceType} Avail", dynamic: true, kind: column, field: node.derived.customResourceAvail, rest: null, derivation: 'header = integerEntry.getKey() + " " + "Avail"; value = info.getAvailableResource().getResource().getResourceValue(resourceName)', format: int, normaliser: none, when: ["other:a non-memory/vcores resource type is configured"], scenario: "at least one custom resource type configured", source: "NodesPage.java:117-123", note: "second column of each custom-resource pair; data cell NodesPage.java:246-250"}
          - {id: legacy.rm.nodes.table.version, label: "Version", kind: column, field: node.version, rest: {resource: rm.nodes, path: "nodes.node[].version"}, format: none, source: "NodesPage.java:125", note: "page reads ni.getNodeManagerVersion() directly (NodesPage.java:254); NodeInfo.getVersion() returns the same value (NodeInfo.java:51)"}
      - id: legacy.rm.nodes.datatable
        title: null
        source: "JQueryUI.java:205"
        items:
          - {id: legacy.rm.nodes.datatable.length, label: "Show _MENU_ entries", kind: legend, field: static.datatable.length, format: none, source: "common-bin/webapps/static/dt-1.11.5/js/jquery.dataTables.min.js", note: "DataTables default; NodesPage.nodesTableInit() = tableInit().append(...) so iDisplayLength:20, aLengthMenu:[20, 40, 60, 80, 100] (NodesPage.java:288-295)"}
          - {id: legacy.rm.nodes.datatable.search, label: "Search:", kind: button, field: static.datatable.search, format: none, source: "common-bin/webapps/static/dt-1.11.5/js/jquery.dataTables.min.js", note: "free-text filter; aoColumnDefs disables search on column 7 (Containers) and 9/10 (Mem Used/Avail): bSearchable false (NodesPage.java:289-295)"}
          - {id: legacy.rm.nodes.datatable.info, label: "Showing _START_ to _END_ of _TOTAL_ entries", kind: legend, field: static.datatable.info, format: none, source: "common-bin/webapps/static/dt-1.11.5/js/jquery.dataTables.min.js"}
          - {id: legacy.rm.nodes.datatable.info-empty, label: "Showing 0 to 0 of 0 entries", kind: legend, field: static.datatable.infoEmpty, format: none, source: "common-bin/webapps/static/dt-1.11.5/js/jquery.dataTables.min.js"}
          - {id: legacy.rm.nodes.datatable.info-filtered, label: "(filtered from _MAX_ total entries)", kind: legend, field: static.datatable.infoFiltered, format: none, source: "common-bin/webapps/static/dt-1.11.5/js/jquery.dataTables.min.js"}
          - {id: legacy.rm.nodes.datatable.empty, label: "No data available in table", kind: legend, field: static.datatable.empty, format: none, source: "common-bin/webapps/static/dt-1.11.5/js/jquery.dataTables.min.js"}
          - {id: legacy.rm.nodes.datatable.processing, label: "Processing...", kind: legend, field: static.datatable.processing, format: none, source: "common-bin/webapps/static/dt-1.11.5/js/jquery.dataTables.min.js", note: "bProcessing:true, bDeferRender:true (NodesPage.java:289-291)"}
          - {id: legacy.rm.nodes.datatable.pager, label: "First", kind: button, field: static.datatable.pager, format: none, source: "common-bin/webapps/static/dt-1.11.5/js/jquery.dataTables.min.js", note: "sPaginationType full_numbers: First / Previous / page numbers / Next / Last; bStateSave:true persists column search via sessionStorage (JQueryUI.tableInit)"}
          - {id: legacy.rm.nodes.datatable.init, label: null, kind: text, field: static.datatable.initOptions, format: none, source: "NodesPage.java:288-295", note: "client init: tableInit() + aaData:nodeTableData, bDeferRender:true, bProcessing:true, aoColumnDefs: [{bSearchable:false,aTargets:[7]}, {sType:'title-numeric',bSearchable:false,aTargets:[9,10]}, {sType:'title-numeric',aTargets:[5]}] (column 5 Last health-update sorts on the <br title> epoch ms)"}
  - id: legacy.rm.nodelabels
    daemon: rm
    route: /cluster/nodelabels
    title: "Node labels of the cluster"
    classes: [RmController#nodelabels, NodeLabelsPage, NodeLabelsBlock, NavBlock]
    includes: [legacy.rm.shared.chrome]
    sections:
      - id: legacy.rm.nodelabels.page
        title: null
        source: "NodeLabelsPage.java:86"
        items:
          - {id: legacy.rm.nodelabels.page.title, label: "Node labels of the cluster", kind: title, field: static.page.nodelabels.title, format: none, source: "NodeLabelsPage.java:86-87", note: "<title>/h1 set via setTitle(title) in preHead"}
      - id: legacy.rm.nodelabels.table
        title: null
        source: "NodeLabelsPage.java:49"
        items:
          - {id: legacy.rm.nodelabels.table.label-name, label: "Label Name", kind: column, field: nodelabel.derived.labelNameText, fields: [nodelabel.name], rest: {resource: rm.node-labels, path: "nodeLabelInfo[].name"}, derivation: 'info.getLabelName().isEmpty() ? NodeLabel.DEFAULT_NODE_LABEL_PARTITION : info.getLabelName()', format: none, normaliser: none, nullDisplay: "<DEFAULT_PARTITION>", source: "NodeLabelsPage.java:49", note: "the default partition (empty label name) is shown as <DEFAULT_PARTITION>; rows come from RMNodeLabelsManager.pullRMNodeLabelsInfo() (RMNodeLabel)"}
