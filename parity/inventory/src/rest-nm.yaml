resources:
- id: nm.info.root
  daemon: nm
  method: GET
  path: /ws/v1/node
  contractPath: null
  allowlist: false
  readOnly: true
  params: []
  produces: &id001
  - application/json; charset=utf-8
  - application/xml; charset=utf-8
  response:
    object: NmNodeInfo
    jsonRoot: nodeInfo
    shape: '{"nodeInfo":{…}}'
    contentType: application/json
  errors: []
  when: []
  acl: ''
  source: hadoop-yarn-server-nodemanager/org/apache/hadoop/yarn/server/nodemanager/webapp/NMWebServices.java:148
  note: 'Same body as /ws/v1/node/info. NM JSON = Jersey 1 JSONJAXBContext natural notation, rootUnwrapping(false) (nm:JAXBContextResolver.java:59): the @XmlRootElement name wraps the body; JAXB FIELD access => JSON key = Java field name; list fields are always arrays. [INFERENCE] an empty list is serialised as null/{} (RM shows {"apps":null}) - verify on live NM.'
- id: nm.info
  daemon: nm
  method: GET
  path: /ws/v1/node/info
  contractPath: info
  allowlist: true
  readOnly: true
  params: []
  produces: *id001
  response:
    object: NmNodeInfo
    jsonRoot: nodeInfo
    shape: '{"nodeInfo":{"healthReport":"","totalVmemAllocatedContainersMB":17203,…,"nmStartupTime":1485800887841}}'
    contentType: application/json
  errors: []
  when: []
  acl: ''
  source: hadoop-yarn-server-nodemanager/org/apache/hadoop/yarn/server/nodemanager/webapp/NMWebServices.java:155
  note: 'NM JSON = Jersey 1 JSONJAXBContext natural notation, rootUnwrapping(false) (nm:JAXBContextResolver.java:59): the @XmlRootElement name wraps the body; JAXB FIELD access => JSON key = Java field name; list fields are always arrays. [INFERENCE] an empty list is serialised as null/{} (RM shows {"apps":null}) - verify on live NM.'
- id: nm.apps
  daemon: nm
  method: GET
  path: /ws/v1/node/apps
  contractPath: apps
  allowlist: true
  readOnly: true
  params:
  - name: state
    in: query
    type: string
    required: false
    values: []
    doc: ApplicationState name (case-insensitive compare); invalid value => IllegalArgumentException => 400
    source: hadoop-yarn-server-nodemanager/org/apache/hadoop/yarn/server/nodemanager/webapp/NMWebServices.java:169
  - name: user
    in: query
    type: string
    required: false
    values: []
    doc: 'exact user; present-but-empty => 400 ''Error: You must specify a non-empty string for the user'''
    source: hadoop-yarn-server-nodemanager/org/apache/hadoop/yarn/server/nodemanager/webapp/NMWebServices.java:170
  produces: *id001
  response:
    object: NmAppsInfo
    jsonRoot: apps
    shape: '{"apps":{"app":[{"id","state","user","containerids":[…]}]}}'
    contentType: application/json
  errors:
  - &id002
    status: 400
    when: invalid id / bad param
    body: RemoteException
  when: []
  acl: when yarn.webapp.filter-entity-list-by-user=true, apps the caller cannot VIEW_APP are dropped (NMWebServices.java:195-198)
  source: hadoop-yarn-server-nodemanager/org/apache/hadoop/yarn/server/nodemanager/webapp/NMWebServices.java:164
  note: 'NM JSON = Jersey 1 JSONJAXBContext natural notation, rootUnwrapping(false) (nm:JAXBContextResolver.java:59): the @XmlRootElement name wraps the body; JAXB FIELD access => JSON key = Java field name; list fields are always arrays. [INFERENCE] an empty list is serialised as null/{} (RM shows {"apps":null}) - verify on live NM.'
- id: nm.app
  daemon: nm
  method: GET
  path: /ws/v1/node/apps/{appid}
  contractPath: apps/{id}
  allowlist: true
  readOnly: true
  params:
  - name: appid
    in: path
    type: string
    required: true
    values: []
    doc: ''
    source: hadoop-yarn-server-nodemanager/org/apache/hadoop/yarn/server/nodemanager/webapp/NMWebServices.java:209
  produces: *id001
  response:
    object: NmAppInfo
    jsonRoot: app
    shape: '{"app":{"id","state","user","containerids":[…]}}'
    contentType: application/json
  errors:
  - *id002
  - status: 404
    when: app not in NM context ('app with id X not found')
    body: RemoteException
  when: []
  acl: ''
  source: hadoop-yarn-server-nodemanager/org/apache/hadoop/yarn/server/nodemanager/webapp/NMWebServices.java:205
  note: No ACL check on a single app (unlike the list).
- id: nm.containers
  daemon: nm
  method: GET
  path: /ws/v1/node/containers
  contractPath: containers
  allowlist: true
  readOnly: true
  params: []
  produces: *id001
  response:
    object: NmContainersInfo
    jsonRoot: containers
    shape: '{"containers":{"container":[{…NmContainerInfo…}]}}'
    contentType: application/json
  errors: []
  when: []
  acl: same filter-entity-list-by-user filtering as apps; hsr.getRemoteUser() decides containerLogFiles visibility
  source: hadoop-yarn-server-nodemanager/org/apache/hadoop/yarn/server/nodemanager/webapp/NMWebServices.java:220
  note: ContainerInfo is built BEFORE the ACL filter, so log dirs are listed even for hidden entries (cost only).
- id: nm.container
  daemon: nm
  method: GET
  path: /ws/v1/node/containers/{containerid}
  contractPath: containers/{containerId}
  allowlist: true
  readOnly: true
  params:
  - name: containerid
    in: path
    type: string
    required: true
    values: []
    doc: ''
    source: hadoop-yarn-server-nodemanager/org/apache/hadoop/yarn/server/nodemanager/webapp/NMWebServices.java:256
  produces: *id001
  response:
    object: NmContainerInfo
    jsonRoot: container
    shape: '{"container":{…}}'
    contentType: application/json
  errors:
  - status: 400
    when: invalid container id
    body: RemoteException
  - status: 404
    when: container not in NM context
    body: RemoteException
  when: []
  acl: ''
  source: hadoop-yarn-server-nodemanager/org/apache/hadoop/yarn/server/nodemanager/webapp/NMWebServices.java:251
  note: ''
- id: nm.container.logs
  daemon: nm
  method: GET
  path: /ws/v1/node/containers/{containerid}/logs
  contractPath: null
  allowlist: false
  readOnly: true
  params:
  - name: containerid
    in: path
    type: string
    required: true
    values: []
    doc: ''
    source: hadoop-yarn-server-nodemanager/org/apache/hadoop/yarn/server/nodemanager/webapp/NMWebServices.java:293
  produces: *id001
  response:
    object: NmContainerLogsInfo
    jsonRoot: null
    shape: '[ {"containerLogInfo":[{"fileName","fileSize","lastModifiedTime"}],"logAggregationType":"LOCAL","containerId","nodeId"}, {…"logAggregationType":"AGGREGATED"…}* ]'
    contentType: application/json
  errors:
  - status: 400
    when: invalid container id
    body: RemoteException
  - status: 307
    when: 'local listing fails AND yarn.log.server.web-service.url set: Location=<url>/containers/<id>/logs?<query minus nm.id>&redirected_from_node=true'
    body: null
  when: []
  acl: 'NM view ACL via ContainerLogsUtils.checkAccess (VIEW_APP) for the local part; header X-Content-Type-Options: nosniff'
  source: hadoop-yarn-server-nodemanager/org/apache/hadoop/yarn/server/nodemanager/webapp/NMWebServices.java:286
  note: 'Body is a JSON ARRAY (List<ContainerLogsInfo> via GenericEntity): first element LOCAL, then one AGGREGATED element per ContainerLogMeta found in remote FS (only if aggregation exists). Key names come from LogContainerLogsInfo (@XmlElement renames). [INFERENCE] NM/JHS serialise through Jersey''s default JSON list provider (not Jackson); with one log file ''containerLogInfo'' may collapse to an object in ''mapped'' notation - verify on live NM. AHS (Jackson) always emits arrays.'
- id: nm.container.logs.file
  daemon: nm
  method: GET
  path: /ws/v1/node/containers/{containerid}/logs/{filename}
  contractPath: null
  allowlist: false
  readOnly: true
  params:
  - name: containerid
    in: path
    type: string
    required: true
    values: []
    doc: ''
    source: hadoop-yarn-server-nodemanager/org/apache/hadoop/yarn/server/nodemanager/webapp/NMWebServices.java:376
  - name: filename
    in: path
    type: string
    required: true
    values: []
    doc: ''
    source: hadoop-yarn-server-nodemanager/org/apache/hadoop/yarn/server/nodemanager/webapp/NMWebServices.java:378
  - name: format
    in: query
    type: string
    required: false
    values:
    - text
    - octet-stream
    doc: 'case-insensitive; default Content-Type text/plain; anything else => 400 ''The valid values for the parameter : format are [text, octet-stream]'''
    source: hadoop-yarn-server-nodemanager/org/apache/hadoop/yarn/server/nodemanager/webapp/NMWebServices.java:380
  - name: size
    in: query
    type: string
    required: false
    values: []
    doc: long bytes; long bytes; n>=0 => first n bytes, n<0 => last |n| bytes (yc:logaggregation/LogToolUtils.java:88-107); absent/empty = Long.MAX_VALUE (whole file)
    source: hadoop-yarn-server-nodemanager/org/apache/hadoop/yarn/server/nodemanager/webapp/NMWebServices.java:382
  produces:
  - text/plain; charset=utf-8
  response:
    object: null
    jsonRoot: null
    shape: 'text/plain: LogToolUtils header (see nm.containerlogs) + file bytes + ''End of LogType:<file>.'' trailer'
    contentType: text/plain; charset=utf-8
  errors: []
  when: []
  acl: ''
  source: hadoop-yarn-server-nodemanager/org/apache/hadoop/yarn/server/nodemanager/webapp/NMWebServices.java:370
  note: Delegates to getLogs() - identical to nm.containerlogs; both URLs exist.
- id: nm.containerlogs
  daemon: nm
  method: GET
  path: /ws/v1/node/containerlogs/{containerid}/{filename}
  contractPath: null
  allowlist: false
  readOnly: true
  params:
  - name: containerid
    in: path
    type: string
    required: true
    values: []
    doc: ''
    source: hadoop-yarn-server-nodemanager/org/apache/hadoop/yarn/server/nodemanager/webapp/NMWebServices.java:411
  - name: filename
    in: path
    type: string
    required: true
    values: []
    doc: ''
    source: hadoop-yarn-server-nodemanager/org/apache/hadoop/yarn/server/nodemanager/webapp/NMWebServices.java:413
  - name: format
    in: query
    type: string
    required: false
    values:
    - text
    - octet-stream
    doc: see nm.container.logs.file
    source: hadoop-yarn-server-nodemanager/org/apache/hadoop/yarn/server/nodemanager/webapp/NMWebServices.java:415
  - name: size
    in: query
    type: string
    required: false
    values: []
    doc: 'parseLongParam: empty => Long.MAX_VALUE; otherwise Long.parseLong (NumberFormatException => 503 via GenericExceptionHandler); n<0 => last |n| bytes, n>=0 => first n bytes'
    source: hadoop-yarn-server-nodemanager/org/apache/hadoop/yarn/server/nodemanager/webapp/NMWebServices.java:417
  produces:
  - text/plain; charset=utf-8
  response:
    object: null
    jsonRoot: null
    shape: 'text/plain body = LogToolUtils header ''<Container: id on nodeId>\nLogAggregationType: LOCAL\n====\nLogType:<file>\nLogLastModifiedTime:<Times.format>\nLogLength:<n>\nLogContents:\n'' (yc:logaggregation/LogToolUtils.java:58-70) + raw bytes + ''\nEnd of LogType:<file>.'' + (''This log file belongs to a running container (<id>) and so may not be complete.'' if RUNNING) + ''\n'' + ''*''*(len+50) + ''\n\n'', then the same file from aggregated logs if present'
    contentType: text/plain; charset=utf-8
  errors:
  - status: 400
    when: invalid container id (empty body)
    body: null
  - status: 404
    when: NotFoundException from ContainerLogsUtils (unknown/not-yet-running container, 'Cannot find this log on the local disk.') and no yarn.log.server.web-service.url
    body: null
  - status: 307
    when: 'NotFound AND yarn.log.server.web-service.url set: redirect to <url>/containers/<id>/logs/<filename>?<query minus nm.id>&redirected_from_node=true'
    body: null
  - status: 500
    when: YarnException (not authorised) / IOException opening file (e.g. file owner mismatch)
    body: null
  when: []
  acl: VIEW_APP on the application (ContainerLogsUtils.checkAccess); SecureIOUtils.openForRead verifies file owner == app user
  source: hadoop-yarn-server-nodemanager/org/apache/hadoop/yarn/server/nodemanager/webapp/NMWebServices.java:405
  note: The `size`/`format` params are the ONLY ones implemented here (no start/end/download). 'Public/Unstable' API.
- id: nm.resources
  daemon: nm
  method: GET
  path: /ws/v1/node/resources/{resourcename}
  contractPath: null
  allowlist: false
  readOnly: true
  params:
