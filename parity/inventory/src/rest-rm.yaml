    contentType: application/json; charset=utf-8
  errors: []
  when: []
  acl: ''
  source: hadoop-yarn-server-resourcemanager/org/apache/hadoop/yarn/server/resourcemanager/webapp/RMWebServices.java:379
  note: The RM info also answers GET /ws/v1/cluster (RMWSConsts.RM_WEB_SERVICE_PATH) with the same body.
