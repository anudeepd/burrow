- id: rm.scheduler.activities
  daemon: rm
  method: GET
  path: /ws/v1/cluster/scheduler/activities
  contractPath: scheduler/activities
  allowlist: true
  readOnly: true
  params:
  - name: nodeId
    in: query
    type: string
    required: false
