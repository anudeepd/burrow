  - name: groupBy
    in: query
    type: string
    required: false
    values:
    - DIAGNOSTIC
    doc: grouping, only DIAGNOSTIC is supported
    source: hadoop-yarn-server-resourcemanager/org/apache/hadoop/yarn/server/resourcemanager/webapp/RMWebServices.java:746
  produces: *id001
  response:
    object: ActivitiesInfo
    jsonRoot: activities
    shape: '{"activities":{"nodeId":…,"timestamp":…,"dateTime":…,"diagnostic":…,"allocations":[…]}}'
    contentType: application/json; charset=utf-8
  errors: []
  when:
  - conf:yarn.resourcemanager.scheduler.activities.enable=true
  acl: ''
  source: hadoop-yarn-server-resourcemanager/org/apache/hadoop/yarn/server/resourcemanager/webapp/RMWebServices.java:739
  note: 'Live without the flag: {"activities":{"nodeId":…,"diagnostic":"waiting for display"}}. Activities are only populated while the RM records them (bounded by yarn.resourcemanager.scheduler.activities.max-count-per-node).'
