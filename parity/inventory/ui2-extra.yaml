# UI2 (Ember) routes OUT of product scope per PLAN.md §1 non-goals:
#   ATS v2 / flow activity+timeline, YARN native services, deploy service, component instances.
# Also catalogs UI2 router entries that are neither in the in-scope sibling list nor clearly core
# (yarn-log-service, yarn-nodes-heatmap, timeline-error, notauth/notfound/error) and the
# yarn-app children that are service/timeline-backed (components/configs/logs/threaddump).
# Backing sources: UI2 bundle under .cluster/src-extract/ui2/ (beautified .js / decoded .hbs.txt line
# numbers refer to the leading original-line numbers the extractor keeps).
# All REST endpoints named here (ats.*, dashservice.*) are OUTSIDE the RM/NM/JHS contract => restGap: true.
version: 1
derived:
  # ---- ATS v2 flow activity (yarn-flow-activity) ----
  - {id: atsflow.derived.flowName, entity: atsflow, type: string, format: none, from: [], derivation: "payload.info.SYSTEM_INFO_FLOW_NAME", source: "ui2/yarn-ui/serializers/yarn-flow-activity.js:9", restGap: true, altSource: "ATS v2 GET /ws/v2/timeline/flows[] item.info.SYSTEM_INFO_FLOW_NAME"}
  - {id: atsflow.derived.user, entity: atsflow, type: string, format: none, from: [], derivation: "payload.info.SYSTEM_INFO_USER", source: "ui2/yarn-ui/serializers/yarn-flow-activity.js:11", restGap: true, altSource: "ATS v2 /ws/v2/timeline/flows[] item.info.SYSTEM_INFO_USER"}
  - {id: atsflow.derived.uid, entity: atsflow, type: string, format: none, from: [], derivation: "payload.info.UID", source: "ui2/yarn-ui/serializers/yarn-flow-activity.js:13", restGap: true, altSource: "ATS v2 /ws/v2/timeline/flows[] item.info.UID"}
  - {id: atsflow.derived.lastExecDate, entity: atsflow, type: string, format: epoch-datetime, from: [], derivation: "converter.timeStampToDateOnly(payload.info.SYSTEM_INFO_DATE)", source: "ui2/yarn-ui/serializers/yarn-flow-activity.js:10", restGap: true, altSource: "ATS v2 /ws/v2/timeline/flows[] item.info.SYSTEM_INFO_DATE"}
  # ---- ATS v2 flow run brief (yarn-flow, yarn-flow.runs) ----
  - {id: atsflowrun.derived.flowName, entity: atsflowrun, type: string, format: none, from: [], derivation: "payload.info.SYSTEM_INFO_FLOW_NAME", source: "ui2/yarn-ui/serializers/yarn-flowrun-brief.js:13", restGap: true, altSource: "ATS v2 GET /ws/v2/timeline/flow-uid/{flowuid}/runs[] item.info.SYSTEM_INFO_FLOW_NAME"}
  - {id: atsflowrun.derived.runid, entity: atsflowrun, type: string, format: none, from: [], derivation: "payload.info.SYSTEM_INFO_FLOW_RUN_ID", source: "ui2/yarn-ui/serializers/yarn-flowrun-brief.js:14", restGap: true, altSource: "ATS v2 .../runs[] item.info.SYSTEM_INFO_FLOW_RUN_ID"}
  - {id: atsflowrun.derived.shownid, entity: atsflowrun, type: string, format: none, from: [], derivation: "payload.id", source: "ui2/yarn-ui/serializers/yarn-flowrun-brief.js:15", restGap: true, altSource: "ATS v2 .../runs[] item.id"}
  - {id: atsflowrun.derived.createTime, entity: atsflowrun, type: string, format: epoch-datetime, from: [], derivation: "converter.timeStampToDate(payload.createdtime)", source: "ui2/yarn-ui/serializers/yarn-flowrun-brief.js:17", restGap: true, altSource: "ATS v2 .../runs[] item.createdtime"}
  - {id: atsflowrun.derived.endTime, entity: atsflowrun, type: string, format: epoch-datetime, from: [], derivation: "converter.timeStampToDate(payload.info.SYSTEM_INFO_FLOW_RUN_END_TIME)", source: "ui2/yarn-ui/serializers/yarn-flowrun-brief.js:19", restGap: true, altSource: "ATS v2 .../runs[] item.info.SYSTEM_INFO_FLOW_RUN_END_TIME"}
  - {id: atsflowrun.derived.user, entity: atsflowrun, type: string, format: none, from: [], derivation: "payload.info.SYSTEM_INFO_USER", source: "ui2/yarn-ui/serializers/yarn-flowrun-brief.js:21", restGap: true, altSource: "ATS v2 .../runs[] item.info.SYSTEM_INFO_USER"}
  - {id: atsflowrun.derived.cpuVCores, entity: atsflowrun, type: int, format: int, from: [], derivation: "metrics.findBy(id,CPU).values[*] (else -1 -> shown N/A)", source: "ui2/yarn-ui/serializers/yarn-flowrun-brief.js:23", restGap: true, altSource: "ATS v2 .../runs[] item.metrics[] id=CPU"}
  - {id: atsflowrun.derived.memoryUsed, entity: atsflowrun, type: long, format: mb, from: [], derivation: "metrics.findBy(id,MEMORY).values[*] (else -1 -> shown N/A)", source: "ui2/yarn-ui/serializers/yarn-flowrun-brief.js:24", restGap: true, altSource: "ATS v2 .../runs[] item.metrics[] id=MEMORY"}
  - {id: atsflowrun.derived.runDurationTs, entity: atsflowrun, type: long, format: duration, from: [], derivation: "endTimeRaw - createTimeRaw; if <=0 then Date.now() - createTimeRaw", source: "ui2/yarn-ui/models/yarn-flowrun-brief.js:15", restGap: true, altSource: "computed from ATS v2 .../runs[] createdtime + SYSTEM_INFO_FLOW_RUN_END_TIME"}
  # ---- ATS v2 flow run full (yarn-flowrun.info, yarn-flowrun.metrics) ----
  - {id: atsflowrun.derived.metricName, entity: atsflowrun, type: string, format: none, from: [], derivation: "metric.id (MAP:/REDUCE: prefix stripped for display)", source: "ui2/yarn-ui/controllers/yarn-flowrun/metrics.js:6", restGap: true, altSource: "ATS v2 .../run-uid/{uid} item.metrics[].id"}
  - {id: atsflowrun.derived.metricValue, entity: atsflowrun, type: string, format: none, from: [], derivation: "metric.values[Object.keys(metric.values)[0]]", source: "ui2/yarn-ui/controllers/yarn-flowrun/metrics.js:19", restGap: true, altSource: "ATS v2 .../run-uid/{uid} item.metrics[].values"}
  # ---- ATS v2 app of a flow run (yarn-flowrun.info Applications, yarn-flowrun-metric) ----
  - {id: atsapp.derived.appId, entity: atsapp, type: string, format: none, from: [], derivation: "payload.id", source: "ui2/yarn-ui/serializers/yarn-app-flowrun.js:17", restGap: true, altSource: "ATS v2 GET /ws/v2/timeline/run-uid/{uid}/apps[] item.id"}
  - {id: atsapp.derived.type, entity: atsapp, type: string, format: none, from: [], derivation: "payload.info.YARN_APPLICATION_TYPE", source: "ui2/yarn-ui/serializers/yarn-app-flowrun.js:18", restGap: true, altSource: "ATS v2 .../run-uid/{uid}/apps[] item.info.YARN_APPLICATION_TYPE"}
  - {id: atsapp.derived.state, entity: atsapp, type: string, format: enum, from: [], derivation: "payload.info.YARN_APPLICATION_STATE || events[YARN_APPLICATION_FINISHED].info.YARN_APPLICATION_STATE", source: "ui2/yarn-ui/serializers/yarn-app-flowrun.js:23", restGap: true, altSource: "ATS v2 .../run-uid/{uid}/apps[] item.info.YARN_APPLICATION_STATE"}
  - {id: atsapp.derived.elapsedTs, entity: atsapp, type: long, format: duration, from: [], derivation: "finishedTs - startedTs", source: "ui2/yarn-ui/models/yarn-app-flowrun.js:12", restGap: true, altSource: "computed from ATS v2 .../apps[] createdtime + YARN_APPLICATION_FINISHED event.timestamp"}
  - {id: atsapp.derived.cpuVCores, entity: atsapp, type: int, format: int, from: [], derivation: "metrics.findBy(id,CPU).values[*] (else -1 -> N/A)", source: "ui2/yarn-ui/serializers/yarn-app-flowrun.js:11", restGap: true, altSource: "ATS v2 .../apps[] item.metrics[] id=CPU"}
  - {id: atsapp.derived.memoryUsed, entity: atsapp, type: long, format: mb, from: [], derivation: "metrics.findBy(id,MEMORY).values[*] (else -1 -> N/A)", source: "ui2/yarn-ui/serializers/yarn-app-flowrun.js:12", restGap: true, altSource: "ATS v2 .../apps[] item.metrics[] id=MEMORY"}
  - {id: atsapp.derived.metricValue, entity: atsapp, type: string, format: none, from: [], derivation: "first value of item.metrics[metric_id] (sunburst leaf value)", source: "ui2/yarn-ui/routes/yarn-flowrun-metric.js:60", restGap: true, altSource: "ATS v2 run-uid/{uid}/apps[] and entity metrics[].values"}
  # ---- ATS v2 service component (yarn-app.components, component instances) ----
  - {id: atscomponent.derived.name, entity: atscomponent, type: string, format: none, from: [], derivation: "payload.id (COMPONENT entity id)", source: "ui2/yarn-ui/serializers/yarn-service-component.js:28", restGap: true, altSource: "ATS v2 GET /ws/v2/timeline/apps/{appId}/entities/COMPONENT?fields=ALL item.id"}
  - {id: atscomponent.derived.vcores, entity: atscomponent, type: string, format: none, from: [], derivation: "payload.info.RESOURCE_CPU", source: "ui2/yarn-ui/serializers/yarn-service-component.js:29", restGap: true, altSource: "ATS v2 .../entities/COMPONENT item.info.RESOURCE_CPU"}
  - {id: atscomponent.derived.memory, entity: atscomponent, type: string, format: mb-suffix, from: [], derivation: "payload.info.RESOURCE_MEMORY", source: "ui2/yarn-ui/serializers/yarn-service-component.js:30", restGap: true, altSource: "ATS v2 .../entities/COMPONENT item.info.RESOURCE_MEMORY"}
  - {id: atscomponent.derived.instances, entity: atscomponent, type: string, format: int, from: [], derivation: "count of COMPONENT_INSTANCE entities with same COMPONENT_NAME (client-computed; serializer default 0)", source: "ui2/yarn-ui/routes/yarn-app/components.js:30", restGap: true, altSource: "ATS v2 .../entities/COMPONENT_INSTANCE grouped by info.COMPONENT_NAME"}
  - {id: atscomponent.derived.configKey, entity: atscomponent, type: string, format: none, from: [], derivation: "Object.keys(payload.configs)", source: "ui2/yarn-ui/serializers/yarn-service-component.js:11", restGap: true, altSource: "ATS v2 .../entities/COMPONENT item.configs (map key)"}
  - {id: atscomponent.derived.configValue, entity: atscomponent, type: string, format: none, from: [], derivation: "payload.configs[key] || 'N/A'", source: "ui2/yarn-ui/serializers/yarn-service-component.js:13", restGap: true, altSource: "ATS v2 .../entities/COMPONENT item.configs (map value)"}
  # ---- ATS v2 component instance (yarn-component-instances.info, yarn-component-instance.info) ----
  - {id: atscomponentinstance.derived.containerId, entity: atscomponentinstance, type: string, format: none, from: [], derivation: "payload.id", source: "ui2/yarn-ui/serializers/yarn-component-instance.js:9", restGap: true, altSource: "ATS v2 GET /ws/v2/timeline/apps/{appId}/entities/COMPONENT_INSTANCE?fields=ALL item.id"}
  - {id: atscomponentinstance.derived.component, entity: atscomponentinstance, type: string, format: none, from: [], derivation: "info.COMPONENT_NAME", source: "ui2/yarn-ui/serializers/yarn-component-instance.js:10", restGap: true, altSource: "ATS v2 .../entities/COMPONENT_INSTANCE item.info.COMPONENT_NAME"}
  - {id: atscomponentinstance.derived.instanceName, entity: atscomponentinstance, type: string, format: none, from: [], derivation: "info.COMPONENT_INSTANCE_NAME", source: "ui2/yarn-ui/serializers/yarn-component-instance.js:11", restGap: true, altSource: "ATS v2 .../entities/COMPONENT_INSTANCE item.info.COMPONENT_INSTANCE_NAME"}
  - {id: atscomponentinstance.derived.state, entity: atscomponentinstance, type: string, format: enum, from: [], derivation: "info.STATE", source: "ui2/yarn-ui/serializers/yarn-component-instance.js:12", restGap: true, altSource: "ATS v2 .../entities/COMPONENT_INSTANCE item.info.STATE"}
  - {id: atscomponentinstance.derived.startedDate, entity: atscomponentinstance, type: string, format: epoch-datetime, from: [], derivation: "converter.timeStampToDate(info.LAUNCH_TIME) (N/A when <=0)", source: "ui2/yarn-ui/models/yarn-component-instance.js:22", restGap: true, altSource: "ATS v2 .../entities/COMPONENT_INSTANCE item.info.LAUNCH_TIME"}
  - {id: atscomponentinstance.derived.host, entity: atscomponentinstance, type: string, format: none, from: [], derivation: "info.HOSTNAME", source: "ui2/yarn-ui/serializers/yarn-component-instance.js:15", restGap: true, altSource: "ATS v2 .../entities/COMPONENT_INSTANCE item.info.HOSTNAME"}
  - {id: atscomponentinstance.derived.node, entity: atscomponentinstance, type: string, format: none, from: [], derivation: "info.BARE_HOST", source: "ui2/yarn-ui/serializers/yarn-component-instance.js:16", restGap: true, altSource: "ATS v2 .../entities/COMPONENT_INSTANCE item.info.BARE_HOST"}
  - {id: atscomponentinstance.derived.ipAddr, entity: atscomponentinstance, type: string, format: none, from: [], derivation: "info.IP", source: "ui2/yarn-ui/serializers/yarn-component-instance.js:17", restGap: true, altSource: "ATS v2 .../entities/COMPONENT_INSTANCE item.info.IP"}
  - {id: atscomponentinstance.derived.exposedPorts, entity: atscomponentinstance, type: string, format: none, from: [], derivation: "info.EXPOSED_PORTS", source: "ui2/yarn-ui/serializers/yarn-component-instance.js:18", restGap: true, altSource: "ATS v2 .../entities/COMPONENT_INSTANCE item.info.EXPOSED_PORTS"}
  - {id: atscomponentinstance.derived.exitStatusCode, entity: atscomponentinstance, type: string, format: none, from: [], derivation: "info.EXIT_STATUS_CODE", source: "ui2/yarn-ui/serializers/yarn-component-instance.js:19", restGap: true, altSource: "ATS v2 .../entities/COMPONENT_INSTANCE item.info.EXIT_STATUS_CODE"}
  - {id: atscomponentinstance.derived.containerLogURL, entity: atscomponentinstance, type: string, format: url, from: [], derivation: "'#/yarn-app/' + appId + '/logs?attempt=' + attemptId + '&containerid=' + containerId", source: "ui2/yarn-ui/models/yarn-component-instance.js:37", restGap: true, altSource: "derived link into yarn-app.logs"}
  - {id: atscomponentinstance.derived.termLink, entity: atscomponentinstance, type: string, format: url, from: [], derivation: "protocol + '//' + info.BARE_HOST + ':' + nodeManagerPort + '/terminal/terminal.template?container=' + containerId", source: "ui2/yarn-ui/models/yarn-component-instance.js:29", restGap: true, altSource: "NM terminal link (NM host from ATS entity)"}
  # ---- ATS v2 service attempt (yarn-app.configs) ----
  - {id: atsserviceinfo.derived.configKey, entity: atsserviceinfo, type: string, format: none, from: [], derivation: "Object.keys(payload.configs)", source: "ui2/yarn-ui/serializers/yarn-service-info.js:12", restGap: true, altSource: "ATS v2 .../entities/SERVICE_ATTEMPT item.configs (map key)"}
  - {id: atsserviceinfo.derived.configValue, entity: atsserviceinfo, type: string, format: none, from: [], derivation: "payload.configs[key] || 'N/A'", source: "ui2/yarn-ui/serializers/yarn-service-info.js:15", restGap: true, altSource: "ATS v2 .../entities/SERVICE_ATTEMPT item.configs (map value)"}
  # ---- service/component container metrics (metrics-table component) ----
  - {id: atsmetrics.derived.containersDesired, entity: atsmetrics, type: int, format: int, from: [], derivation: "metrics.ContainersDesired", source: "ui2/templates/components/metrics-table.hbs.txt:38", restGap: true, altSource: "ATS v2 entity payload item.metrics[] id=ContainersDesired"}
  - {id: atsmetrics.derived.containersRunning, entity: atsmetrics, type: int, format: int, from: [], derivation: "metrics.ContainersRunning", source: "ui2/templates/components/metrics-table.hbs.txt:39", restGap: true, altSource: "ATS v2 entity payload item.metrics[] id=ContainersRunning"}
  - {id: atsmetrics.derived.containersReady, entity: atsmetrics, type: int, format: int, from: [], derivation: "metrics.ContainersReady", source: "ui2/templates/components/metrics-table.hbs.txt:40", restGap: true, altSource: "ATS v2 entity payload item.metrics[] id=ContainersReady"}
  - {id: atsmetrics.derived.containersFailed, entity: atsmetrics, type: int, format: int, from: [], derivation: "metrics.ContainersFailed", source: "ui2/templates/components/metrics-table.hbs.txt:41", restGap: true, altSource: "ATS v2 entity payload item.metrics[] id=ContainersFailed"}
  - {id: atsmetrics.derived.containersPreempted, entity: atsmetrics, type: int, format: int, from: [], derivation: "metrics.ContainersPreempted", source: "ui2/templates/components/metrics-table.hbs.txt:42", restGap: true, altSource: "ATS v2 entity payload item.metrics[] id=ContainersPreempted"}
  # ---- ATS v2 application log (yarn-log-service) ----
  - {id: atslog.derived.logFileName, entity: atslog, type: string, format: none, from: [], derivation: "model.containerLog.logFileName (route param :filename)", source: "ui2/templates/yarn-log-service.hbs.txt:7", restGap: true, altSource: "route param / ATS v2 GET /ws/v2/applicationlog/containers/{cid}/logs/{file}"}
  - {id: atslog.derived.containerID, entity: atslog, type: string, format: none, from: [], derivation: "model.containerLog.containerID (route param :container_id)", source: "ui2/templates/yarn-log-service.hbs.txt:7", restGap: true, altSource: "route param :container_id"}
  - {id: atslog.derived.logs, entity: atslog, type: string, format: none, from: [], derivation: "text body of ATS v2 applicationlog response", source: "ui2/yarn-ui/adapters/yarn-app-log.js:18", restGap: true, altSource: "ATS v2 GET /ws/v2/applicationlog/containers/{cid}/logs/{file} (Accept text/plain)"}
pages:
  # ================= YARN native services =================
  - id: ui2.yarn-services
    daemon: rm
    route: /yarn-services
    title: "Services"
    classes: [YarnServicesRoute, YarnServicesController, app-table-columns, serviceColumns]
    when: ["other:cluster has applications of type yarn-service (YARN native services)"]
    note: "out of product scope (PLAN.md §1 non-goal): YARN native services list. Rows come from RM /ws/v1/cluster/apps filtered by applicationTypes=yarn-service (adapters/yarn-app.js), so the row data itself is RM AppInfo, but the page + service semantics are deliberately cut."
    sections:
      - id: ui2.yarn-services.chrome
        title: null
        source: "ui2/templates/yarn-services.hbs.txt:19"
        items:
          - {id: ui2.yarn-services.chrome.home, label: "Home", kind: nav, field: static.breadcrumb.home, format: none, source: "ui2/yarn-ui/controllers/yarn-services.js:18"}
          - {id: ui2.yarn-services.chrome.services, label: "Services", kind: nav, field: static.breadcrumb.services, format: none, source: "ui2/yarn-ui/controllers/yarn-services.js:21"}
          - {id: ui2.yarn-services.chrome.new-service, label: "New Service", kind: link, field: static.link.newService, format: url, source: "ui2/templates/yarn-services.hbs.txt:21", note: "href #/yarn-deploy-service"}
          - {id: ui2.yarn-services.chrome.empty, label: "Could not find any services from this cluster", kind: text, field: static.text.noServices, format: none, when: ["other:no yarn-service applications returned"], source: "ui2/templates/yarn-services.hbs.txt:24"}
      - id: ui2.yarn-services.table
        title: null
        source: "ui2/yarn-ui/controllers/app-table-columns.js:100"
        items:
          - {id: ui2.yarn-services.table.service-name, label: "Service Name", kind: column, field: app.name, rest: {resource: rm.apps, path: "app.name"}, format: none, source: "ui2/yarn-ui/controllers/app-table-columns.js:104"}
          - {id: ui2.yarn-services.table.app-tag, label: "Application Tag", kind: column, field: app.id, rest: {resource: rm.apps, path: "app.id"}, format: none, source: "ui2/yarn-ui/controllers/app-table-columns.js:117", note: "UI2 header/contentPath pair is swapped: header 'Application Tag' renders the application id"}
          - {id: ui2.yarn-services.table.app-id, label: "Application ID", kind: column, field: app.applicationTags, rest: {resource: rm.apps, path: "app.applicationTags"}, format: none, source: "ui2/yarn-ui/controllers/app-table-columns.js:124", note: "header 'Application ID' renders applicationTags"}
          - {id: ui2.yarn-services.table.state, label: "State", kind: column, field: app.state, rest: {resource: rm.apps, path: "app.state"}, format: enum, source: "ui2/yarn-ui/controllers/app-table-columns.js:129"}
          - {id: ui2.yarn-services.table.cluster, label: "%Cluster", kind: column, field: app.clusterUsagePercentage, rest: {resource: rm.apps, path: "app.clusterUsagePercentage"}, format: percent-1dp, source: "ui2/yarn-ui/controllers/app-table-columns.js:135"}
          - {id: ui2.yarn-services.table.elapsed, label: "Elapsed Time", kind: column, field: app.elapsedTime, rest: {resource: rm.apps, path: "app.elapsedTime"}, format: duration, source: "ui2/yarn-ui/controllers/app-table-columns.js:141"}
          - {id: ui2.yarn-services.table.user, label: "User", kind: column, field: app.user, rest: {resource: rm.apps, path: "app.user"}, format: none, source: "ui2/yarn-ui/controllers/app-table-columns.js:150"}
          - {id: ui2.yarn-services.table.queue, label: "Queue", kind: column, field: app.queue, rest: {resource: rm.apps, path: "app.queue"}, format: none, source: "ui2/yarn-ui/controllers/app-table-columns.js:156"}
          - {id: ui2.yarn-services.table.started, label: "Started Time", kind: column, field: app.startedTime, rest: {resource: rm.apps, path: "app.startedTime"}, format: epoch-datetime, source: "ui2/yarn-ui/controllers/app-table-columns.js:161"}
          - {id: ui2.yarn-services.table.finished, label: "Finished Time", kind: column, field: app.finishedTime, rest: {resource: rm.apps, path: "app.finishedTime"}, format: epoch-datetime, source: "ui2/yarn-ui/controllers/app-table-columns.js:169", note: "contentPath validatedFinishedTs; rendered via app.formattedFinishedTime"}
  - id: ui2.yarn-deploy-service
    daemon: rm
    route: /yarn-deploy-service
    title: "New Service"
    classes: [YarnDeployServiceRoute, YarnDeployServiceController, deploy-service, service-component-table, service-config-table, service-fileconfig-table]
    when: ["other:YARN native services / dashService (app/v1/services) enabled on RM"]
    note: "out of product scope (PLAN.md §1 non-goal): YARN native services deploy UI (write path). Pure client-side form: Standard/Custom service definition (Service Name/Queue Name/Service Version/Service Lifetime), Service Components table, Service Configurations table, File Configurations table, Save/Deploy actions, Save Template As. Writes via POST/PUT/DELETE app/v1/services (adapters/yarn-servicedef.js). No read datum => no items."
    sections: []
  # ================= component instances / instances =================
  - id: ui2.yarn-component-instances
    daemon: rm
    route: /yarn-component-instances/:component_name
    title: "Component: {componentName}"
    titleDynamic: true
    classes: [YarnComponentInstancesRoute, YarnComponentInstancesController, yarn-component-instances/info, yarn-component-instances/configs]
    when: ["other:app is a YARN service and ATS v2 holds COMPONENT / COMPONENT_INSTANCE entities for it"]
    note: "out of product scope (PLAN.md §1 non-goal): YARN native services component-instances UI. Data from ATS v2 timeline (ws/v2/timeline, outside the RM/NM/JHS contract) => restGap. Child routes: .../info, .../configs (query params service, appid)."
    sections:
      - id: ui2.yarn-component-instances.nav
        title: null
        source: "ui2/templates/yarn-component-instances.hbs.txt:26"
        items:
          - {id: ui2.yarn-component-instances.nav.information, label: "Information", kind: nav, field: static.nav.information, format: none, source: "ui2/templates/yarn-component-instances.hbs.txt:26"}
          - {id: ui2.yarn-component-instances.nav.configurations, label: "Configurations", kind: nav, field: static.nav.configurations, format: none, source: "ui2/templates/yarn-component-instances.hbs.txt:28"}
          - {id: ui2.yarn-component-instances.nav.services, label: "Services", kind: nav, field: static.breadcrumb.services, format: none, source: "ui2/yarn-ui/controllers/yarn-component-instances.js:19"}
      - id: ui2.yarn-component-instances.info
        title: "Component: {componentName}"
        source: "ui2/templates/yarn-component-instances/info.hbs.txt:4"
