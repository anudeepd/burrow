    - id: ui2.cluster-overview.app-usage.chart
      label: null
      kind: chart
      field: app.clusterUsagePercentage
      rest:
        resource: rm.apps
        path: apps.app[].clusterUsagePercentage
      derivation: 'usageByApps.push({label: app.id, link: getApplicationLink(app.id), value: clusterUsagePercentage.toFixed(2)})'
      format: percent-1dp
      source: yarn-ui/components/app-usage-donut-chart.js:8
      scenario: at least one RUNNING app with clusterUsagePercentage > 0.01
      note: 'data source: store.query(''yarn-app'', {state:''RUNNING''}) -> GET /ws/v1/cluster/apps?state=RUNNING'
    - id: ui2.cluster-overview.app-usage.available
      label: Available
      kind: legend
      field: static.chart.available
      source: yarn-ui/components/app-usage-donut-chart.js:23
      note: 100 - sum(clusterUsagePercentage)
    - id: ui2.cluster-overview.app-usage.others
      label: Used by others
      kind: legend
      field: static.chart.usedByOthers
      source: yarn-ui/components/base-usage-donut-chart.js:9
      when:
      - other:more than 8 app slices
    - id: ui2.cluster-overview.app-usage.total
      label: Total
      kind: metric
      field: static.chart.total
      source: yarn-ui/components/donut-chart.js:5
      note: middle label default 'Total', middle value fixed '100%' suffix '%'
  - id: ui2.cluster-overview.queue-usage
