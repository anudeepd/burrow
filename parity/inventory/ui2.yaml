- id: ui2.yarn-node.info
  daemon: nm
  route: /yarn-node/{node_id}/{node_addr}/info
  title: Node Information
  classes:
  - YarnNodeController
  - yarn-node
  - yarn-node/info
  - donut-chart
  - node-menu-panel
  includes:
  - ui2.yarn-node.menu
  sections:
  - id: ui2.yarn-node.info.nm
    title: null
    source: templates/yarn-node/info.hbs.txt:29
    items:
    - id: ui2.yarn-node.info.nm.heading
      label: null
      dynamic: true
      kind: title
      field: node.id
      derivation: '"Node Information: " + model.rmNode.id'
      source: templates/yarn-node/info.hbs.txt:29
    - id: ui2.yarn-node.info.nm.total-vmem
      label: Total Vmem allocated for Containers
      kind: kv
      field: nm.info.totalVmemAllocatedContainersMB
      derivation: divide(totalVmemAllocatedContainersMB, 1024) + " GB"
      format: other:Math.floor(MB/1024) GB
      source: templates/yarn-node/info.hbs.txt:35
    - id: ui2.yarn-node.info.nm.vmem-check
      label: Vmem enforcement enabled
      kind: kv
      field: nm.info.vmemCheckEnabled
      format: boolean
      source: templates/yarn-node/info.hbs.txt:40
    - id: ui2.yarn-node.info.nm.total-pmem
      label: Total Pmem allocated for Containers
      kind: kv
      field: nm.info.totalPmemAllocatedContainersMB
      derivation: divide(totalPmemAllocatedContainersMB, 1024) + " GB"
      format: other:Math.floor(MB/1024) GB
      source: templates/yarn-node/info.hbs.txt:45
    - id: ui2.yarn-node.info.nm.pmem-check
      label: Pmem enforcement enabled
      kind: kv
      field: nm.info.pmemCheckEnabled
      format: boolean
      source: templates/yarn-node/info.hbs.txt:50
    - id: ui2.yarn-node.info.nm.total-vcores
      label: Total VCores allocated for Containers
      kind: kv
      field: nm.info.totalVCoresAllocatedContainers
      format: int
      source: templates/yarn-node/info.hbs.txt:55
    - id: ui2.yarn-node.info.nm.healthy
      label: Node Healthy Status
      kind: kv
      field: nm.info.nodeHealthy
      format: boolean
      source: templates/yarn-node/info.hbs.txt:59
    - id: ui2.yarn-node.info.nm.last-health
      label: Last Node Health Report Time
      kind: kv
      field: nm.info.lastNodeUpdateTime
      format: epoch-datetime
      source: templates/yarn-node/info.hbs.txt:63
    - id: ui2.yarn-node.info.nm.health-report
      label: Node Health Report
      kind: kv
      field: nm.info.healthReport
      format: none
      source: templates/yarn-node/info.hbs.txt:67
    - id: ui2.yarn-node.info.nm.startup
      label: Node Manager Start Time
      kind: kv
      field: nm.info.nmStartupTime
      format: epoch-datetime
      when:
      - value:non-empty
      source: templates/yarn-node/info.hbs.txt:71
    - id: ui2.yarn-node.info.nm.version
      label: Node Manager Version
      kind: kv
      field: nm.info.nodeManagerBuildVersion
      format: none
      source: templates/yarn-node/info.hbs.txt:76
    - id: ui2.yarn-node.info.nm.hadoop-version
      label: Hadoop Version
      kind: kv
      field: nm.info.hadoopBuildVersion
      format: none
      source: templates/yarn-node/info.hbs.txt:81
  - id: ui2.yarn-node.info.memory
    title: Resource - Memory
    source: templates/yarn-node/info.hbs.txt:94
    items:
    - id: ui2.yarn-node.info.memory.title
      label: Resource - Memory
      kind: title
      field: static.node.memoryTitle
      source: templates/yarn-node/info.hbs.txt:94
    - id: ui2.yarn-node.info.memory.used
      label: Used
      kind: legend
      field: node.usedMemoryMB
      rest:
        resource: rm.node
        path: node.usedMemoryMB
      format: mb
      source: yarn-ui/models/yarn-rm-node.js:45
    - id: ui2.yarn-node.info.memory.available
      label: Available
      kind: legend
      field: node.availMemoryMB
      rest:
        resource: rm.node
        path: node.availMemoryMB
      format: mb
      source: yarn-ui/models/yarn-rm-node.js:49
  - id: ui2.yarn-node.info.vcores
    title: Resource - VCores
    source: templates/yarn-node/info.hbs.txt:105
    items:
    - id: ui2.yarn-node.info.vcores.title
      label: Resource - VCores
      kind: title
      field: static.node.vcoresTitle
      source: templates/yarn-node/info.hbs.txt:105
    - id: ui2.yarn-node.info.vcores.used
      label: Used
      kind: legend
      field: node.usedVirtualCores
      rest:
        resource: rm.node
        path: node.usedVirtualCores
      format: int
      source: yarn-ui/models/yarn-rm-node.js:57
    - id: ui2.yarn-node.info.vcores.available
      label: Available
      kind: legend
      field: node.availableVirtualCores
      rest:
        resource: rm.node
        path: node.availableVirtualCores
      format: int
      source: yarn-ui/models/yarn-rm-node.js:61
  - id: ui2.yarn-node.info.gpu
    title: Resources - yarn.io/gpu
    source: templates/yarn-node/info.hbs.txt:131
    when:
    - other:model.nmGpuInfo
    items:
    - id: ui2.yarn-node.info.gpu.title
      label: Resources - yarn.io/gpu
      kind: title
      field: static.node.gpuTitle
      source: templates/yarn-node/info.hbs.txt:131
    - id: ui2.yarn-node.info.gpu.used
      label: Used
      kind: legend
      field: node.usedResource.resourceInformations.resourceInformation.value
      derivation: sum(usedResource.resourceInformations.resourceInformation[].value where name == "yarn.io/gpu")
      format: int
      source: yarn-ui/models/yarn-rm-node.js:74
    - id: ui2.yarn-node.info.gpu.available
      label: Available
      kind: legend
      field: node.availableResource.resourceInformations.resourceInformation.value
      derivation: sum(availableResource.resourceInformations.resourceInformation[].value where name == "yarn.io/gpu")
      format: int
      source: yarn-ui/models/yarn-rm-node.js:82
- id: ui2.yarn-node.yarn-nm-gpu
  daemon: nm
  route: /yarn-node/{node_id}/{node_addr}/yarn-nm-gpu
  title: GPU Information
  classes:
  - YarnNodeRoute
  - routes/yarn-node/yarn-nm-gpu
  - yarn-node/yarn-nm-gpu
  - yarn-nm-gpu-info
  - gpu-donut-chart
  - node-menu-panel
  includes:
  - ui2.yarn-node.menu
  when:
  - other:nmGpuInfo.info.totalGpuDevices
  sections:
  - id: ui2.yarn-node.yarn-nm-gpu.notes
    title: null
    source: yarn-ui/adapters/yarn-nm-gpu.js:8
    items:
    - id: ui2.yarn-node.yarn-nm-gpu.notes.text
      label: null
      kind: text
      field: static.yarn_node_yarn_nm_gpu.notes
      source: yarn-ui/adapters/yarn-nm-gpu.js:8
      note: Data from GET http://{nodeAddr}/ws/v1/node/resources/yarn.io%2Fgpu (adapter yarn-nm-gpu.js:8). NMResourceInfo/PerGpuDeviceInformation are serialised by field/getter names (Jackson) so the keys below match the UI2 template; the JAXB @XmlElement names differ (gpu, driver_version, fb_memory_usage.used/free, utilization.gpu_util, temperature.gpu_temp/gpu_temp_max_threshold).
  - id: ui2.yarn-node.yarn-nm-gpu.summary
    title: Gpu Information
    source: templates/yarn-node/yarn-nm-gpu.hbs.txt:27
    items:
    - id: ui2.yarn-node.yarn-nm-gpu.summary.title
      label: Gpu Information
      kind: title
      field: static.gpu.title
      source: templates/yarn-node/yarn-nm-gpu.hbs.txt:27
    - id: ui2.yarn-node.yarn-nm-gpu.summary.vendor
      label: Vendor
      kind: kv
      field: static.gpu.vendor
      source: templates/yarn-node/yarn-nm-gpu.hbs.txt:31
      note: hardcoded 'NVIDIA'
    - id: ui2.yarn-node.yarn-nm-gpu.summary.driver
      label: Driver Version
      kind: kv
      field: nm.gpu.gpuDeviceInformation.driverVersion
      format: none
      source: templates/yarn-node/yarn-nm-gpu.hbs.txt:35
    - id: ui2.yarn-node.yarn-nm-gpu.summary.count
      label: Total Number Of Gpus
      kind: kv
      field: nm.info.derived.totalGpuDeviceCount
      format: int
      source: templates/yarn-node/yarn-nm-gpu.hbs.txt:40
    - id: ui2.yarn-node.yarn-nm-gpu.summary.empty
      label: No GPUs are found on this node.
      kind: text
      field: static.gpu.empty
      source: templates/yarn-node/yarn-nm-gpu.hbs.txt:52
      when:
      - other:no totalGpuDevices
  - id: ui2.yarn-node.yarn-nm-gpu.device
    title: null
    source: templates/components/yarn-nm-gpu-info.hbs.txt:3
    items:
    - id: ui2.yarn-node.yarn-nm-gpu.device.heading
      label: null
      dynamic: true
      kind: title
      field: nm.gpu.gpuDeviceInformation.gpus.minorNumber
      derivation: '"Gpu Information - (Minor Number " + gpu.minorNumber + ")"'
      source: templates/components/yarn-nm-gpu-info.hbs.txt:3
    - id: ui2.yarn-node.yarn-nm-gpu.device.product-name
      label: Product Name
      kind: kv
      field: nm.gpu.gpuDeviceInformation.gpus.productName
      source: templates/components/yarn-nm-gpu-info.hbs.txt:26
    - id: ui2.yarn-node.yarn-nm-gpu.device.uuid
      label: UUID
      kind: kv
      field: nm.gpu.gpuDeviceInformation.gpus.uuid
      source: templates/components/yarn-nm-gpu-info.hbs.txt:30
    - id: ui2.yarn-node.yarn-nm-gpu.device.current-temp
      label: Current Temperature
      kind: kv
      field: nm.gpu.gpuDeviceInformation.gpus.temperature.currentGpuTemp
      format: float-1dp
      source: templates/components/yarn-nm-gpu-info.hbs.txt:34
    - id: ui2.yarn-node.yarn-nm-gpu.device.max-temp
      label: Max Temperature
      kind: kv
      field: nm.gpu.gpuDeviceInformation.gpus.temperature.maxGpuTemp
      format: float-1dp
      source: templates/components/yarn-nm-gpu-info.hbs.txt:38
    - id: ui2.yarn-node.yarn-nm-gpu.device.memory-used
      label: Used
      kind: legend
      field: nm.gpu.gpuDeviceInformation.gpus.gpuMemoryUsage.usedMemoryMiB
      format: other:MiB
      source: yarn-ui/components/gpu-donut-chart.js:8
    - id: ui2.yarn-node.yarn-nm-gpu.device.memory-avail
      label: Available
      kind: legend
      field: nm.gpu.gpuDeviceInformation.gpus.gpuMemoryUsage.availMemoryMiB
      format: other:MiB
      source: yarn-ui/components/gpu-donut-chart.js:12
    - id: ui2.yarn-node.yarn-nm-gpu.device.utilized
      label: Utilized
      kind: legend
      field: nm.gpu.gpuDeviceInformation.gpus.gpuUtilizations.overallGpuUtilization
      format: percent-1dp
      source: yarn-ui/components/gpu-donut-chart.js:17
    - id: ui2.yarn-node.yarn-nm-gpu.device.util-avail
      label: Available
      kind: legend
      field: nm.gpu.gpuDeviceInformation.gpus.gpuUtilizations.overallGpuUtilization
      derivation: 100 - overallGpuUtilization
      format: percent-1dp
      source: yarn-ui/components/gpu-donut-chart.js:22
