    - id: ui2.cluster-overview.queue-usage.chart
      label: null
      kind: chart
      field: queue.absoluteUsedCapacity
      derivation: 'usageByQueues.push({label: queue.id, link: getQueueLink(queue.id), value: absUsedCapacity.toFixed(2)}) for leaf queues'
      format: percent-1dp
      source: yarn-ui/components/queue-usage-donut-chart.js:11
      scenario: capacity scheduler with leaf queues using capacity
      note: queue data from GET /ws/v1/cluster/scheduler; fair-queue model has no absUsedCapacity => only capacity scheduler contributes
    - id: ui2.cluster-overview.queue-usage.available
      label: Available
      kind: legend
      field: static.chart.available
      source: yarn-ui/components/queue-usage-donut-chart.js:25
