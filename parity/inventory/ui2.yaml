  route: /yarn-nodes/table
  title: Nodes
  classes:
  - YarnNodesController
  - YarnNodesTableController
  - YarnNodesTableRoute
  - yarn-nodes
  - yarn-nodes/table
  includes:
  - ui2.shared.chrome
  - ui2.shared.emtable
  sections:
  - id: ui2.yarn-nodes.table.tabs
    title: null
    source: templates/yarn-nodes.hbs.txt:24
    items:
    - id: ui2.yarn-nodes.table.tabs.information
      label: Information
      kind: nav
      field: static.nodes.tabInformation
      format: url
      source: templates/yarn-nodes.hbs.txt:26
    - id: ui2.yarn-nodes.table.tabs.status
      label: Node Status
      kind: nav
      field: static.nodes.tabStatus
      format: url
      source: templates/yarn-nodes.hbs.txt:31
    - id: ui2.yarn-nodes.table.tabs.heatmap
      label: Nodes Heatmap Chart
      kind: nav
      field: static.nodes.tabHeatmap
      format: url
      source: templates/yarn-nodes.hbs.txt:36
  - id: ui2.yarn-nodes.table.list
    title: null
    source: templates/yarn-nodes/table.hbs.txt:20
    items:
    - id: ui2.yarn-nodes.table.list.empty
      label: No nodes found on this cluster
      kind: text
      field: static.nodes.empty
      source: templates/yarn-nodes/table.hbs.txt:20
      when:
      - other:no nodes
    - id: ui2.yarn-nodes.table.list.node-label
      label: Node Label
      kind: column
      field: node.derived.nodeLabelsAsString
      format: none
      source: yarn-ui/controllers/yarn-nodes/table.js:21
    - id: ui2.yarn-nodes.table.list.rack
      label: Rack
      kind: column
      field: node.rack
      rest:
        resource: rm.nodes
        path: nodes.node[].rack
      format: none
      source: yarn-ui/controllers/yarn-nodes/table.js:26
    - id: ui2.yarn-nodes.table.list.state
      label: Node State
      kind: column
      field: node.state
      rest:
        resource: rm.nodes
        path: nodes.node[].state
      format: enum
      source: yarn-ui/controllers/yarn-nodes/table.js:32
      note: em-table-status-cell
    - id: ui2.yarn-nodes.table.list.address
      label: Node Address
      kind: column
      field: node.id
      rest:
        resource: rm.nodes
        path: nodes.node[].id
      format: none
      source: yarn-ui/controllers/yarn-nodes/table.js:38
    - id: ui2.yarn-nodes.table.list.http-address
      label: Node HTTP Address
      kind: column
      field: node.nodeHTTPAddress
      rest:
        resource: rm.nodes
        path: nodes.node[].nodeHTTPAddress
      format: url
      source: yarn-ui/controllers/yarn-nodes/table.js:44
      note: 'href #/yarn-node/{id}/{enc(nodeHTTPAddress)}/info; blanked for SHUTDOWN/LOST'
    - id: ui2.yarn-nodes.table.list.containers
      label: Containers
      kind: column
      field: node.numContainers
      rest:
        resource: rm.nodes
        path: nodes.node[].numContainers
      format: int
      source: yarn-ui/controllers/yarn-nodes/table.js:65
    - id: ui2.yarn-nodes.table.list.mem-used
      label: Mem Used
      kind: column
      field: node.usedMemoryMB
      rest:
        resource: rm.nodes
        path: nodes.node[].usedMemoryMB
      format: mb
      source: yarn-ui/controllers/yarn-nodes/table.js:70
      note: cellDefinition type 'memory' (usedMemoryBytes = MB*1024*1024)
    - id: ui2.yarn-nodes.table.list.mem-available
      label: Mem Available
      kind: column
      field: node.availMemoryMB
      rest:
        resource: rm.nodes
        path: nodes.node[].availMemoryMB
      format: mb
      source: yarn-ui/controllers/yarn-nodes/table.js:78
    - id: ui2.yarn-nodes.table.list.vcores-used
      label: VCores Used
      kind: column
      field: node.usedVirtualCores
      rest:
        resource: rm.nodes
        path: nodes.node[].usedVirtualCores
      format: int
      source: yarn-ui/controllers/yarn-nodes/table.js:86
    - id: ui2.yarn-nodes.table.list.vcores-available
      label: VCores Available
      kind: column
      field: node.availableVirtualCores
      rest:
        resource: rm.nodes
        path: nodes.node[].availableVirtualCores
      format: int
      source: yarn-ui/controllers/yarn-nodes/table.js:91
    - id: ui2.yarn-nodes.table.list.last-health-update
      label: Last Health Update
      kind: column
      field: node.lastHealthUpdate
      rest:
        resource: rm.nodes
        path: nodes.node[].lastHealthUpdate
      format: epoch-datetime
      source: yarn-ui/controllers/yarn-nodes/table.js:96
    - id: ui2.yarn-nodes.table.list.health-report
      label: Health-Report
      kind: column
      field: node.healthReport
      rest:
        resource: rm.nodes
        path: nodes.node[].healthReport
      format: none
      source: yarn-ui/controllers/yarn-nodes/table.js:102
    - id: ui2.yarn-nodes.table.list.version
      label: Version
      kind: column
      field: node.version
      rest:
        resource: rm.nodes
        path: nodes.node[].version
      format: none
      source: yarn-ui/controllers/yarn-nodes/table.js:108
- id: ui2.yarn-nodes.heatmap
  daemon: rm
  route: /yarn-nodes/heatmap
  title: Nodes Heatmap Chart
  classes:
  - YarnNodesController
  - YarnNodesHeatmapController
  - YarnNodesHeatmapRoute
  - yarn-nodes/heatmap
  - nodes-heatmap
  includes:
  - ui2.shared.chrome
  sections:
  - id: ui2.yarn-nodes.heatmap.chart
    title: null
    source: templates/yarn-nodes/heatmap.hbs.txt:19
    items:
    - id: ui2.yarn-nodes.heatmap.chart.title
      label: null
      dynamic: true
      kind: title
      field: static.nodes.heatmapTitle
      derivation: '"Node Heatmap Chart (Usage of " + selectedOption + ")"'
      source: templates/yarn-nodes/heatmap.hbs.txt:19
      note: selectedOption from the category select (Memory/VCores/Containers)
    - id: ui2.yarn-nodes.heatmap.chart.filter
      label: null
      kind: text
      field: static.nodes.heatmapFilter
      source: templates/components/nodes-heatmap.hbs.txt:4
      note: input placeholder 'Enter part of host/rack to filter nodes'
    - id: ui2.yarn-nodes.heatmap.chart.memory
      label: Memory
      kind: text
      field: static.nodes.heatmapMemory
      source: yarn-ui/components/nodes-heatmap.js:11
      note: select option; cell usage = usedMemoryMB / (usedMemoryMB + availMemoryMB)
    - id: ui2.yarn-nodes.heatmap.chart.vcores
      label: VCores
      kind: text
      field: static.nodes.heatmapVcores
      source: yarn-ui/components/nodes-heatmap.js:12
      note: cell usage = usedVirtualCores / (usedVirtualCores + availableVirtualCores)
    - id: ui2.yarn-nodes.heatmap.chart.containers
      label: Containers
      kind: text
      field: static.nodes.heatmapContainers
      source: yarn-ui/components/nodes-heatmap.js:13
      note: cell usage = numContainers / totalContainers
    - id: ui2.yarn-nodes.heatmap.chart.legend
      label: Used
      dynamic: true
      kind: legend
      field: static.nodes.heatmapLegend
      derivation: (ratio*100).toFixed(1) + "% Used" for i in 1..5 (ratio = i*0.2 - 0.1)
      source: yarn-ui/components/nodes-heatmap.js:90
    - id: ui2.yarn-nodes.heatmap.chart.clear
      label: Clear
      kind: button
      field: static.nodes.heatmapClear
      source: yarn-ui/components/nodes-heatmap.js:95
      when:
      - other:selectedCategory != 0
