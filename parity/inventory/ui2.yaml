version: 1
derived:
- id: app.derived.allocatedResourceText
  entity: app
  type: string
  format: other:<memory> MBs, <vCores> VCores
  from:
  - app.allocatedMB
  - app.allocatedVCores
  derivation: converter.resourceToString(allocatedMB, allocatedVCores) => mem + " MBs, " + cpu + " VCores" (each Math.max(0, x))
  source: yarn-ui/utils/converter.js:25
- id: app.derived.preemptedResourceText
  entity: app
  type: string
  format: other:<memory> MBs, <vCores> VCores
  from:
  - app.preemptedResourceMB
  - app.preemptedResourceVCores
  derivation: converter.resourceToString(preemptedResourceMB, preemptedResourceVCores)
  source: yarn-ui/models/yarn-app.js:65
- id: app.derived.aggregatedResourceUsageText
  entity: app
  type: string
  format: other:<memory> MBs, <vCores> VCores (× Secs)
  from:
  - app.memorySeconds
  - app.vcoreSeconds
  derivation: converter.resourceToString(memorySeconds, vcoreSeconds) + " (× Secs)"
  source: yarn-ui/models/yarn-app.js:68
- id: app.derived.remainingTimeoutSeconds
  entity: app
  type: number
  format: int
  from: []
  derivation: payload.timeouts.timeout[0].remainingTimeInSeconds (serializer internalNormalizeSingleResponse); -1 when the /apps/{id} payload has no timeouts
  source: yarn-ui/serializers/yarn-app.js:9
  restGap: true
  altSource: GET /ws/v1/cluster/apps/{appid}/timeouts -> timeouts.timeout[0].remainingTimeInSeconds
- id: app.derived.applicationExpiryTime
  entity: app
  type: string
  format: epoch-datetime
  from:
  - app.finishedTime
  derivation: 'payload.timeouts.timeout[0].expiryTime ? isoDateToDate(expiryTime) : timeStampToDate(finishedTime)'
  source: yarn-ui/serializers/yarn-app.js:8
  restGap: true
  altSource: GET /ws/v1/cluster/apps/{appid}/timeouts -> timeouts.timeout[0].expiryTime
- id: attempt.derived.appMasterContainerId
  entity: attempt
  type: string
  format: none
  from:
  - attempt.containerId
  derivation: amContainerId = attempt.containerId (serializer attribute amContainerId is absent from RM AppAttemptInfo; model falls back to containerId via appMasterContainerId())
  source: yarn-ui/models/yarn-app-attempt.js:49
- id: attempt.derived.elapsedTimeText
  entity: attempt
  type: string
  format: duration
  from:
  - attempt.startTime
  - attempt.finishedTime
  derivation: elapsedMs = finishedTs - startTs; if (elapsedMs <= 0) elapsedMs = Date.now() - startTs; converter.msToElapsedTimeUnit(elapsedMs)
  source: yarn-ui/models/yarn-app-attempt.js:77
- id: attempt.derived.diagnosticsInfo
  entity: attempt
  type: string
  format: none
  from: []
  derivation: payload.diagnosticsInfo (not serialised by RM AppAttemptInfo.java:42-53)
  source: yarn-ui/serializers/yarn-app-attempt.js:23
  restGap: true
  altSource: none (ATS attempt info has no diagnostics either)
- id: container.derived.appAttemptContainerLogsUrl
  entity: container
  type: string
  format: url
  from:
  - container.containerId
  derivation: '"#/yarn-app/" + attemptIdToAppId(containerIdToAttemptId(id)) + "/logs?attempt=" + attemptId + "&containerid=" + id'
  source: yarn-ui/models/yarn-container.js:42
- id: container.derived.masterNodeUrl
  entity: container
  type: string
  format: url
  from:
  - container.nodeId
  - container.nodeHttpAddress
  derivation: '"#/yarn-node/" + nodeId + "/" + encodeURIComponent(nodeHttpAddress) + "/info/"'
  source: yarn-ui/models/yarn-container.js:38
- id: node.derived.nodeLabelsAsString
  entity: node
  type: string
  format: none
  from:
  - node.nodeLabels
  derivation: 'nodeLabels && nodeLabels.length > 0 ? nodeLabels[0] : "default"'
  source: yarn-ui/models/yarn-rm-node.js:18
  note: REST nodeLabels is an array; UI2 shows only the first label
- id: node.derived.toolTipText
  entity: node
  type: string
  format: 'other:<p>Rack: {rack}</p><p>Host: {nodeHostName}</p>'
  from:
  - node.rack
  - node.nodeHostName
  derivation: '"<p>Rack: " + rack + "</p>" + "<p>Host: " + nodeHostName + "</p>"'
  source: yarn-ui/models/yarn-rm-node.js:96
- id: queue.derived.partitionNames
  entity: queue
  type: string
  format: join-comma
  from:
  - queue.capacities.queueCapacitiesByPartition.partitionName
  derivation: capacities.queueCapacitiesByPartition.map(c => c.partitionName || "Default partition")
  source: yarn-ui/serializers/yarn-queue/capacity-queue.js:44
- id: nm.info.derived.totalGpuDeviceCount
  entity: nm.info
  type: int
  format: int
  from:
  - nm.info.totalGpuDevices
  derivation: model.nmGpuInfo.info.totalGpuDevices.length (totalGpuDevices is a List<GpuDevice>)
  source: templates/yarn-node/yarn-nm-gpu.hbs.txt:40
- id: log.derived.fileUrl
  entity: log
  type: string
  format: url
  from:
  - log.fileName
  derivation: 'containerLogURL / the log-file endpoint URL UI2 builds from the node/container coordinates (utils/converter.js: splitForAppLogs / logFileURL helpers); used as the href of the log-file link'
  source: yarn-ui/adapters/yarn-container-log.js:1
  restGap: true
  altSource: the URL is reconstructible from the container id + node address; the log-serving endpoints are listed in rest-daemon.yaml (nm.containerlogs / ahs.containerlogs / jhs.containerlogs)
pages:
- id: ui2.shared.chrome
  daemon: rm
  route: (every UI2 page)
  title: (per page)
  classes:
  - ApplicationController
  - ApplicationRoute
  - application
  - navbar
  - em-breadcrumbs
  - breadcrumb-bar
  - info-tooltip
  sections:
  - id: ui2.shared.chrome.navbar
    title: null
    source: templates/application.hbs.txt:4
    items:
    - id: ui2.shared.chrome.navbar.brand
      label: null
      kind: text
      field: static.navbar.brand
      source: templates/application.hbs.txt:9
      note: img assets/images/hadoop_logo.png alt='Apache Hadoop'
    - id: ui2.shared.chrome.navbar.toggle
      label: Toggle navigation
      kind: text
      field: static.navbar.toggle
      source: templates/application.hbs.txt:12
      note: screen-reader only
    - id: ui2.shared.chrome.navbar.cluster-overview
      label: Cluster Overview
      kind: nav
      field: static.nav.clusterOverview
      format: url
      source: templates/application.hbs.txt:39
      note: route cluster-overview
    - id: ui2.shared.chrome.navbar.queues
      label: Queues
      kind: nav
      field: static.nav.queues
      format: url
      source: templates/application.hbs.txt:42
      note: route yarn-queues model=root
    - id: ui2.shared.chrome.navbar.applications
      label: Applications
      kind: nav
      field: static.nav.applications
      format: url
      source: templates/application.hbs.txt:46
      note: route yarn-apps.apps
    - id: ui2.shared.chrome.navbar.services
      label: Services
      kind: nav
      field: static.nav.services
      format: url
      source: templates/application.hbs.txt:52
      note: OUT OF SCOPE (yarn-services, delegated)
    - id: ui2.shared.chrome.navbar.flow-activity
      label: Flow Activity
      kind: nav
      field: static.nav.flowActivity
      format: url
      source: templates/application.hbs.txt:57
      when:
      - other:!isTimelineUnHealthy
      note: OUT OF SCOPE (timeline, delegated); disabled when ATS unhealthy
    - id: ui2.shared.chrome.navbar.nodes
      label: Nodes
      kind: nav
      field: static.nav.nodes
      format: url
      source: templates/application.hbs.txt:62
      note: route yarn-nodes.table
    - id: ui2.shared.chrome.navbar.tools
      label: Tools
      kind: nav
      field: static.nav.tools
      format: url
      source: templates/application.hbs.txt:67
      note: route yarn-tools.yarn-conf
    - id: ui2.shared.chrome.navbar.logged-in
      label: 'Logged in as: '
      dynamic: true
      kind: text
      field: clusteruser.derived.loggedInText
      fields:
      - clusteruser.requestedUser
      rest:
        resource: rm.cluster-user-info
        path: requestedUser
      derivation: '"Logged in as: " + userInfo.requestedUser'
      format: none
      when:
      - value:non-empty
      source: templates/application.hbs.txt:76
      note: wrapper is {{#if userInfo}}; span.username holds the value
  - id: ui2.shared.chrome.footer
    title: null
    source: templates/application.hbs.txt:53
    items:
    - id: ui2.shared.chrome.footer.license
      label: Licensed under the Apache License, Version 2.0.
      kind: link
      field: static.footer.license
      format: url
      source: templates/application.hbs.txt:96
      note: href env.app.hrefs.license
    - id: ui2.shared.chrome.footer.timezone
      label: Timezone
      dynamic: true
      kind: text
      field: static.footer.timezone
      source: templates/application.hbs.txt:99
      note: <span>Timezone <b>{{env.app.timezone}}</b></span>; env config, not REST
    - id: ui2.shared.chrome.footer.hadoop-version
      label: null
      dynamic: true
      kind: text
      field: cluster.info.hadoopVersion
      rest:
        resource: rm.info
        path: clusterInfo.hadoopVersion
      derivation: '"v" + clusterInfo.hadoopVersion'
      format: none
      source: templates/application.hbs.txt:107
    - id: ui2.shared.chrome.footer.cluster-state
      label: null
      kind: text
      field: cluster.info.state
      rest:
        resource: rm.info
        path: clusterInfo.state
      format: enum
      source: templates/application.hbs.txt:110
      tooltip: 'Hadoop Version: {{clusterInfo.getYARNBuildHash}} Started on: {{date-formatter clusterInfo.startedOn}}'
    - id: ui2.shared.chrome.footer.started-at
      label: 'Started at '
      dynamic: true
      kind: text
      field: cluster.info.startedOn
      rest:
        resource: rm.info
        path: clusterInfo.startedOn
      derivation: '"Started at " + dateFormatter(startedOn)'
      format: epoch-datetime
      source: templates/application.hbs.txt:112
  - id: ui2.shared.chrome.breadcrumb
    title: null
    source: templates/components/breadcrumb-bar.hbs.txt:2
    items:
    - id: ui2.shared.chrome.breadcrumb.home
      label: Home
      kind: nav
      field: static.breadcrumb.home
      format: url
      source: yarn-ui/controllers/yarn-apps.js:4
      note: em-breadcrumbs item text; every page's breadcrumbs start with Home (route application)
    - id: ui2.shared.chrome.breadcrumb.refresh
      label: Refresh
      kind: button
      field: static.breadcrumb.refresh
      source: templates/components/breadcrumb-bar.hbs.txt:21
      note: hidden when hideRefresh=true
  includes: []
