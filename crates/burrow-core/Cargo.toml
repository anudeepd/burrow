[package]
name = "burrow-core"
description = "Core of burrow: config, Hadoop conf discovery, upstream clients, HA, cache"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
bytes = "1.12.1"
futures-util = "0.3.34"
http = "1.5.0"
httpdate = "1.0.3"
moka = { version = "0.12.16", features = ["sync"] }
parking_lot = "0.12.5"
quick-xml = "0.42.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "stream", "charset"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs", "io-util"] }
toml = "1.1.6"
tracing = "0.1.44"
url = "2.5.8"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["full"] }
