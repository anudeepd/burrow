sonar.organization=anudeepd
sonar.projectKey=anudeepd_burrow

# Analyze Burrow's application source only. Large tracked YARN/Spark captures live under fixtures/ and parity/.
sonar.sources=crates,web/src
sonar.exclusions=**/tests/**,**/__tests__/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/*.d.ts,**/*.gen.ts,**/target/**,**/dist/**

sonar.javascript.lcov.reportPaths=web/coverage/lcov.info
sonar.rust.lcov.reportPaths=coverage/rust.lcov
